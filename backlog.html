<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cherokee Corpus App — Task Backlog UI</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-gold: #f59e0b;
      --priority-high: #ef4444;
      --priority-med: #f59e0b;
      --priority-low: #10b981;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--text-main); padding: 24px; min-height: 100vh; }
    header { max-width: 1200px; margin: 0 auto 24px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px; border-bottom: 1px solid var(--card-border); padding-bottom: 16px; }
    h1 { font-size: 1.5rem; font-weight: 700; display: flex; align-items: center; gap: 10px; }
    .subtitle { color: var(--text-muted); font-size: 0.875rem; margin-top: 4px; }
    .controls { max-width: 1200px; margin: 0 auto 24px; display: flex; gap: 12px; flex-wrap: wrap; }
    input[type="text"], select { background: var(--card-bg); border: 1px solid var(--card-border); color: var(--text-main); padding: 10px 14px; border-radius: 8px; font-size: 0.9rem; outline: none; }
    input[type="text"] { flex: 1; min-width: 250px; }
    input[type="text"]:focus, select:focus { border-color: var(--accent); }
    .grid { max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 16px; }
    .card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 12px; padding: 16px; transition: transform 0.15s ease, border-color 0.15s ease; display: flex; flex-direction: column; justify-content: space-between; }
    .card:hover { border-color: var(--accent); transform: translateY(-2px); }
    .card-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 10px; }
    .title { font-weight: 600; font-size: 1rem; color: var(--text-main); line-height: 1.4; }
    .badge { padding: 4px 8px; border-radius: 6px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; white-space: nowrap; }
    .badge-high { background: rgba(239, 68, 68, 0.2); color: var(--priority-high); border: 1px solid var(--priority-high); }
    .badge-med { background: rgba(245, 158, 11, 0.2); color: var(--priority-med); border: 1px solid var(--priority-med); }
    .badge-low { background: rgba(16, 185, 129, 0.2); color: var(--priority-low); border: 1px solid var(--priority-low); }
    .note-box { background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(255,255,255,0.05); border-radius: 8px; padding: 12px; font-size: 0.85rem; color: var(--text-muted); white-space: pre-wrap; margin-top: 10px; max-height: 200px; overflow-y: auto; line-height: 1.5; font-family: monospace; }
    .stats { color: var(--accent); font-weight: 600; }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>📋 Cherokee Corpus App — Task Backlog UI</h1>
      <p class="subtitle">Interactive visual backlog connected to <code>backlog.json</code></p>
    </div>
    <div>Total Tasks: <span id="count" class="stats">0</span></div>
  </header>

  <div class="controls">
    <input type="text" id="search" placeholder="Search tasks, tags, target files..." oninput="render()">
    <select id="priorityFilter" onchange="render()">
      <option value="all">All Priorities</option>
      <option value="high">High Priority (Priority >= 10)</option>
      <option value="med">Medium Priority (Priority 5 - 9)</option>
      <option value="low">Low Priority (Priority < 5)</option>
    </select>
  </div>

  <div class="grid" id="grid">Loading tasks...</div>

  <script>
    // Embedded backlog dataset for direct file:// access without CORS issues
    let backlogData = [
      {
        "title": "Task 1.4: [DATA] Pre-packaged Cherokee Narratives & Stories Catalog (Post-MVP)",
        "priority": 3,
        "note": "[DATA] [Post-MVP] [Priority: Medium] [Data]\nTarget: Cherokee Narrative & Story Data Packages\nNote: Data task - all editing and addition of narrative data packages must be done manually by a human.\nSpec:\n1. Manually compile, edit, and add pre-packaged Cherokee narrative and story data packages to the catalog.\n2. Verify narrative text accuracy and sentence alignment manually before inclusion in story package releases."
      },
      {
        "title": "Task 3.4: [DATA] Solitary Form Labeling & Part of Speech Data Cleanup",
        "priority": 5,
        "note": "[DATA] [MVP] [Priority: Medium] [Data Cleanup]\nTarget: Corpus Word Form & Part of Speech Data\nNote: Data cleanup task - all data edits must be done manually by a human, not via code implementation.\nSpec:\n1. Manually review entries with solitary word forms and update labeling (label as Base Form rather than Singular in the corpus dataset).\n2. Audit, clean up, and format part of speech tags across solitary form entries in the dictionary data."
      },
      {
        "title": "Task 3.5: App-Wide Dynamic Entry Transliteration Option",
        "priority": 5,
        "note": "[MVP] [Priority: Medium] [Feature]\nTarget Files: App.tsx, utils.tsx, components/EntryCard.tsx, components/EntryDetail.tsx\nSpec:\n1. In Settings modal under Transliteration options, add a checkbox: \"Change entry transliteration\" (enabled by default).\n2. When checked on, dynamically convert official CED word entry transliterations throughout app from standard CED \"classic\" orthography to user's preferred style (Uchihara Aspiration or Reverse Aspiration) using convertTransliterationStyle(text, 'classic', preferredStyle).\nVerification: Select Aspiration mode in Settings with checkbox on -> CED entry cards and details dynamically render transliterations in chosen Uchihara orthography across all views."
      },
      {
        "title": "Task 3.6: Transliteration Style Explanations & Algorithm Audit",
        "priority": 5,
        "note": "[MVP] [Priority: Medium] [Documentation] [Feature]\nTarget Files: App.tsx, utils.tsx\nSpec:\n1. Add detailed inline explanations under Preferred Transliteration Style dropdown in Settings modal detailing Classic CED, Uchihara Aspiration, and Reverse Aspiration.\n2. Perform thorough audit of transliteration engine in utils.tsx to test for edge-case errors, missing syllable combinations, or phonetic conversion issues.\nVerification: Open Settings -> Explanatory text renders beneath Transliteration options. Transliteration conversion functions pass edge-case test suite without errors."
      },
      {
        "title": "Task 4.1: My Library Gold Package & Package Export Settings",
        "priority": 10,
        "note": "[MVP] [Priority: High] [Feature]\nTarget Files: components/PackageManagerTab.tsx, components/PackageExportModal.tsx\nSpec:\n1. Encapsulate all user-created words, sentences, and custom dictionary entries into default package named \"My Library\".\n2. Highlight \"My Library\" in UI with a distinct Gold color badge/accent.\n3. In PackageExportModal, add a checkbox: [ ] Allow package to be edited by importer.\nVerification: User personal entries render under \"My Library\" (Gold badge). Export package modal includes Allow package to be edited checkbox option."
      },
      {
        "title": "Task 4.2: Fix Package Import Compatibility (v1 vs v2 JSON schemas)",
        "priority": 10,
        "note": "[MVP] [Priority: High] [Bug]\nTarget Files: components/PackageManagerContext.tsx, components/usePackageHooks.ts\nSpec:\n1. Write schema normalizer normalizePackageData() supporting legacy and updated JSON keys for word_forms, sentences, dictionary, and metadata.\nVerification: Import legacy package ZIP -> Import succeeds cleanly."
      },
      {
        "title": "Task 4.3: Package Import ZIP Error Banners",
        "priority": 10,
        "note": "[MVP] [Priority: High] [UI] [Bug]\nTarget Files: components/PackageManagerTab.tsx, components/UI.tsx\nSpec:\n1. If imported ZIP file is corrupted or missing manifest.json, display explicit red error toast without crashing app: \"Import Failed: Invalid package ZIP format.\"\nVerification: Drop invalid zip -> Red error toast displays cleanly."
      },
      {
        "title": "Task 4.4: Editable Packages & Version Control (Post-MVP)",
        "priority": 2,
        "note": "[Post-MVP] [Priority: Low] [Feature] [Architecture]\nTarget Files: components/PackageManagerContext.tsx\nSpec:\n1. Defer editable package sync to Post-MVP Firebase/Cloud Sync architecture.\n2. Implement primitive version control saving historical revisions of packages without complex merging."
      },
      {
        "title": "Task 6.1: Tone Regex Engine & Tone Rendering Preferences",
        "priority": 5,
        "note": "[MVP] [Priority: Medium] [Feature]\nTarget Files: utils.tsx, components/EntryDetail.tsx\nSpec:\n1. Implement tone conversion utilities supporting underdot notation (ạ, ẹ), superscript numbers (a¹, e²³), and syllabary tone annotations.\n2. Add tone style selection toggle in settings menu.\nVerification: Select underdot tone setting -> Dictionary entries update tone display dynamically."
      },
      {
        "title": "Task 7.3: Interactive Onboarding Tutorial",
        "priority": 5,
        "note": "[MVP] [Priority: Medium] [UI]\nTarget Files: App.tsx, components/UI.tsx\nSpec:\n1. Build a 3-step first-time walkthrough overlay introducing Search, Reader, and Custom Lists. Store hasSeenTutorial in localStorage.\nVerification: Clear localStorage -> Refresh app -> Tutorial overlay appears."
      },
      {
        "title": "Task 7.4: App-wide UI Aesthetics Overhaul",
        "priority": 10,
        "note": "[MVP] [Priority: High] [UI]\nTarget Files: App.tsx, index.css, tailwind.config.js\nSpec:\n1. Modern design system with dark/light HSL palettes, glassmorphism cards, Inter/Outfit typography, and micro-animations.\nVerification: Validate visual aesthetics across dark and light themes."
      },
      {
        "title": "Task 8.1: Full App Master ZIP Backup Export & Restore",
        "priority": 10,
        "note": "[MVP] [Priority: High] [Bug] [Architecture]\nTarget Files: components/CorpusContext.tsx, App.tsx\nProblem: Current backup uses simple JSON dump that drops audio files and package distinctions.\nSpec:\n1. Refactor exportBackup() to generate a single master .zip file (cherokee_corpus_full_backup_[date].zip).\n2. Master ZIP Structure: manifest.json, packages/my_library.zip (Gold package), packages/[package_id].zip.\n3. Standalone Usability: Users can extract any individual package.zip from master backup and re-import independently.\n4. Refactor restoreBackup() to unzip master backup and restore all package .zip files into IndexedDB.\nVerification: Export full backup -> Extract master ZIP -> Sub-directory contains valid .zip files -> Restore master ZIP -> 100% of state restored."
      },
      {
        "title": "Task 8.2: Online Cloud Backup & Accounts (Post-MVP)",
        "priority": 2,
        "note": "[Post-MVP] [Priority: Low] [Feature]\nTarget Files: components/CorpusContext.tsx\nSpec: Firebase / Cloud authentication & remote sync integration."
      },
      {
        "title": "Task 9.1: Widgets System Completion",
        "priority": 5,
        "note": "[Post-MVP] [Priority: Medium] [Feature]\nTarget Files: components/WidgetsTab.tsx, components/WidgetViewer.tsx\nSpec: Complete and polish 5 built-in widgets: Syllabary Learner, Transliteration Utility, Pronoun Game, Grammar Guide, Custom Widget Importer."
      },
      {
        "title": "Task 9.2: Finish Mass Editor Tool",
        "priority": 5,
        "note": "[Post-MVP] [Priority: Medium] [Feature]\nTarget Files: components/InvestigationQueue.tsx\nSpec: Finish mass editor tool for investigation queue."
      },
      {
        "title": "Task 9.3: Flashcards & Spaced Repetition Study Mode",
        "priority": 5,
        "note": "[Post-MVP] [Priority: Medium] [Feature]\nTarget Files: components/StudyTab.tsx\nSpec: Flashcards & Spaced Repetition Study Mode."
      },
      {
        "title": "Task 9.4: Public API & Export Layer",
        "priority": 2,
        "note": "[Post-MVP] [Priority: Low] [Feature]\nTarget Files: scripts/export_api.ts\nSpec: Public API & Export Layer."
      }
    ];

    // Attempt to fetch fresh backlog.json if running via http server
    if (window.location.protocol.startsWith('http')) {
      fetch('./backlog.json')
        .then(res => res.json())
        .then(data => { backlogData = data; render(); })
        .catch(() => render());
    } else {
      // Direct file:// access uses embedded data instantly
      document.addEventListener('DOMContentLoaded', render);
    }

    function render() {
      const q = (document.getElementById('search') ? document.getElementById('search').value : '').toLowerCase();
      const pFilter = document.getElementById('priorityFilter') ? document.getElementById('priorityFilter').value : 'all';
      const grid = document.getElementById('grid');
      if (!grid) return;

      const filtered = backlogData.filter(item => {
        const matchesQuery = item.title.toLowerCase().includes(q) || item.note.toLowerCase().includes(q);
        let matchesPriority = true;
        if (pFilter === 'high') matchesPriority = item.priority >= 10;
        else if (pFilter === 'med') matchesPriority = item.priority >= 5 && item.priority < 10;
        else if (pFilter === 'low') matchesPriority = item.priority < 5;
        return matchesQuery && matchesPriority;
      });

      const countEl = document.getElementById('count');
      if (countEl) countEl.textContent = filtered.length;

      if (filtered.length === 0) {
        grid.innerHTML = '<div style="color:var(--text-muted); grid-column: 1/-1; text-align:center; padding: 40px;">No matching tasks found.</div>';
        return;
      }

      grid.innerHTML = filtered.map(item => {
        let badgeClass = 'badge-low';
        let badgeText = `Priority: ${item.priority}`;
        if (item.priority >= 10) { badgeClass = 'badge-high'; badgeText = 'High Priority'; }
        else if (item.priority >= 5) { badgeClass = 'badge-med'; badgeText = 'Med Priority'; }

        return `
          <div class="card">
            <div>
              <div class="card-header">
                <div class="title">${escapeHtml(item.title)}</div>
                <span class="badge ${badgeClass}">${badgeText}</span>
              </div>
            </div>
            <div class="note-box">${escapeHtml(item.note)}</div>
          </div>
        `;
      }).join('');
    }

    function escapeHtml(str) {
      return str ? str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;") : '';
    }

    // Initial render
    render();
  </script>
</body>
</html>
