    <title>ᎾᏍᎩᏰᏃ ᏧᏭᎪᏙᏗ ᎨᏒ ᏚᏳᎪᏛᎢ ᎠᎴ ᎣᏍᏛ; ᎾᏍᎩᏰᏃ ᏚᏭᎪᏓᏁᎸ ᎤᏣᏘ ᎤᏁᎫᏥᏛ ᎠᎨᏴ, ᎾᏍᎩ ᎤᏕᎵᏛ ᏓᏂᏏᏂᏙᎲ ᎤᏂᏲ ᏥᏂᏚᏩᏁᎸ ᎡᎶᎯ ᎠᏁᎯ, ᎠᎴ ᎤᏞᏨ ᏧᏅᏏᏓᏍᏗ ᎤᏂᎩᎬ ᏚᏨᏁᎸᎢ. (Nasgiyeno tsuwugododi gesv duyugodvi ale osdv; nasgiyeno duwugodanelv utsati unegutsidv ageyv, nasgi udelidv danisinidohv uniyo tsiniduwanelv elohi anehi, ale utletsv tsunvsidasdi unigigv dutsvnelvi.) — Cherokee Corpus</title>
