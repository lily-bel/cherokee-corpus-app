    <title>ᏉᎳᏃ ᎠᎴ ᏆᏂᏆ ᎤᏣᏘ ᎤᏂᏲᏠᎯᏎᎸ ᎠᎴ ᎤᎾᏗᏒᎸ ᎠᏂᏬᏂᏍᎬ ᎾᏍᎩ, ᏚᏄᎪᏔᏁ ᏉᎳ ᎠᎴ ᏆᏂᏆ ᎠᎴ ᎩᎶ ᎢᏳᎾᏍᏗ ᏅᏩᎾᏓᎴ ᏥᎷᏏᎵᎻ ᎤᏁᏅᏍᏗᏱ ᏧᎾᏛᏛᏅᏍᏗᏱ ᎨᏥᏅᏏᏛ ᎠᎴ ᏗᎨᎦᏁᎶᏗ ᎾᏍᎩ ᎯᎠ ᎠᏂᏱᎵᏙᎲ ᎤᎬᏩᎵ. (Quolano ale Quaniqua utsati uniyotlohiselv ale unadisvlv aniwonisgv nasgi, dunugotane Quola ale Quaniqua ale gilo iyunasdi nvwanadale Tsilusilimi unenvsdiyi tsunadvdvnvsdiyi getsinvsidv ale digeganelodi nasgi hia aniyilidohv ugvwali.) — Cherokee Corpus</title>
