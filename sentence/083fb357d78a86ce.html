    <title>ᎾᏍᎩᏃ ᎤᎾᏛᎦᏅ ᎩᎳ ᏧᎩᏥᏍᎪᎢ ᏭᏂᏴᎴ ᎤᏛᏅ-ᏗᎦᎳᏫᎢᏍᏗᏱ ᎠᎴ ᏚᎾᏕᏲᏁᎢ.  ᎠᏎᏃ ᏄᎬᏫᏳᏒ ᎠᏥᎸ-ᎨᎶᎯ ᎤᎷᏨ, ᎠᎴ ᎾᏍᎩ ᎬᏩᎵᎪᏁᎯ, ᏚᏂᏟᏌᏁ ᏗᏂᎳᏫᎩ, ᎠᎴ ᏂᎦᏛ ᏄᏂᎬᏫᏳᏌᏕᎩ ᎢᏏᎵ ᏧᏪᏥ ᏧᎾᏤᎵᎦ, ᎠᎴ ᏫᏓᏯᏅᎲ ᎤᎾᏓᏅᏎ ᏗᏓᏍᏚᏗᏱ. (Nasgino unadvganv gila tsugitsisgoi wuniyvle udvnvdigalawiisdiyi ale dunadeyonei.  Aseno nugvwiyusv atsilvgelohi ulutsv, ale nasgi gvwaligonehi, dunitlisane dinilawigi, ale nigadv nunigvwiyusadegi Isili tsuwetsi tsunatseliga, ale widayanvhv unadanvse didasdudiyi.) — Cherokee Corpus</title>
