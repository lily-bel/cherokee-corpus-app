    <title>ᎯᎠ ᏄᏂᏪᏒᎩ, ᎢᏨᏯᎵᏒᎵᏤᎭ, ᏂᎯ ᏣᎬᏫᏳᎯ ᏣᏁᎳᏅᎯ, ᏫᎾᏍᏛᎾ ᏣᎵᏂᎩᏛ, ᏂᎯ ᎾᏍᎩ ᏤᎭ, ᎠᎴ ᎾᏍᎩ ᏤᎲᎩ, ᎠᎴ ᎾᏍᎩ ᏤᎮᏍᏗ; ᏅᏗᎦᎵᏍᏙᏗᎭ ᏥᏣᎩᏒ ᎤᏣᏘ ᏣᎵᏂᎩᏗᏳ ᎨᏒᎢ, ᎠᎴ ᏣᎬᏫᏳᎯ ᏥᏂᏣᎵᏍᏔᏅ.</title>
    <meta name="description" content="Hia nuniwesvgi, Itsvyalisvlitseha, nihi Tsagvwiyuhi Tsanelanvhi, Winasdvna tsalinigidv, nihi nasgi tseha, ale nasgi tsehvgi, ale nasgi tsehesdi; nvdigalisdodiha tsitsagisv utsati tsalinigidiyu gesvi, ale tsagvwiyuhi tsinitsalistanv.&#10;Saying, We give thee thanks, O Lord God Almighty, which art, and wast, and art to come; because thou hast taken to thee thy great power, and hast reigned. [CNT]" />
