    <title>ᎾᏍᎩᏯ ᎠᏗᎾ ᎦᎶᏁᏛ ᎤᏤᎵ ᎣᏍᏛ ᎧᏃᎮᏛ ᏧᎵᎶᎲᏍᎦ ᏂᏣᏛᏁᎵᏙᎮᏍᏗ; ᎾᏍᎩ ᎢᏳᏃ ᏱᏫᏨᎷᏤᎸ ᎠᎴ ᏱᏫᏨᎪᎥ, ᎠᎴ ᏯᎩᎪᏁᎸᏉ, ᏱᎦᏛᎬᎦ ᏂᏣᏛᎿᎭᏕᎬᎢ, ᎤᎵᏂᎩᏛ ᏕᏥᏙᎬ ᏌᏉ ᎠᏓᏅᏙᎩᎯ, ᏌᏉ ᎠᏓᏅᏖᏗ ᎬᏗ, ᎠᏖᏆᎶᎯ ᎢᏣᏟᏂᎬᏁᏗᏱ ᎢᏥᏍᏕᎸᏗᏱ ᎪᎯᏳᏗ ᎨᏒ ᎣᏍᏛ ᎧᏃᎮᏛ.</title>
    <meta name="description" content="Nasgiya adina Galonedv utseli osdv kanohedv tsulilohvsga nitsadvnelidohesdi; nasgi iyuno yiwitsvlutselv ale yiwitsvgov, ale yagigonelvquo, yigadvgvga nitsadvhnadegvi, ulinigidv detsidogv saquo adanvdogihi, saquo adanvtedi gvdi, atequalohi itsatlinigvnediyi itsisdelvdiyi gohiyudi gesv osdv kanohedv.&#10;Only let your conversation be as it becometh the gospel of Christ: that whether I come and see you, or else be absent, I may hear of your affairs, that ye stand fast in one spirit, with one mind striving together for the faith of the gospel; [CNT]" />
