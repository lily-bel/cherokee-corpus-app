    <title>ᎠᎴ ᏅᏓᏳᎵᏍᎪᎸᏔᏅᎯ ᏥᏌ ᎦᎶᏁᏛ ᎦᏰᎪᎩ ᏂᎨᏒᎾ ᎧᏃᎮᏍᎩ, ᎠᎴ ᏗᏓᎴᏅᏗᏍᎩ ᎠᏲᎱᏒ ᏗᎴᎯᏐᏗ ᎨᏒᎢ, ᎠᎴ ᎤᎬᏫᏳᎯ ᎡᎶᎯ ᎠᏁᎯ ᎤᏂᎬᏫᏳᎯ ᎤᎾᏤᎵᎦ.  ᎾᏍᎩ ᎢᎩᎨᏳᎯ ᏥᎨᏒᎩ ᎠᎴ ᎤᏩᏒ ᎤᎩᎬ ᎢᎪᏑᎴᏔᏅᎯ ᎢᎩᏅᎦᎸᏛ ᎢᎩᏍᎦᏅᏨᎢ, (Ale nvdayulisgolvtanvhi Tsisa Galonedv gayegogi nigesvna Kanohesgi, ale didalenvdisgi ayohusv dilehisodi gesvi, ale Ugvwiyuhi elohi anehi unigvwiyuhi unatseliga.  Nasgi igigeyuhi tsigesvgi ale uwasv ugigv igosuletanvhi iginvgalvdv igisganvtsvi,) — Cherokee Corpus</title>
