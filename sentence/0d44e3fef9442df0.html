    <title>ᎠᎦᏬᎥᏃ ᎤᏩᏒ ᎠᎴ ᎾᏍᎩ ᏚᏓᏘᎾᎥᎢ, ᎣᎩᏔᏲᏎᎸᎩ, ᎯᎠ ᏄᏪᏒᎩ; ᎢᏳᏃ ᎤᏙᎯᏳᏒ ᎤᎬᏫᏳᎯ ᎪᎯᏳᎲᏍᎩ ᏍᎩᏰᎵᏎᎮᏍᏗ, ᏥᏁᎸ ᎢᏥᏴᎭ ᎠᎴ ᎾᎿᎭᎢᏥᏁᏍᏗ. ᎣᎩᏍᏗᏰᏗᏍᎬᏃ ᎣᎩᏎᎪᎩᏒᎩ.</title>
    <meta name="description" content="Agawovno uwasv ale nasgi dudatinavi, ogitayoselvgi, hia nuwesvgi; Iyuno udohiyusv Ugvwiyuhi gohiyuhvsgi sgiyelisehesdi, tsinelv itsiyvha ale nahna itsinesdi. Ogisdiyedisgvno ogisegogisvgi.&#10;And when she was baptized, and her household, she besought us, saying, If ye have judged me to be faithful to the Lord, come into my house, and abide there. And she constrained us. [CNT]" />
