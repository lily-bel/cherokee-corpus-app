    <title>ᏥᎦᏔᎭ ᏄᏍᏛ ᏕᏣᎸᏫᏍᏓᏁᎲᎢ, ᎠᎴ ᎾᎿᎭᎮᎲᎢ, ᎾᎿᎭᏎᏓᏂ ᎤᏪᏘᏱ ᎨᏒᎢ; ᎠᎴ ᎾᏍᎩ ᎠᏍᏓᏱᏳ ᏕᏣᏂᏴᏒ ᏓᏆᏙᎥᎢ, ᎠᎴ ᏂᏣᏓᏱᎸᎾ ᎨᏒ ᎠᏆᏤᎵ ᎪᎯᏳᏗ ᎨᏒᎢ, ᎾᎯᏳᎢ ᎥᏗᏆᏏ ᎤᏓᎵᏓᏍᏗ ᏂᎨᏒᎾ ᎠᎩᏃᎮᏍᎩ ᏄᎵᏍᏔᏅ, ᎾᏍᎩ ᏂᎯ ᎢᏤᎲ ᏣᏥᎸᎩ, ᎾᎿᎭᏎᏓᏂ ᏒᎲᎢ.</title>
    <meta name="description" content="Tsigataha nusdv detsalvwisdanehvi, ale nahna hehvi, nahna Sedani uwetiyi gesvi; ale nasgi asdayiyu detsaniyvsv daquadovi, ale nitsadayilvna gesv aquatseli gohiyudi gesvi, nahiyui Vdiquasi udalidasdi nigesvna aginohesgi nulistanv, nasgi nihi itsehv tsatsilvgi, nahna Sedani svhvi.&#10;I know thy works, and where thou dwellest, even where Satan&#39;s seat is: and thou holdest fast my name, and hast not denied my faith, even in those days wherein Antipas was my faithful martyr, who was slain among you, where Satan dwelleth. [CNT]" />
