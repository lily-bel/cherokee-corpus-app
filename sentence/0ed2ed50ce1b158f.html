    <title>ᏚᏁᏤᎸᏃ ᎯᎠ ᏂᏚᏪᏎᎴᎢ, ᎢᏌᏯ ᏰᎵᏉ ᏄᏪᏒ ᎤᏙᎴᎰᏒ ᏂᎯ ᎢᏣᏠᎾᏍᏗ ᎢᏥᏁᎢᏍᏗᏍᎬᎢ, ᎯᎠ ᏥᏂᎬᏅ ᏥᎪᏪᎳ, ᎯᎠ ᎾᏍᎩ ᏴᏫ ᎬᎩᎸᏉᏗᎭ ᏚᏂᎭᏁᎦᎸ ᏓᏅᏗᎭ, ᏧᏂᎾᏫᏍᎩᏂ ᎢᏅᎯᏳ ᏂᏚᏅᎿᎭᏕᎦ ᎠᏴ ᎾᏆᏛᏅᎢ. (Dunetselvno hia niduweselei, Isaya yeliquo nuwesv udolehosv nihi itsatlonasdi itsineisdisgvi, hia tsinigvnv tsigowela, Hia nasgi yvwi gvgilvquodiha dunihanegalv danvdiha, tsuninawisgini invhiyu nidunvhnadega ayv naquadvnvi.) — Cherokee Corpus</title>
