    <title>ᏚᏁᏤᎸᏃ ᎯᎠ ᏂᏚᏪᏎᎴᎢ, ᎢᏌᏯ ᏰᎵᏉ ᏄᏪᏒ ᎤᏙᎴᎰᏒ ᏂᎯ ᎢᏣᏠᎾᏍᏗ ᎢᏥᏁᎢᏍᏗᏍᎬᎢ, ᎯᎠ ᏥᏂᎬᏅ ᏥᎪᏪᎳ, ᎯᎠ ᎾᏍᎩ ᏴᏫ ᎬᎩᎸᏉᏗᎭ ᏚᏂᎭᏁᎦᎸ ᏓᏅᏗᎭ, ᏧᏂᎾᏫᏍᎩᏂ ᎢᏅᎯᏳ ᏂᏚᏅᎿᎭᏕᎦ ᎠᏴ ᎾᏆᏛᏅᎢ.</title>
    <meta name="description" content="Dunetselvno hia niduweselei, Isaya yeliquo nuwesv udolehosv nihi itsatlonasdi itsineisdisgvi, hia tsinigvnv tsigowela, Hia nasgi yvwi gvgilvquodiha dunihanegalv danvdiha, tsuninawisgini invhiyu nidunvhnadega ayv naquadvnvi.&#10;He answered and said unto them, Well hath Esaias prophesied of you hypocrites, as it is written, This people honoureth me with their lips, but their heart is far from me. [CNT]" />
