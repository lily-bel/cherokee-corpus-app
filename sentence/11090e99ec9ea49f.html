    <title>ᎯᎠ ᏂᏚᏪᏎᎸᎩ; ᎢᏕᎾ, ᏫᏍᏓᎦᏔ.  ᎤᏁᏅᏒᎩᏃ ᎠᎴ ᎤᎾᎦᏔᏅᎩ ᎦᏁᎸᎢ, ᎠᎴ ᎢᏧᎳᎭ ᎤᏁᏙᎸᎯ ᎾᎯᏳ ᎢᎦ; ᏅᎩᏁᏰᏃ ᎢᏳᏟᎶᏛ ᎧᎳᏩᏗᏒ ᎨᏒᎩ. (Hia niduweselvgi; Idena, wisdagata.  Unenvsvgino ale unagatanvgi ganelvi, ale itsulaha unedolvhi nahiyu iga; nvgineyeno iyutlilodv kalawadisv gesvgi.) — Cherokee Corpus</title>
