    <title>ᎦᏚᎲᏃ ᏅᎩ ᏧᏅᏏᏴ ᎨᏒᎩ, ᎦᏅᎯᏒ ᎠᎴ ᎠᏯᏛᎥ ᎤᏠᏱᏉ ᎨᏒᎩ. ᎤᏟᎶᎥᎩᏃ ᎦᏚᎲ ᎤᏩᏔᏅᎩ ᎠᏟᎶᏍᏗ, ᎯᏍᎩᎦᏚ ᎢᏯᏍᎪᎯᏧᏈ ᎢᏳᏟᎶᏛ ᏂᎬᎩ. ᏂᎦᏅᎯᏒ ᎠᎴ ᎾᏯᏛᎲ ᎠᎴ ᏂᎦᏛᎢ ᎤᏠᏱᏉ ᎨᏒᎩ.</title>
    <meta name="description" content="Gaduhvno nvgi tsunvsiyv gesvgi, ganvhisv ale ayadvv utloyiquo gesvgi. Utlilovgino gaduhv uwatanvgi atlilosdi, hisgigadu iyasgohitsuqui iyutlilodv nigvgi. Niganvhisv ale nayadvhv ale nigadvi utloyiquo gesvgi.&#10;And the city lieth foursquare, and the length is as large as the breadth: and he measured the city with the reed, twelve thousand furlongs. The length and the breadth and the height of it are equal. [CNT]" />
