    <title>ᏝᏍᎪ ᏲᎯᏳᎲᏍᎦ ᎠᏴ ᎠᎦᏴᎵᎨᎢ ᏥᏯᎥᎢ, ᎠᎴ ᎠᎦᏴᎵᎨ ᎠᏴ ᎠᎩᏯᎥᎢ?  ᎧᏃᎮᏛ ᏥᏨᏃᎮᎮᎰᎢ, ᎥᏝ ᎠᏋᏒᏉ ᎠᏆᏓᏅᏖᏛ ᏱᏥᏁᎪᎢ, ᎠᎦᏴᎵᎨᎢᏍᎩᏂ ᏣᎩᏯᎠ ᎾᏍᎩ ᏚᎸᏫᏍᏓᏁᎰᎢ. (Tlasgo yohiyuhvsga ayv Agayvligei tsiyavi, ale Agayvlige ayv agiyavi?  Kanohedv tsitsvnohehehoi, vtla aquvsvquo aquadanvtedv yitsinegoi, Agayvligeisgini tsagiyaa nasgi dulvwisdanehoi.) — Cherokee Corpus</title>
