    <title>ᏂᎯᏰᏃ, ᎢᏓᎵᏅᏟ, ᏗᏥᏍᏓᏩᏕᎩ ᏂᏣᎵᏍᏔᏅᎩ ᏧᎾᏁᎶᏗ ᏚᎾᏓᏡᎬ ᎤᏁᎳᏅᎯ ᏧᏤᎵᎦ ᏧᏗᏱ ᎠᏁᎯ, ᎾᏍᎩ ᎦᎶᏁᏛ ᏥᏌ ᎬᏬᎯᏳᎲᏍᎩ ᏥᎩ; ᏂᎯᏰᏃ ᎾᏍᏉ ᎤᏠᏱ ᏕᏥᎩᎵᏲᏤᎸᎩ ᏗᏣᏤᎵᎦ ᏴᏫ, ᎾᏍᎩᏯ ᎾᏍᎩ ᏥᏚᏂᎩᎵᏲᏤᎴ ᎠᏂᏧᏏ; (Nihiyeno, idalinvtli, ditsisdawadegi nitsalistanvgi tsunanelodi dunadatlugv Unelanvhi tsutseliga Tsudiyi anehi, nasgi Galonedv Tsisa gvwohiyuhvsgi tsigi; nihiyeno nasquo utloyi detsigiliyotselvgi ditsatseliga yvwi, nasgiya nasgi tsidunigiliyotsele Anitsusi;) — Cherokee Corpus</title>
