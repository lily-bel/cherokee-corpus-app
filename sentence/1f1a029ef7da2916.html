    <title>ᎿᎭᏉᏃ ᏆᎴᏗ ᎯᎠ ᏄᏪᏎᎸᎩ; ᏣᎬᏫᏳᎯᏰᎧᏂ?  ᏥᏌ ᎯᎠ ᏄᏪᏒᎩ; ᏰᎵ ᏂᏫ, ᎠᎩᎬᏫᏳᎯᏰᏃ ᎠᏴ.  ᏥᏃᎮᏍᎩ ᎤᏙᎯᏳᏒ ᎢᏯᏆᎵᏍᏙᏗᏱ, ᎾᏍᎩ ᎢᏳᏍᏗ ᎠᏆᏕᏅᎩ, ᎠᎴ ᎾᏍᎩ ᏅᏓᏳᎵᏍᏙᏔᏅᎩ ᎡᎶᎯ ᎠᎩᎾᏄᎪᏥᎸᎩ.  ᎾᏂᎥ ᎤᏙᎯᏳᏒ ᎤᏂᎨᏳᎯ ᎠᎾᏛᎩᏍᎪ ᏥᏁᎬᎢ. (Hnaquono Qualedi hia nuweselvgi; Tsagvwiyuhiyekani?  Tsisa hia nuwesvgi; Yeli niwi, agigvwiyuhiyeno ayv.  Tsinohesgi udohiyusv iyaqualisdodiyi, nasgi iyusdi aquadenvgi, ale nasgi nvdayulisdotanvgi elohi aginanugotsilvgi.  Naniv udohiyusv unigeyuhi anadvgisgo tsinegvi.) — Cherokee Corpus</title>
