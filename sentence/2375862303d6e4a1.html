    <title>ᎢᏣᏅᏖᏍᏗ ᎯᎠ ᏥᏂᏨᏪᏎᎸᎩ; ᎠᏥᎾᏝᎢ ᎥᏝ ᎤᏟ ᎠᏥᎸᏉᏗᏳ ᏱᎨᏐ ᎡᏍᎦᏉ ᎤᎾᏝᎢ.  ᎢᏳᏃ ᎠᏴ ᎬᎩᏐᏢᏔᏅᎯ ᏱᎩ, ᏂᎯ ᎾᏍᏉ ᏓᎨᏥᏐᏢᏔᏂ.  ᎢᏳᏃ ᎠᏴ ᎠᎩᏁᏨ ᎤᏂᏍᏆᏂᎪᏔᏅᎯ ᏱᎩ, ᏂᎯ ᎾᏍᏉ ᎢᏥᏁᏨ ᏛᏂᏍᏆᏂᎪᏔᏂ. (Itsanvtesdi hia tsinitsvweselvgi; Atsinatlai vtla utli atsilvquodiyu yigeso esgaquo unatlai.  Iyuno ayv gvgisotlvtanvhi yigi, nihi nasquo dagetsisotlvtani.  Iyuno ayv aginetsv unisquanigotanvhi yigi, nihi nasquo itsinetsv dvnisquanigotani.) — Cherokee Corpus</title>
