    <title>ᎢᎦᏃ ᎿᎭᏉ ᎦᎶᏐᎲᏍᎨᎢ ᎬᏩᎷᏎᎴ ᏔᎳᏚ ᎢᏯᏂᏛ ᎠᎴ ᎯᎠ ᏂᎬᏩᏪᏤᎴᎢ, ᏘᏰᎵᎯᏍᏓ ᎤᏂᏣᏘ, ᎾᏍᎩ ᏩᏁᎾ ᏙᏗᎦᏚᎲ ᎠᎴ ᏙᏗᎦᎶᎨᏒ ᎠᏂ ᎬᏩᏚᏫᏛ ᏫᏚᏂᏒᏍᏗᏱ, ᎠᎴ ᎤᎾᎵᏍᏓᏴᏗ ᏭᏂᏩᏛᏗᏱ; ᎠᏂᏰᏃ ᎢᎾᎨᏉ ᎨᏒ ᎢᏕᏙᎭ. (Igano hnaquo galosohvsgei gvwalusele taladu iyanidv ale hia nigvwawetselei, Tiyelihisda unitsati, nasgi wanena dodigaduhv ale dodigalogesv ani gvwaduwidv widunisvsdiyi, ale unalisdayvdi wuniwadvdiyi; aniyeno inagequo gesv idedoha.) — Cherokee Corpus</title>
