    <title>ᎤᎾᏛᎦᏃᏁᎸᏃ ᎤᎬᏫᏳᎯ ᎤᎾᏂᎩᏎᎢ, ᎬᏂᏳᏉᏃ ᏃᏈᏏ, ᎾᏍᎩ ᎤᏂᎪᎲᎯ ᏗᎧᎸᎬ ᎢᏗᏢ, ᎢᎬᏱ ᎤᏁᏅᎡᎴᎢ, ᎬᏂ ᏭᎷᏥᎸ ᎠᎴ ᎤᎴᏫᏍᏔᏅ ᎦᎸᎳᏗᏢ ᎾᎿᎭᎠᏥᎵ ᎡᎲᎢ. (Unadvganonelvno ugvwiyuhi unanigisei, gvniyuquono noquisi, nasgi unigohvhi dikalvgv iditlv, igvyi unenvelei, gvni wulutsilv ale ulewistanv galvladitlv nahna atsili ehvi.) — Cherokee Corpus</title>
