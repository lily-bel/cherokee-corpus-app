    <title>ᎢᏗᎦᏔᎭ ᎠᏲᎱᎯᏍᏗ ᎨᏒ ᎢᎩᎶᏒᎢ ᎬᏂᏛᏃ ᏫᎩᎾᏄᎪᏨᎢ, ᏅᏗᎦᎵᏍᏙᏗᎭ ᏗᏗᎨᏳᎯᏳ ᎨᏒ ᎢᏓᏓᏅᏟ.  ᎩᎶ ᎤᎨᏳᎯᏳ ᏂᎨᏒᎾ ᏱᎩ ᏗᎾᏓᏅᏟ, ᎠᏲᎱᎯᏍᏗ ᎨᏒ ᎡᎭ. (Idigataha ayohuhisdi gesv igilosvi gvnidvno wiginanugotsvi, nvdigalisdodiha didigeyuhiyu gesv idadanvtli.  Gilo ugeyuhiyu nigesvna yigi dinadanvtli, ayohuhisdi gesv eha.) — Cherokee Corpus</title>
