    <title>ᎾᏍᎩᏯ ᎤᏁᎳᏅᎯ ᎬᏩᎦᏘᏯ ᎤᏓᏙᎵᏍᏗ ᎨᏒ ᎠᏴ ᎥᎩᏁᎸᎢ, ᎾᏍᎩᏯ ᎠᏏᎾᏌᏂ ᏄᎬᏫᏳᏒ ᏗᏁᏍᎨᏍᎩ ᎢᏳᏛᏁᏗ ᎾᏆᏛᏁᎸ ᎦᎫᏍᏛᏗ ᎠᎩᏅ, ᏅᏩᏓᎴᏃ ᎾᎿᎭᎤᏁᏍᎨᎲ.  ᎠᏎᏃ ᎾᏂᎥ ᎩᎶ ᎠᏁᏯᏔᎮᏍᏗ ᏄᏍᏛ ᎠᎾᏁᏍᎨᏍᎬ ᎾᎿᎭᏂ. (Nasgiya Unelanvhi gvwagatiya udadolisdi gesv ayv vginelvi, nasgiya asinasani nugvwiyusv dinesgesgi iyudvnedi naquadvnelv gagusdvdi aginv, nvwadaleno nahna unesgehv.  Aseno naniv gilo aneyatahesdi nusdv ananesgesgv nahnani.) — Cherokee Corpus</title>
