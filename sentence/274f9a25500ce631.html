    <title>ᎾᏍᎩᏃ ᎿᎭᏉ ᎯᎠ ᎠᏲᎩ ᎨᏒ ᎠᏲᎩ ᏂᎨᏒᎾ ᎨᏒ ᎤᏄᏬᏍᏔᏁᏍᏗ, ᎠᎴ ᎯᎠ ᎾᏍᎩ ᎠᏲᎱᏍᎩ ᎠᏲᎱᏍᎩ ᏂᎨᏒᎾ ᎨᏒ ᎤᏄᏬᏍᏔᏁᏍᏗ, ᎿᎭᏉ ᏄᎵᏍᏔᏁᏍᏗ ᎯᎠ ᎢᎦᏪᏛ ᎨᏒ ᏥᎪᏪᎳ, ᎠᏓᎵᏁᎯᏗᏍᎩ ᎨᏒ ᎤᎩᏐᏅ ᎠᏲᎱᎯᏍᏗ ᎨᏒᎢ.</title>
    <meta name="description" content="Nasgino hnaquo hia ayogi gesv ayogi nigesvna gesv unuwostanesdi, ale hia nasgi ayohusgi ayohusgi nigesvna gesv unuwostanesdi, hnaquo nulistanesdi hia igawedv gesv tsigowela, Adalinehidisgi gesv ugisonv ayohuhisdi gesvi.&#10;So when this corruptible shall have put on incorruption, and this mortal shall have put on immortality, then shall be brought to pass the saying that is written, Death is swallowed up in victory. [CNT]" />
