    <title>ᎯᎠ ᎾᏂᏪᏍᎨᎢ; ᎢᏥᏍᎦᏯ, ᎦᏙᏃ ᎾᏍᎩ ᎯᎠ ᏂᏣᏛᏁᎭ?  ᎠᏴ ᎾᏍᏉ ᏴᏫᏉ ᎾᏍᎩᏯ ᏂᏣᎵᏍᏓᏁᎲ ᎢᏲᎩᎾᎵᏍᏓᏁᎯ, ᎠᎴ ᎢᏨᏯᎵᏥᏙᏁᎭ ᏗᏥᏲᎯᏍᏗᏱ ᎯᎠ ᎠᏎᏉᏉ ᏂᏣᏛᏁᎲᎢ, ᏫᏣᎦᏔᎲᏍᏗᏱᏃ ᎬᏂᏛ ᎤᏁᎳᏅᎯ ᎢᏗᏢ, ᎾᏍᎩ ᎤᏬᏢᏅᎯ ᏥᎩ ᎦᎸᎶᎢ ᎠᎴ ᎦᏙᎯ ᎠᎴ ᎠᎺᏉᎯ ᎠᎴ ᎾᏂᎥ ᎾᎿᎭᎠᏁᎯ; (Hia naniwesgei; Itsisgaya, gadono nasgi hia nitsadvneha?  Ayv nasquo yvwiquo nasgiya nitsalisdanehv iyoginalisdanehi, ale itsvyalitsidoneha ditsiyohisdiyi hia asequoquo nitsadvnehvi, witsagatahvsdiyino gvnidv Unelanvhi iditlv, nasgi uwotlvnvhi tsigi galvloi ale gadohi ale amequohi ale naniv nahna anehi;) — Cherokee Corpus</title>
