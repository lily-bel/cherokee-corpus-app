    <title>ᎠᎴ ᎤᏙᎯᏳᎯ ᎵᏫ ᏧᏪᏥ ᎠᏥᎸᎨᎳᏍᏗ ᏗᎦᎸᏫᏍᏓᏁᏗ ᎨᏒ ᎨᏥᏁᏗ ᎨᏒᎢ ᎨᎦᏒᎦᎸᏗᏍᎨ ᎠᏍᎪᎯᏁ ᎪᏣᎴᏛ ᏧᏂᏂᏢᏗᏱ ᏴᏫ ᎾᏍᎩᏯ ᏂᎬᏅ ᏗᎧᎿᎭᏩᏛᏍᏗ, ᎾᏍᎩ ᎠᎾᎵᏅᏟ ᎨᏒᎢ, ᎾᏍᏉ ᎡᏆᎭᎻ ᎠᏰᎵ ᏅᏓᏳᎾᏓᎴᏅᎯ ᎨᏒᎢ. (Ale udohiyuhi Liwi tsuwetsi atsilvgelasdi digalvwisdanedi gesv getsinedi gesvi gegasvgalvdisge asgohine gotsaledv tsuninitlvdiyi yvwi nasgiya nigvnv dikahnawadvsdi, nasgi analinvtli gesvi, nasquo Equahami ayeli nvdayunadalenvhi gesvi.) — Cherokee Corpus</title>
