    <title>ᏗᏓᏍᏚᏗᏱᏃ ᎠᎦᏘᏯ, ᎤᏰᏨ ᎠᎴ ᎤᏙᎴᎰᏒ ᎦᎶᎯᏍᏗᏱ ᏗᏓᏍᏚᏗᏱ ᏧᎵᏍᏚᎢᏛ ᎨᏒᎢ, ᎤᎸᎮ ᎠᏰᎳᏍᏗ ᎦᏅᎯᏛ, ᎠᎴ ᎤᏩᏒ ᏗᏓᎵᏎᎢ, ᏗᎨᏥᏍᏚᎯ ᎤᎾᎵᏒ ᎡᎵᏍᎨᎢ. (Didasdudiyino agatiya, uyetsv ale udolehosv galohisdiyi didasdudiyi tsulisduidv gesvi, ulvhe ayelasdi ganvhidv, ale uwasv didalisei, digetsisduhi unalisv elisgei.) — Cherokee Corpus</title>
