    <title>ᎾᏍᎩ ᎢᏳᏍᏗ ᎾᏍᏉ ᏂᎪᎯᎸ ᎣᏣᏓᏙᎵᏍᏗᏍᎪ ᎢᏨᏯᏅᏓᏗᏍᎪ, ᎾᏍᎩ ᎣᎦᏁᎳᏅᎯ ᎤᏓᏯᏅᏗ ᎨᏒ ᎢᏥᏯᏅᏔᏅᎯ ᎢᏳᎵᏍᏙᏗᏱ, ᎠᎴ ᎤᏍᏆᏗᏍᏗᏱ ᏂᎦᏛ ᎣᏍᏛ ᎤᏰᎸᏗ ᎨᏒ ᏅᏓᏳᏓᎴᏅᎯ ᎤᏓᏅᏘᏳ ᎨᏒᎢ, ᎠᎴ ᎪᎯᏳᏗ ᎨᏒ ᏧᎸᏫᏍᏓᏁᏗ ᎬᏔᏅᎯ ᎤᎵᏂᎩᏛ ᎨᏒᎢ; (Nasgi iyusdi nasquo nigohilv otsadadolisdisgo itsvyanvdadisgo, nasgi Oganelanvhi udayanvdi gesv itsiyanvtanvhi iyulisdodiyi, ale usquadisdiyi nigadv osdv uyelvdi gesv nvdayudalenvhi udanvtiyu gesvi, ale gohiyudi gesv tsulvwisdanedi gvtanvhi ulinigidv gesvi;) — Cherokee Corpus</title>
