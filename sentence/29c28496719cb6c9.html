    <title>ᎢᎬᏱᏱ ᎨᏒ ᏗᎧᎿᎭᏩᏗᏙᎯ ᎤᏤᎷᎯᏒᎩ, ᎠᎴ ᎤᎨᎲ ᏔᏅᏒᎩ ᎠᏥᎸ ᎠᎴ ᎤᏁᏍᏓᎳ ᎩᎬ ᎤᏓᏑᏱ ᎨᏒᎩ, ᎠᎴ ᎡᎶᎯ ᏫᏕᎨᎦᏗᏅᏒᎩ, ᎠᎴ ᏕᏡᎬ ᏦᎢ ᎢᎦᏛᎯ ᎨᏒ ᎾᏍᎩ ᏌᏉ ᎢᏳᏪᏨᎯ ᏚᎪᏅᎩ, ᎠᎴ ᏂᎦᏛ ᎢᏤ ᎧᏁᏍᎦ ᎤᎪᏅᎩ.</title>
    <meta name="description" content="Igvyiyi gesv dikahnawadidohi utseluhisvgi, ale ugehv tanvsvgi atsilv ale unesdala gigv udasuyi gesvgi, ale elohi widegegadinvsvgi, ale detlugv tsoi igadvhi gesv nasgi saquo iyuwetsvhi dugonvgi, ale nigadv itse kanesga ugonvgi.&#10;The first angel sounded, and there followed hail and fire mingled with blood, and they were cast upon the earth: and the third part of trees was burnt up, and all green grass was burnt up. [CNT]" />
