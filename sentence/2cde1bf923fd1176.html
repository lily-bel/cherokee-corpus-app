    <title>ᎩᎶ ᏧᎸᏉᏙ ᎢᎦ ᎤᎬᏫᏳᎯ ᎦᎸᏉᏓᏁᎰᎢ; ᎩᎶᏃ ᏄᎸᏉᏛᎾ ᏥᎨᏐ ᎢᎦ, ᎤᎬᏫᏳᎯ ᎦᎸᏉᏗᏍᎪ ᏄᎸᏉᏛᎾ ᎨᏒᎢ. ᎩᎶ ᏣᎵᏍᏓᏴᎲᏍᎪᎢ, ᎤᎬᏫᏳᎯ ᎠᎵᏍᏓᏴᎾᏁᎰᎢ; ᎤᏁᎳᏅᎯᏰᏃ ᎠᎵᎮᎵᏤᎰᎢ; ᎠᎴ ᎩᎶ ᎾᎵᏍᏓᏴᎲᏍᎬᎾ ᏥᎨᏐᎢ, ᎤᎬᏫᏳᎯ ᎦᎸᏉᏙᏗᏍᎪ ᎾᎵᏍᏓᏴᎲᏍᎬᎾ ᎨᏒᎢ, ᎠᎴ ᎤᏁᎳᏅᎯ ᎠᎵᎮᎵᏤᎰᎢ.</title>
    <meta name="description" content="Gilo tsulvquodo iga Ugvwiyuhi galvquodanehoi; gilono nulvquodvna tsigeso iga, Ugvwiyuhi galvquodisgo nulvquodvna gesvi. Gilo tsalisdayvhvsgoi, Ugvwiyuhi alisdayvnanehoi; Unelanvhiyeno alihelitsehoi; ale gilo nalisdayvhvsgvna tsigesoi, Ugvwiyuhi galvquododisgo nalisdayvhvsgvna gesvi, ale Unelanvhi alihelitsehoi.&#10;He that regardeth the day, regardeth it unto the Lord; and he that regardeth not the day, to the Lord he doth not regard it. He that eateth, eateth to the Lord, for he giveth God thanks; and he that eateth not, to the Lord he eateth not, and giveth God thanks. [CNT]" />
