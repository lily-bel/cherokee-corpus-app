    <title>ᏴᏫ ᎤᏪᏥ ᎤᎷᏨ ᎠᎵᏍᏓᏴᎲᏍᎦ ᎠᎴ ᎠᏗᏔᏍᎦ, ᎯᎠᏃ ᏂᎠᏂᏪᎭ; ᎬᏂᏳᏉ ᎠᏍᎦᏯ ᎤᎬᎥᏍᎩ ᎠᎵᏍᏓᏴᏗ ᎠᎴ ᎩᎦᎨ-ᎠᏗᏔᏍᏗ, ᎠᏕᎸ ᎠᏂᎩᏏᏙᎯ ᎠᎴ ᎠᏂᏍᏕᎾ ᎤᎾᎵᎢ. ᎠᏎᏃ ᎠᎦᏔᎿᎭᎢ ᏧᏪᏥ ᎣᏏᏳ ᎢᎬᏩᏰᎸᎭ.</title>
    <meta name="description" content="Yvwi uwetsi ulutsv alisdayvhvsga ale aditasga, hiano nianiweha; Gvniyuquo asgaya ugvvsgi alisdayvdi ale gigageaditasdi, adelv anigisidohi ale anisdena unalii. Aseno agatahnai tsuwetsi osiyu igvwayelvha.&#10;The Son of man came eating and drinking, and they say, Behold a man gluttonous, and a winebibber, a friend of publicans and sinners. But wisdom is justified of her children. [CNT]" />
