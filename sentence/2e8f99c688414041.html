    <title>ᎠᏎᏃ ᏗᏂᎿᎭᎸᏙᏍᏗᏱ ᏂᎨᏒᎾ, ᎥᏓᎵ ᎮᎾ, ᎠᏑᏗᏃ ᏫᏣᏓᎡᏒᎭ, ᎢᎬᏱᏱᏃ ᎯᏴᎩᏛ ᎠᏣᏗ ᎯᏁᏒᎭ, ᎠᎴ ᎯᏍᏚᎢᏒ ᎠᎰᎵ ᎠᏰᎵ-ᎠᏕᎸ ᏘᏩᏛᎯ; ᎾᏍᎩ ᎯᎩᏒᎭ ᎠᎴ ᏕᎯᏁᎸᎭ ᎠᏴ ᎩᎾᎫᏴᏗ.</title>
    <meta name="description" content="Aseno dinihnalvdosdiyi nigesvna, vdali hena, asudino witsadaesvha, igvyiyino hiyvgidv atsadi hinesvha, ale hisduisv aholi ayeliadelv tiwadvhi; nasgi higisvha ale dehinelvha ayv ginaguyvdi.&#10;Notwithstanding, lest we should offend them, go thou to the sea, and cast an hook, and take up the fish that first cometh up; and when thou hast opened his mouth, thou shalt find a piece of money: that take, and give unto them for me and thee. [CNT]" />
