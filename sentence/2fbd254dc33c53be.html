    <title>ᎩᎶ ᎠᏓᏎᎪᎩᏍᎨᏍᏗ ᎾᏍᎩ ᏧᏁᎬ ᏣᏥᏄᏬᏍᏗ ᎨᏎᏍᏗ, ᎠᎴ ᎥᏝ ᏥᏲᏍᏓᏁᏗ ᏱᎨᏎᏍᏗ ᏚᏙᎥ ᎬᏂᏛ ᎠᏓᏁᎯ ᎪᏪᎵᎯ ᎪᏪᎸᎢ; ᎠᎴ ᎬᏂᎨᏒ ᎢᏥᏴᏁᏗ ᎨᏎᏍᏗ ᏕᎤᏙᎥ ᎡᏙᏓ ᎠᎦᏔᎲᎢ, ᎠᎴ ᏧᏤᎵ ᏗᏂᎧᎿᎭᏩᏗᏙᎯ ᎠᏂᎧᏔᎲᎢ. (Gilo adasegogisgesdi nasgi tsunegv tsatsinuwosdi gesesdi, ale vtla tsiyosdanedi yigesesdi dudov gvnidv adanehi gowelihi gowelvi; ale gvnigesv itsiyvnedi gesesdi deudov Edoda agatahvi, ale tsutseli dinikahnawadidohi anikatahvi.) — Cherokee Corpus</title>
    <meta name="description" content="He that overcometh, the same shall be clothed in white raiment; and I will not blot out his name out of the book of life, but I will confess his name before my Father, and before his angels." />
