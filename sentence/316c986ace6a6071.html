    <title>ᎠᏎᏃ ᎤᏚᎩ ᎠᏋᎭ ᏞᎩᏳ ᎬᎪᏩᏛᏗᏱ, ᎠᎴ ᎿᎭᏉ ᏗᏂᎰᎵ ᏗᎩᏅᏙᏗᏱ ᎩᎾᎵᏃᎮᏗᏱ.  ᏅᏩᏙᎯᏯᏛ ᏂᏣᏛᎢᏕᎨᏍᏗ.  ᎢᎦᎵᎢ ᏫᎨᏣᏲᎵᎭ.  ᎦᎾᏙᎠᏗᏒ ᎩᏲᎵᎸᎭ ᎢᎦᎵᎢ. (Aseno udugi aquvha tlegiyu gvgowadvdiyi, ale hnaquo diniholi diginvdodiyi ginalinohediyi.  Nvwadohiyadv nitsadvidegesdi.  Igalii wigetsayoliha.  Ganadoadisv giyolilvha igalii.) — Cherokee Corpus</title>
