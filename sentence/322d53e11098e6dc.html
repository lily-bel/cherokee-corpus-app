    <title>ᎾᏍᎩᏃ ᎠᏓᏅᏙ ᎯᎠ ᎢᎦᏪᏍᎩ ᏂᎨᏒᎾ, ᏥᏌ ᎦᎶᏁᏛ ᎤᏇᏓᎵ ᎤᎾᏄᎪᏥᎴᎢ, ᎥᏝ ᎤᏁᎳᏅᎯ ᏅᏓᏳᏓᎴᏅᎯ ᏱᎩ. ᎾᏍᎩᏍᎩᏂ ᎯᎠ ᎦᎶᏁᏛ-ᎠᏡᏗᏍᎩ ᎤᏤᎵᎦ ᎠᏓᏅᏙ, ᎾᏍᎩ ᎤᎷᎯᏍᏗᏱ ᎢᏣᏛᎦᏅᎯ ᏥᎩ, ᎠᎴ ᎿᎭᏉ ᎦᏳᎳ ᎡᎶᎯ ᎡᎭ.</title>
    <meta name="description" content="Nasgino adanvdo hia igawesgi nigesvna, Tsisa Galonedv uquedali unanugotsilei, vtla Unelanvhi nvdayudalenvhi yigi. Nasgisgini hia galonedvatludisgi utseliga adanvdo, nasgi uluhisdiyi itsadvganvhi tsigi, ale hnaquo gayula elohi eha.&#10;And every spirit that confesseth not that Jesus Christ is come in the flesh is not of God: and this is that spirit of antichrist, whereof ye have heard that it should come; and even now already is it in the world. [CNT]" />
