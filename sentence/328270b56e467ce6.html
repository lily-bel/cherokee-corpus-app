    <title>ᎿᎭᏉᏃ ᏥᏌ ᎤᏪᎷᏅᎩ ᎤᏛᏅᏗᎦᎳᏫᎢᏍᏗᏱ ᏓᏕᏲᎲᏍᎬᎢ, ᎯᎠ ᏄᏪᏒᎩ; ᏍᎩᎦᏔᎭ, ᎠᎴ ᎾᏍᏉ ᎢᏥᎦᏔᎭ ᏗᏆᏓᎴᏅᎢ; ᎠᎴ ᎥᏝ ᎠᏋᏒᏉ ᎠᏆᏓᏅᏖᏛ ᏯᎩᎷᏨ, ᏅᏛᎩᏅᏏᏛᏍᎩᏂ ᏚᏳᎪᏛᎢ, ᎾᏍᎩ ᏁᏥᎦᏔᎲᎾ ᏥᎩ.</title>
    <meta name="description" content="Hnaquono Tsisa uwelunvgi udvnvdigalawiisdiyi dadeyohvsgvi, hia nuwesvgi; Sgigataha, ale nasquo itsigataha diquadalenvi; ale vtla aquvsvquo aquadanvtedv yagilutsv, nvdvginvsidvsgini duyugodvi, nasgi netsigatahvna tsigi.&#10;Then cried Jesus in the temple as he taught, saying, Ye both know me, and ye know whence I am: and I am not come of myself, but he that sent me is true, whom ye know not. [CNT]" />
