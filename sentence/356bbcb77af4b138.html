    <title>ᎾᏍᎩ ᎠᏂᎦᏔᎲ ᏗᎧᎿᎭᏩᏛᏍᏗᏱ ᏄᎾᏓᏄᏴᏛᎾ ᏗᎧᎿᎭᏩᏛᏍᏗᏱ ᎾᏆᏓᏄᏴᏛᎾ ᏥᎨᏐ ᎾᏍᎩᏯᎢ, ᎾᏍᎩ ᎬᎩᏁᏉᏤᏗᏱ ᎾᏍᎩ Ꮎ ᏗᎧᎿᎭᏩᏛᏍᏗᏱ ᏄᎾᏓᏄᏴᏛᎾ, ᎠᏎᏃ ᎥᏝ ᏗᎧᎿᎭᏩᏛᏍᏗᏱ ᎾᏆᏓᏄᏴᏛᎾ ᏱᎩ ᎤᏁᎳᏅᎯ ᎠᎦᏔᎲᎢ, ᎠᏆᏓᏄᏴᏗᏍᎩᏂ ᏗᎧᎿᎭᏩᏛᏍᏗᏱ ᎦᎶᏁᏛ ᎠᎦᏔᎲᎢ. (Nasgi anigatahv dikahnawadvsdiyi nunadanuyvdvna dikahnawadvsdiyi naquadanuyvdvna tsigeso nasgiyai, nasgi gvginequotsediyi nasgi na dikahnawadvsdiyi nunadanuyvdvna, aseno vtla dikahnawadvsdiyi naquadanuyvdvna yigi Unelanvhi agatahvi, aquadanuyvdisgini dikahnawadvsdiyi Galonedv agatahvi.) — Cherokee Corpus</title>
    <meta name="description" content="To them that are without law, as without law, (being not without law to God, but under the law to Christ,) that I might gain them that are without law." />
