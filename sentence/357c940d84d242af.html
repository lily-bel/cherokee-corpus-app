    <title>ᎾᏍᎩ ᏥᏌ ᎤᎷᏤᎸᎩ ᏒᏃᏱ ᎯᎠ ᏄᏪᏎᎸᎩ; ᏗᏍᏇᏲᎲᏍᎩ, ᎣᏥᎦᏔᎭ ᏔᏕᏲᎲᏍᎩ ᎨᏒ ᎤᏁᎳᏅᎯ ᏅᏓᏣᏅᏏᏛ ᎨᏒᎢ:  ᎥᏝᏰᏃ ᎩᎶ ᎾᏍᎩ ᎯᎠ ᎤᏍᏆᏂᎪᏗ ᏥᏕᏣᎸᏫᏍᏓᏁᎭ ᏱᏙᎬᏩᎸᏫᏍᏓᏏ, ᎤᏁᎳᏅᎯ ᏂᏚᎧᎿᎭᏩᏗᏙᎲᎾᏱᎩ. (Nasgi Tsisa ulutselvgi svnoyi hia nuweselvgi; Disqueyohvsgi, otsigataha tadeyohvsgi gesv Unelanvhi nvdatsanvsidv gesvi:  vtlayeno gilo nasgi hia usquanigodi tsidetsalvwisdaneha yidogvwalvwisdasi, Unelanvhi nidukahnawadidohvnayigi.) — Cherokee Corpus</title>
    <meta name="description" content="The same came to Jesus by night, and said unto him, Rabbi, we know that thou art a teacher come from God: for no man can do these miracles that thou doest, except God be with him." />
