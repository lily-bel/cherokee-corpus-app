    <title>ᎣᏏᏳ ᏱᏥᏰᎸᎾ ᎢᏳᏃ ᏂᏥᎥ ᎢᎸᏍᎩ ᎢᏳᏓᎴᎩ ᏱᏗᏥᏬᏂᎭ; ᎠᏎᏃ ᎰᎤᎬᏫᏳᎭ ᏱᏣᏙᎴᎰᏍᎦ; ᎤᏟᏰᏃ ᎠᏥᎸᏉᏗᏳ ᎾᏍᎩ Ꮎ ᎠᏙᎴᎰᏍᎩ, ᎡᏍᎦᏉ ᎾᏍᎩ Ꮎ ᎢᎸᏍᎩ ᎢᏳᏓᎴᎩ ᏗᎦᏬᏂᏍᎩ, ᎢᏳᏍᎩᏂᏃᏅ ᏯᏁᏢᏗᎭ, ᎾᏍᎩ ᏧᎾᏁᎶᏗ ᎤᎾᏓᏡᎬ ᏧᎾᎵᏂ ᎪᎯᏍᏗᏱ.</title>
    <meta name="description" content="Osiyu yitsiyelvna iyuno nitsiv ilvsgi iyudalegi yiditsiwoniha; aseno hougvwiyuha yitsadolehosga; utliyeno atsilvquodiyu nasgi na adolehosgi, esgaquo nasgi na ilvsgi iyudalegi digawonisgi, iyusgininonv yanetlvdiha, nasgi tsunanelodi unadatlugv tsunalini gohisdiyi.&#10;I would that ye all spake with tongues, but rather that ye prophesied: for greater is he that prophesieth than he that speaketh with tongues, except he interpret, that the church may receive edifying. [CNT]" />
