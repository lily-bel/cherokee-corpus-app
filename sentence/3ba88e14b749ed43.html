    <title>ᎠᎴ ᏓᏆᎧᎿᎭᏅᎩ, ᎠᎴ ᎠᏆᏛᎦᏅᎩ ᎠᏂᏁᎬ ᎤᏂᏣᏘ ᏗᏂᎧᎿᎭᏩᏗᏙᎯ ᏚᎾᏚᏫᏍᏛ ᎦᏍᎩᎸᎢ, ᎠᎴ ᎠᏂᏁᎬ ᏗᏅᏃᏛ ᎠᎴ ᏧᎾᏛᏐᏅᎯ; ᎯᎠᏃ ᎾᏂᎥᎩ, ᎠᏍᎪᎯ ᎢᏯᎦᏴᎵ ᎤᎶᏏᎶᏛ ᎠᏍᎪᎯ ᎢᏯᎦᏴᎵ, ᎠᎴ ᎠᎦᏴᎵ ᎤᎦᏴᎳᏥᎶᏛ. (Ale daquakahnanvgi, ale aquadvganvgi aninegv unitsati dinikahnawadidohi dunaduwisdv gasgilvi, ale aninegv dinvnodv ale tsunadvsonvhi; hiano nanivgi, asgohi iyagayvli ulosilodv asgohi iyagayvli, ale agayvli ugayvlatsilodv.) — Cherokee Corpus</title>
