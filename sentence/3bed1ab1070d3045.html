    <title>ᏓᏲᏥᏂᏧ, ᏝᎨ ᏴᏓᏲᏥᏂ?  ᎠᏎᏃ ᎠᎦᏔᎮ ᎤᎾᏠᎾᏍᏛᎢ, ᎯᎠ ᏂᏚᏪᏎᎴᎢ, ᎦᏙᏃ ᎢᏍᎩᎪᎵᏰᎭ?  ᎡᏍᎩᎥᏏ ᎠᎩᏏ ᏧᎬᏩᎶᏗ ᎾᏍᎩ ᎠᎩᎪᏩᏛᏗᏱ. (Dayotsinitsu, tlage yvdayotsini?  Aseno agatahe unatlonasdvi, hia niduweselei, Gadono isgigoliyeha?  Esgivsi agisi tsugvwalodi nasgi agigowadvdiyi.) — Cherokee Corpus</title>
