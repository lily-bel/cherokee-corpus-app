    <title>ᏙᎩᏲᏒᏍᎩᏂ ᏧᏓᎴᏅᏛ ᎬᏍᎦᎵ ᎤᏕᎰᎯᏍᏗ ᎨᏒᎢ, ᎠᎴ ᎥᏝ ᏲᏤᏙᎭ ᎠᏏᎾᏌᏅᎢᏍᏗ ᎨᏒᎢ, ᎥᏝ ᎠᎴ ᎣᎦᏠᎾᏍᏛ ᏱᏙᎩᎸᏫᏍᏓᏁᎭ ᎧᏃᎮᏛ ᎨᏒ ᎤᏁᎳᏅᎯ ᎤᏤᎵᎦ, ᎬᏂᎨᏒᏍᎩᏂ ᏃᏨᏁᎲ ᎦᏰᎪᎩ ᏂᎨᏒᎾ ᎨᏒᎢ, ᎪᎩᎸᏉᏙᏗᏱ ᏃᏨᏁᎭ ᎾᏂᎥ ᏴᏫ ᏚᎾᏓᏅᏛ ᎬᏗ ᎤᏁᎳᏅᎯ ᎠᎦᏔᎲᎢ.</title>
    <meta name="description" content="Dogiyosvsgini tsudalenvdv gvsgali udehohisdi gesvi, ale vtla yotsedoha asinasanvisdi gesvi, vtla ale ogatlonasdv yidogilvwisdaneha kanohedv gesv Unelanvhi utseliga, gvnigesvsgini notsvnehv gayegogi nigesvna gesvi, gogilvquododiyi notsvneha naniv yvwi dunadanvdv gvdi Unelanvhi agatahvi.&#10;But have renounced the hidden things of dishonesty, not walking in craftiness, nor handling the word of God deceitfully; but by manifestation of the truth commending ourselves to every man&#39;s conscience in the sight of God. [CNT]" />
