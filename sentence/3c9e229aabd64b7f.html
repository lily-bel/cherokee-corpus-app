    <title>ᎿᎭᏉ ᏛᎵᏍᏆᏗ, ᎾᎯᏳ ᎤᎬᏫᏳᎯ ᎨᏒ ᏧᏲᎯᏎᎸᎯ ᎨᏎᏍᏗ ᎤᏁᎳᏅᎯ, ᎾᏍᎩ ᎠᎦᏴᎵᎨᎢ; ᎾᎯᏳ ᎠᏛᏔᏃᏅᎭ ᏂᎦᏗᏳ ᎤᏂᎬᏫᏳᏌᏕᎩ ᎨᏒ ᎠᎴ ᏂᎦᏗᏳ ᏗᎨᎦᏁᎶᏗ ᎨᏒ, ᎠᎴ ᏚᎾᎵᏂᎬᎬᎢ.</title>
    <meta name="description" content="Hnaquo dvlisquadi, nahiyu ugvwiyuhi gesv tsuyohiselvhi gesesdi Unelanvhi, nasgi Agayvligei; nahiyu advtanonvha nigadiyu unigvwiyusadegi gesv ale nigadiyu digeganelodi gesv, ale dunalinigvgvi.&#10;Then cometh the end, when he shall have delivered up the kingdom to God, even the Father; when he shall have put down all rule and all authority and power. [CNT]" />
