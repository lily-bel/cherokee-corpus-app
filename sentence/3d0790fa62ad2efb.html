    <title>ᎥᏣᏰᏃ ᏧᏂᏣᏔᏉ ᏥᏄᎾᏍᏗ ᏱᏃᎦᏍᏗ, ᎾᏍᎩ ᎠᏂᏲᏍᏗᏍᎩ ᎧᏃᎮᏛ ᎤᏁᎳᏅᎯ ᎤᏤᎵᎦ; ᏃᎦᏠᎾᏍᏛᎾᏍᎩᏂ ᎨᏒ ᏦᏨᏗᏍᎪᎢ, ᎤᏁᎳᏅᎯᏍᎩᏂ ᏥᏂᎬᏂᏏᏍᎪ ᎾᏍᎩᏯᎢ, ᎤᏁᎳᏅᎯ ᎠᎦᏔᎲ ᎣᏥᏁᎢᏍᏗ ᎦᎶᏁᏛ.</title>
    <meta name="description" content="Vtsayeno tsunitsataquo tsinunasdi yinogasdi, nasgi aniyosdisgi kanohedv Unelanvhi utseliga; nogatlonasdvnasgini gesv tsotsvdisgoi, Unelanvhisgini tsinigvnisisgo nasgiyai, Unelanvhi agatahv otsineisdi Galonedv.&#10;For we are not as many, which corrupt the word of God: but as of sincerity, but as of God, in the sight of God speak we in Christ. [CNT]" />
