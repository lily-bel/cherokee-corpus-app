    <title>ᎢᏳᏃ ᏣᏱᎵᏙᎯ ᏗᎫᎪᏗᏍᎩᏱ ᏍᏓᎢᏎᏍᏗ, ᎠᏏᏉ ᏫᏍᏓᎢᏒᎢ, ᎭᏟᏂᎬᏁᎸᎭ ᎯᏯᏚᎵᎳᎡᏗᏱ; ᏗᎫᎪᏗᏍᎩᏱ ᎾᏏ ᏫᏱᏣᏘᏃᎦ, ᏗᎫᎪᏗᏍᎩᏃ ᏗᏓᏂᏱᏍᎩᏱ ᏫᏱᏕᏣᏲᎯ, ᏗᏓᏂᏱᏍᎩᏃ ᏗᏓᏍᏚᏗᏱ ᏫᏱᏣᏴᏓ.</title>
    <meta name="description" content="Iyuno tsayilidohi digugodisgiyi sdaisesdi, asiquo wisdaisvi, hatlinigvnelvha hiyadulilaediyi; digugodisgiyi nasi wiyitsatinoga, digugodisgino didaniyisgiyi wiyidetsayohi, didaniyisgino didasdudiyi wiyitsayvda.&#10;When thou goest with thine adversary to the magistrate, as thou art in the way, give diligence that thou mayest be delivered from him; lest he hale thee to the judge, and the judge deliver thee to the officer, and the officer cast thee into prison. [CNT]" />
