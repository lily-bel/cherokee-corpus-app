    <title>ᎢᏳᏃ ᏂᎬ ᎯᏰᎸ ᎧᎵᏬᎯ ᎨᏎᏍᏗ ᎢᎦ ᎦᏘ, ᎢᎸᎯᏢ ᏄᏓᏓᎸᎾ ᎤᎵᏏᎩ, ᏂᎬ ᎤᎧᎵᏨᎯ ᎨᏎᏍᏗ ᎢᎦ ᎦᏘ, ᎾᏍᎩᏯ ᎠᏨᏍᏙᏗ ᎣᏍᏛ ᎠᏓᏪᎵᎩᏍᎬ ᎢᎦ ᏥᏣᏘᏍᏓᏁᎰᎢ. (Iyuno nigv hiyelv kaliwohi gesesdi iga gati, ilvhitlv nudadalvna ulisigi, nigv ukalitsvhi gesesdi iga gati, nasgiya atsvsdodi osdv adaweligisgv iga tsitsatisdanehoi.) — Cherokee Corpus</title>
