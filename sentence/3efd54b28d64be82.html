    <title>ᎠᏰᎵᏃ ᎤᏜᏓᏅᏛ ᎾᎿᎭᎡᏓᏍᏗᏱ, ᎠᎴ ᎢᏧᎳᏗᏢ ᎤᏪᏴᎢ, ᏡᎬᎩ ᎬᏂᏛ ᎠᏓᏁᎯ ᏡᎬᎢ, ᎾᏍᎩ ᏔᎳᏚ ᎢᏳᏓᎴᎩ ᎠᏓᏛᏍᎬᎩ ᎠᎴ ᏂᏓᏦᎳᏂᏒ ᎬᎾᏍᎬᎩ ᎤᏓᏔᏅᎯ; ᎤᎳᏍᏚᏒᏃ ᎤᎾᏅᏬᏗ ᎨᏒᎩ ᏧᎾᏓᎴᏅᏛ ᏴᏫ. (Ayelino udlanvdv nahna edasdiyi, ale itsuladitlv uweyvi, tlugvgi gvnidv adanehi tlugvi, nasgi taladu iyudalegi adadvsgvgi ale nidatsolanisv gvnasgvgi udatanvhi; ulasdusvno unanvwodi gesvgi tsunadalenvdv yvwi.) — Cherokee Corpus</title>
    <meta name="description" content="In the midst of the street of it, and on either side of the river, was there the tree of life, which bare twelve manner of fruits, and yielded her fruit every month: and the leaves of the tree were for the healing of the nations." />
