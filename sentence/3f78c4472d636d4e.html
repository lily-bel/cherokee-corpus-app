    <title>ᎠᏍᎦᏯ ᏓᏤᎸ ᎾᏍᎩ Ꮎ ᏧᏁᏍᎨᎮᎢ, ᎠᎴ ᎭᏫᏂ ᏧᏍᎪᏎᎢ, ᎠᎴ ᎦᎫᏍᏛᏗ ᏅᏲᎯ ᏧᏝᏁᎢ; ᎤᏃᎱᎦᏅᏃ ᎡᏉᏂ ᎾᎿᎭᎠᏓᏁᎸ ᎠᏍᏓᏱᏳ ᎬᏂᎵᎯᎮᎢ, ᎠᎴ ᎥᏝ ᎬᏩᏖᎸᏗ ᏱᎨᏎᎢ; ᏅᏲᎯᏰᏃ ᎦᎧᎮᎢ.</title>
    <meta name="description" content="Asgaya datselv nasgi na tsunesgehei, ale hawini tsusgosei, ale gagusdvdi nvyohi tsutlanei; unohuganvno equoni nahna adanelv asdayiyu gvnilihihei, ale vtla gvwatelvdi yigesei; nvyohiyeno gakahei.&#10;He is like a man which built an house, and digged deep, and laid the foundation on a rock: and when the flood arose, the stream beat vehemently upon that house, and could not shake it: for it was founded upon a rock. [CNT]" />
