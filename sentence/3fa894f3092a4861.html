    <title>ᎾᏍᎩ ᎢᏳᏍᏗ ᎤᏚᎸᏗ ᏂᎦᎵᏍᏗᏍᎬᎩ ᎯᎠ ᎾᏍᎩ ᏂᎦᏛ ᏄᏍᏗᏓᏅ ᎦᎸᎳᏗ ᏤᎯ ᏗᏟᎶᏍᏔᏅᎯ ᎨᏒ ᏗᎦᏅᎦᎸᏙᏗᏱ ᎯᎠ ᎾᏍᎩ (ᏗᎵᏍᎪᎸᏙᏗ,) ᎦᎸᎳᏗᏍᎩᏂ ᏤᎯ ᎨᏒ ᎾᏲᎪ ᎤᏟ ᎢᏗᎦᎸᏉᏗ ᏗᎵᏍᎪᎸᏔᏅᎯ ᏗᎦᏅᎦᎸᏙᏗ. (Nasgi iyusdi udulvdi nigalisdisgvgi hia nasgi nigadv nusdidanv galvladi tsehi ditlilostanvhi gesv diganvgalvdodiyi hia nasgi (dilisgolvdodi,) galvladisgini tsehi gesv nayogo utli idigalvquodi dilisgolvtanvhi diganvgalvdodi.) — Cherokee Corpus</title>
