    <title>ᎾᎯᏳᏉᏃ ᏕᎠᏂᎳᏫᎡ ᎤᏂᏧᏈᏍᏗ ᏴᏫ, ᎾᏍᎩ ᎢᏳᏍᏗ ᏕᎠᎾᏓᎳᏍᏛᏗᏍᎨᎢ, ᎾᏍᎩ ᎤᎴᏅᎮ ᎯᎠ ᎢᎬᏴ ᏂᏚᏪᏎᎴ ᎬᏩᏍᏓᏩᏗᏙᎯ, ᎢᏤᏯᏔᎮᏍᏗ ᎠᎪᏙᏗ ᎠᏂᏆᎵᏏ ᎤᎾᏤᎵᎦ, ᎾᏍᎩ ᎠᏠᎾᏍᏗ ᏥᎩ. (Nahiyuquono deanilawie unitsuquisdi yvwi, nasgi iyusdi deanadalasdvdisgei, nasgi ulenvhe hia igvyv niduwesele gvwasdawadidohi, Itseyatahesdi agododi Aniqualisi unatseliga, nasgi atlonasdi tsigi.) — Cherokee Corpus</title>
