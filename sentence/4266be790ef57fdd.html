    <title>ᎾᏍᎩᏃ ᎦᎸᎳᏗ ᎡᎯ ᎢᏥᏙᏓ ᏧᏪᏥ ᏂᏣᎵᏍᏗᏍᎨᏍᏗ; ᎾᏍᎩᏰᏃ ᎤᏤᎵ ᏅᏙ ᏕᎦᎾᏄᎪᏫᏎᎰ ᎤᏂᏲ ᎠᎴ ᎠᏃᏍᏛ, ᎠᎴ ᏓᎦᏅᏓᏁᎰ ᎤᎾᏓᏅᏘ ᎠᎴ ᎤᏂᏁᎫᏥᏛ. (Nasgino galvladi ehi Itsidoda tsuwetsi nitsalisdisgesdi; nasgiyeno utseli nvdo degananugowiseho uniyo ale anosdv, ale daganvdaneho unadanvti ale uninegutsidv.) — Cherokee Corpus</title>
