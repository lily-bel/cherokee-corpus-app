    <title>ᎢᏳ ᎠᎴ ᎩᎶ ᎯᎠ ᏥᏂᏣᏛᏅ ᎢᏥᎦᏴᎵᎨ ᎨᏒ ᎤᏪᏥ ᎦᏚ ᏳᏔᏲᏎᎭ, ᏥᏌ ᏅᏯᏉ ᏯᎲᏏ?  ᎢᏳ ᎠᎴ ᎠᏣᏗ ᏳᏔᏲᏎᎭ, ᏥᎪ ᎠᏣᏗ ᎤᏅᏁᏗ ᎨᏒ ᎢᎾᏛᏉ ᏱᎦᏅᎥᏏ? (Iyu ale gilo hia tsinitsadvnv itsigayvlige gesv uwetsi gadu yutayoseha, tsisa nvyaquo yahvsi?  Iyu ale atsadi yutayoseha, tsigo atsadi unvnedi gesv inadvquo yiganvvsi?) — Cherokee Corpus</title>
