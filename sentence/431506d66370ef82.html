    <title>ᎠᏎᏃ ᎾᏍᎩ ᎯᎠ ᏄᏍᏗ ᎢᏨᏃᎲᏏ, ᎠᏍᏆᎸᎲ ᎢᏣᏅᏓᏗᏍᏗᏱ ᎾᏍᎩ ᎢᏨᏃᏁᎸᎢ.  ᎠᎴ ᎥᏝ ᎾᏍᎩ ᎢᎬᏱᏱᏉ ᏱᏨᏃᏁᎴᎢ, ᎢᏧᎳᎭ ᎢᏕᏙᎲ ᏅᏓᎦᎵᏍᏙᏗᏍᎬᎩ. (Aseno nasgi hia nusdi itsvnohvsi, asqualvhv itsanvdadisdiyi nasgi itsvnonelvi.  Ale vtla nasgi igvyiyiquo yitsvnonelei, itsulaha idedohv nvdagalisdodisgvgi.) — Cherokee Corpus</title>
