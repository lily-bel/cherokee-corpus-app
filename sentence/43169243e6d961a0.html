    <title>ᎠᎴ ᎦᎪ ᎢᏳᏍᏗ ᎤᎬᏫᏳᎯ, ᏓᎿᎭᏩ ᏱᏅᏛᏅᏁᎵ ᏅᏩᏓᎴ ᎤᎬᏫᏳᎯ, ᎥᏝ ᎢᎬᏱ ᏱᎦᎲᏍᎪ ᎠᎴ ᏯᏓᏅᏖᏍᎪ ᏰᎵᏉ ᎠᏍᎪᎯ ᎢᏯᎦᏴᎵ ᏓᏘᏁᎲ ᏗᎬᏩᎾᏟᏴᏗ ᎨᏒ ᏧᎦᏘᎴᎩ ᏔᎳᏍᎪᎯ ᎢᏯᎦᏴᎵ ᏓᏘᏁᎲᎢ. (Ale gago iyusdi ugvwiyuhi, dahnawa yinvdvnvneli nvwadale ugvwiyuhi, vtla igvyi yigahvsgo ale yadanvtesgo yeliquo asgohi iyagayvli datinehv digvwanatliyvdi gesv tsugatilegi talasgohi iyagayvli datinehvi.) — Cherokee Corpus</title>
