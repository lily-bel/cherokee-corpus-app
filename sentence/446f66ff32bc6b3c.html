    <title>ᎡᏂᎾᏯᏃ ᎤᏪᏅᏎᎢ, ᎠᎴ ᎠᏓᏁᎸ ᎤᏴᎴᎢ, ᏚᏏᏔᏛᏃ ᎯᎠ ᏄᏪᏎᎢ; ᏐᎳ ᎥᎩᏅᏟ, ᎤᎬᏫᏳᎯ ᏥᏌ, ᎾᏍᎩ ᎬᏂᎨᏒ ᏥᏂᏣᏛᏁᎴ ᏔᎢᏒᎢ ᏗᎩᏅᏒ ᎥᏣᎪᏩᏛᏗᏱ ᎠᎴ ᏣᎧᎵᎢᏍᏗᏱ ᎦᎸᏉᏗᏳ ᎠᏓᏅᏙ.</title>
    <meta name="description" content="Eninayano uwenvsei, ale adanelv uyvlei, dusitadvno hia nuwesei; Sola vginvtli, Ugvwiyuhi Tsisa, nasgi gvnigesv tsinitsadvnele taisvi diginvsv vtsagowadvdiyi ale tsakaliisdiyi Galvquodiyu Adanvdo.&#10;And Ananias went his way, and entered into the house; and putting his hands on him said, Brother Saul, the Lord, even Jesus, that appeared unto thee in the way as thou camest, hath sent me, that thou mightest receive thy sight, and be filled with the Holy Ghost. [CNT]" />
