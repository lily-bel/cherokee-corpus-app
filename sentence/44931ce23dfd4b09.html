    <title>ᏞᏍᏗ ᎠᎴ ᎤᏁᎳᏅᎯ ᏗᏰᎸᎯ ᏗᏣᏓᏙᎵᏍᏓᏁᎯ ᏱᎨᏎᏍᏗ, ᎾᏍᎩᏯ ᎢᎦᏛ ᎾᏍᎩ Ꮎ ᏥᏄᎾᏍᏕᎢ; ᎾᏍᎩᏯ ᎯᎠ ᏥᏂᎬᏅ ᏥᎪᏪᎳ, ᏴᏫ ᎤᎾᏅᏅᎩ ᏛᎾᎵᏍᏓᏴᏂᏒᎩ ᎠᎴ ᏛᎾᏗᏔᎯᏒᎩ, ᏚᎾᎴᏅᎩ ᎤᎾᏁᏦᏅᎩ.</title>
    <meta name="description" content="Tlesdi ale unelanvhi diyelvhi ditsadadolisdanehi yigesesdi, nasgiya igadv nasgi na tsinunasdei; nasgiya hia tsinigvnv tsigowela, Yvwi unanvnvgi dvnalisdayvnisvgi ale dvnaditahisvgi, dunalenvgi unanetsonvgi.&#10;Neither be ye idolaters, as were some of them; as it is written, The people sat down to eat and drink, and rose up to play. [CNT]" />
