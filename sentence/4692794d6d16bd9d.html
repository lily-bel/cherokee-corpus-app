    <title>ᎤᏍᎩ ᎾᎿᎭᏭᏓᎪᎾᏛᏔᏅᎯ ᎡᏉᎯᏳ ᎠᎴ ᎦᎸᏉᏗᏳ ᎡᎩᏚᎢᏍᏓᏁᎸᎯ ᏥᎩ, ᎾᏍᎩ ᎯᎠ ᏕᏨᏗᏍᎬ ᎨᏣᏠᏯ ᏍᏙᏗ ᏱᏂᎦᎵᏍᏓ ᎤᏁᎳᏅᎯ ᏄᏍᏛᎢ, ᎡᏣᏗᏫᏎᎸᎯ ᎨᏒ ᎤᏲᎢ ᎡᎶᎯ ᏤᎭ ᎠᏚᎸᏗ ᎨᏒ ᏨᏗᏓᎴᎲᏍᎦ. (Usgi nahna wudagonadvtanvhi equohiyu ale galvquodiyu egiduisdanelvhi tsigi, nasgi hia detsvdisgv getsatloya sdodi yinigalisda Unelanvhi nusdvi, etsadiwiselvhi gesv uyoi elohi tseha adulvdi gesv tsvdidalehvsga.) — Cherokee Corpus</title>
