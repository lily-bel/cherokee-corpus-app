    <title>ᎠᏰᎸᏰᏃ ᏌᏉᏉ ᏥᎩ, ᎠᎴ ᎤᏣᏘ ᏥᏚᏫᏞᏫᏒ, ᎠᎴ ᏂᎦᏛ ᎾᏍᎩ ᏌᏉ ᎠᏰᎸ ᏚᏫᏞᏫᏒ, ᎤᏣᏘ ᎨᏒ, ᏌᏉᏉ ᎠᏰᎸ ᏥᏂᎦᎵᏍᏗᎭ; ᎾᏍᎩᏯ ᎾᏍᏉ ᏄᏍᏗ ᎦᎶᏁᏛ. (Ayelvyeno saquoquo tsigi, ale utsati tsiduwitlewisv, ale nigadv nasgi saquo ayelv duwitlewisv, utsati gesv, saquoquo ayelv tsinigalisdiha; nasgiya nasquo nusdi Galonedv.) — Cherokee Corpus</title>
