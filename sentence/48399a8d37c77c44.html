    <title>ᎾᏍᎩ ᏥᏄᏍᏗ ᎬᏂᎨᏒᎢᏳ ᎤᏣᏘᏂ ᏂᏣᏛᏁᎲᎢ, ᏅᏗᎦᎵᏍᏙᏗᎭ ᎢᏨᏒᏉ ᏕᏣᏓᏰᎢᎵᏙᎲᎢ.  ᎦᏙᏃ ᎤᏟ ᎣᏏᏳ ᏂᏥᏰᎸᏍᎬᎾ ᏥᎩ ᎤᏲ ᎢᏰᏨᏁᏗᏱ?  ᎦᏙᏃ ᎤᏟ ᎣᏏᏳ ᏂᏥᏰᎸᏍᎬᎾ ᏥᎩ ᏧᎬᏩᎶᏗ ᎡᏥᎩᎡᏗᏱ? (Nasgi tsinusdi gvnigesviyu utsatini nitsadvnehvi, nvdigalisdodiha itsvsvquo detsadayeilidohvi.  Gadono utli osiyu nitsiyelvsgvna tsigi uyo iyetsvnediyi?  gadono utli osiyu nitsiyelvsgvna tsigi tsugvwalodi etsigiediyi?) — Cherokee Corpus</title>
