    <title>ᎠᏎᏃ ᏛᏍᏆᎸᎯ, ᎠᎴ ᎿᎭᏉ ᎤᏍᏆᎸᎲ, ᎾᏍᎩ ᎤᏙᎯᏳᏒ ᎠᎾᏓᏙᎵᏍᏗᏍᎩ ᏛᎾᏓᏙᎵᏍᏓᏁᎵ ᎠᎦᏴᎵᎨ ᏙᏛᏅᏔᏂ ᏧᎾᏓᏅᏙ ᎠᎴ ᏚᏳᎪᏛᎢ; ᎠᎦᏴᎵᎨᏰᏃ ᏚᏲᎰ ᎾᏍᎩ ᎢᏳᎾᏍᏗ ᎬᏩᏓᏙᎵᏍᏓᏁᎯ. (Aseno dvsqualvhi, ale hnaquo usqualvhv, nasgi udohiyusv anadadolisdisgi dvnadadolisdaneli Agayvlige dodvnvtani tsunadanvdo ale duyugodvi; Agayvligeyeno duyoho nasgi iyunasdi gvwadadolisdanehi.) — Cherokee Corpus</title>
