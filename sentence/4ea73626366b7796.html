    <title>ᎿᎭᏉᏃ ᏚᏍᏆᏃᏴᎳᏒᎩ, ᎠᎴ ᏚᏴᏓᏉᎶᎥᎩ, ᎠᎴ ᏚᎾᎦᎸᎲᎩ; ᎠᎴ ᎦᏙᎯ ᎤᏣᏘ ᎤᎵᏖᎸᏅᎩ, ᎾᏍᎩ ᎢᎦᎢ ᎥᏝ ᎢᎸᎯᏳ ᏱᎬᏩᎵᏖᎸᏃ ᏴᏫ ᎡᎶᎯ ᎤᎾᏕᏅ ᏅᏓᎬᏩᏓᎴᏅᏛ, ᎾᏍᎩ ᎢᏳᎵᏂᎩᏛ ᎠᎴ ᎾᏍᎩ ᎢᏳᏍᎦᏎᏗ.</title>
    <meta name="description" content="Hnaquono dusquanoyvlasvgi, ale duyvdaquolovgi, ale dunagalvhvgi; ale gadohi utsati ulitelvnvgi, nasgi igai vtla ilvhiyu yigvwalitelvno yvwi elohi unadenv nvdagvwadalenvdv, nasgi iyulinigidv ale nasgi iyusgasedi.&#10;And there were voices, and thunders, and lightnings; and there was a great earthquake, such as was not since men were upon the earth, so mighty an earthquake, and so great. [CNT]" />
