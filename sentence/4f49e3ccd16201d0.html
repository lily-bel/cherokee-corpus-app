    <title>ᎿᎭᏉᏃ ᎠᏴ ᎥᏝ ᎡᎶᎯ ᏱᎨᎠ, ᎯᎠᏍᎩᏂ ᎡᎶᎯ ᎠᏁᎭ, ᎠᏴᏃ ᏗᏦᎸ ᏫᏥᎦᏘ.  ᎡᏣᎸᏉᏗᏳ ᎡᏙᏓ, ᏨᏒ ᏕᏣᏙᎥ ᎲᏗᏍᎨᏍᏗ ᏕᎯᏍᏆᏂᎪᏕᏍᏗ ᏗᏍᎩᎧᏁᎸᎯ, ᏌᏉᏉ ᎢᏳᎾᎵᏍᏙᏗᏱ, ᎾᏍᎩᏯ ᏂᎯ ᎠᏴᏃ ᏌᏉᏉ ᏥᎩ. (Hnaquono ayv vtla elohi yigea, hiasgini elohi aneha, ayvno ditsolv witsigati.  Etsalvquodiyu Edoda, tsvsv detsadov hvdisgesdi dehisquanigodesdi disgikanelvhi, saquoquo iyunalisdodiyi, nasgiya nihi ayvno saquoquo tsigi.) — Cherokee Corpus</title>
