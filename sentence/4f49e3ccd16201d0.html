    <title>ᎿᎭᏉᏃ ᎠᏴ ᎥᏝ ᎡᎶᎯ ᏱᎨᎠ, ᎯᎠᏍᎩᏂ ᎡᎶᎯ ᎠᏁᎭ, ᎠᏴᏃ ᏗᏦᎸ ᏫᏥᎦᏘ. ᎡᏣᎸᏉᏗᏳ ᎡᏙᏓ, ᏨᏒ ᏕᏣᏙᎥ ᎲᏗᏍᎨᏍᏗ ᏕᎯᏍᏆᏂᎪᏕᏍᏗ ᏗᏍᎩᎧᏁᎸᎯ, ᏌᏉᏉ ᎢᏳᎾᎵᏍᏙᏗᏱ, ᎾᏍᎩᏯ ᏂᎯ ᎠᏴᏃ ᏌᏉᏉ ᏥᎩ.</title>
    <meta name="description" content="Hnaquono ayv vtla elohi yigea, hiasgini elohi aneha, ayvno ditsolv witsigati. Etsalvquodiyu Edoda, tsvsv detsadov hvdisgesdi dehisquanigodesdi disgikanelvhi, saquoquo iyunalisdodiyi, nasgiya nihi ayvno saquoquo tsigi.&#10;And now I am no more in the world, but these are in the world, and I come to thee. Holy Father, keep through thine own name those whom thou hast given me, that they may be one, as we are. [CNT]" />
