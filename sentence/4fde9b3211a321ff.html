    <title>ᎢᏳᏍᎩᏂ ᎾᏍᎩ ᎤᏤᎵ ᏱᏓᎩᎸᏫᏍᏓᏁᎭ, ᎾᏍᏉ ᎠᏴ ᏂᏍᎩᏲᎢᏳᎲᏍᎬᎾ ᏱᎩ, ᎠᏎ ᎢᏦᎯᏳᎲᏍᎨᏍᏗ ᎾᏍᎩ Ꮎ ᏗᎦᎸᏫᏍᏓᏁᏗ ᎨᏒᎢ; ᎾᏍᎩᏃ ᏰᎵ ᎨᏣᏙᎴᎰᎯᏍᏗ ᎠᎴ ᎨᏦᎯᏳᏗ ᏱᎩ ᎠᎦᏴᎵᎨᎢ, ᎠᎩᏯᎥᎢ ᎠᎴ ᎾᏍᎩ ᎠᏴ ᏥᏯᎥᎢ</title>
    <meta name="description" content="Iyusgini nasgi utseli yidagilvwisdaneha, nasquo ayv nisgiyoiyuhvsgvna yigi, ase itsohiyuhvsgesdi nasgi na digalvwisdanedi gesvi; nasgino yeli getsadolehohisdi ale getsohiyudi yigi Agayvligei, agiyavi ale nasgi ayv tsiyavi&#10;But if I do, though ye believe not me, believe the works: that ye may know, and believe, that the Father is in me, and I in him. [CNT]" />
