    <title>ᎠᏂ ᎯᎠ ᎢᎦᏓᎨᏳᏗ ᎨᏒ ᎤᎧᎵᏨᎯ, ᏄᎵᏍᏔᏅ ᎾᏍᎩ ᏂᏗᎾᏰᏍᎬᎾ ᎢᏳᎵᏍᏙᏗᏱ ᏗᎫᎪᏙᏗᏱ ᎢᎦ ᎨᏎᏍᏗ, ᏅᏗᎦᎵᏍᏙᏗᎭ ᎾᏍᎩᏯ ᏄᏍᏛ ᎾᏍᏉ ᎾᏍᎩ ᏂᎦᏍᏗ ᎠᏴ ᎠᏂ ᎡᎶᎯ. (Ani hia igadageyudi gesv ukalitsvhi, nulistanv nasgi nidinayesgvna iyulisdodiyi digugododiyi iga gesesdi, nvdigalisdodiha nasgiya nusdv nasquo nasgi nigasdi ayv ani elohi.) — Cherokee Corpus</title>
