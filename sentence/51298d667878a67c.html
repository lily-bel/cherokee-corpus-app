    <title>ᏣᏂᏰᏃ ᏚᏳᎪᏛ ᏚᎸᏫᏍᏓᏁᎲ ᎢᏥᎷᏤᎸᎩ, ᎠᎴ ᎥᏝ ᏰᏦᎢᏳᏁᎢ, ᎠᏕᎸᏍᎩᏂ ᎠᏂᎩᏏᏙᎯ ᎠᎴ ᎠᏂᎨᏴ ᏧᎾᏤᏌᏘ ᏥᎬᏬᎯᏳᏅᎩ; ᏂᎯᏃ ᎢᏣᏙᎴᎰᏒ ᎥᏝ ᎣᏂ ᏱᏗᏥᏁᏟᏴᏎ ᏕᏣᏓᏅᏛ ᎡᏦᎢᏳᏗᏱ. (Tsaniyeno duyugodv dulvwisdanehv itsilutselvgi, ale vtla yetsoiyunei, adelvsgini anigisidohi ale anigeyv tsunatsesati tsigvwohiyunvgi; nihino itsadolehosv vtla oni yiditsinetliyvse detsadanvdv etsoiyudiyi.) — Cherokee Corpus</title>
