    <title>ᏥᏌᏃ ᎤᏁᏨ ᎯᎠ ᏄᏪᏒᎩ; Ꮭ ᏱᏥᎦᏔᎭ ᏄᏍᏛ ᎢᏥᏔᏲᎯᎲᎢ. ᏥᎪ ᏰᎵᏉ ᎨᏣᏗᏔᏍᏗ ᎤᎵᏍᏈᏗ ᎠᏟᏍᏛ ᎠᏴ ᏨᏓᎦᏗᏔᎯ, ᎠᎴᏍᎪ ᏰᎵᏉ ᏱᏕᏣᏬᏍᏓ ᎠᏴ ᎾᏍᎩ ᏨᏓᏴᏆᏬᏍᏔᏂ? ᏰᎵᏉ, ᎤᎾᏛᏅᎩ.</title>
    <meta name="description" content="Tsisano unetsv hia nuwesvgi; Tla yitsigataha nusdv itsitayohihvi. Tsigo yeliquo getsaditasdi ulisquidi atlisdv ayv tsvdagaditahi, alesgo yeliquo yidetsawosda ayv nasgi tsvdayvquawostani? Yeliquo, unadvnvgi.&#10;But Jesus answered and said, Ye know not what ye ask. Are ye able to drink of the cup that I shall drink of, and to be baptized with the baptism that I am baptized with? They say unto him, We are able. [CNT]" />
