    <title>ᎠᎴ ᎾᏍᎩ ᏕᏥᏯᏁᎶᏛ ᎥᎩᏩᏛᏗᏱ, ᎠᏆᏚᏓᎴᏍᏙᏗ ᎠᏋᏒ ᎠᏆᏤᎵ ᎾᎩᎲᎾ ᎨᏒᎢ, ᎾᏍᎩ ᏗᎧᎿᎭᏩᏛᏍᏗ ᎬᏩᏓᏁᏗ ᏥᎩ, Ꮎ-ᏍᎩᏂ ᎦᎶᏁᏛ ᎪᎯᏳᏗ ᎨᏒ ᏨᏗᏓᎴᎲᏍᎦ, ᎾᏍᎩ ᎠᏚᏓᎴᏍᏙᏗ ᎨᏒ ᎤᏁᎳᏅᎯ ᏅᏓᏳᏓᎴᏅᎯ ᏥᎩ, ᎾᏍᎩ ᎪᎯᏳᏗ ᎨᏒ ᎬᏙᏗ ᏥᎩ. (Ale nasgi detsiyanelodv vgiwadvdiyi, aquadudalesdodi aquvsv aquatseli nagihvna gesvi, nasgi dikahnawadvsdi gvwadanedi tsigi, nasgini Galonedv gohiyudi gesv tsvdidalehvsga, nasgi adudalesdodi gesv Unelanvhi nvdayudalenvhi tsigi, nasgi gohiyudi gesv gvdodi tsigi.) — Cherokee Corpus</title>
