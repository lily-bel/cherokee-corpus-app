    <title>ᎢᎬᏱᏱᏃ ᎠᎴ ᏔᎵᏁ, ᎠᏂᏯᏫᏍᎬ ᎤᏂᎶᏒ ᏭᏂᎷᏤ ᏔᎷᎩᏍᎩ ᏗᏍᏚᏛ ᏗᎦᏚᎲ ᏫᎦᎾᏄᎪᎢᏍᏗᏍᎬᎢ, ᎾᏍᎩ ᎤᏩᏒᏉ ᎤᎾᎵᏍᏚᎢᎡᎴᎢ. ᎤᏂᏄᎪᏨᏃ ᏌᏉ ᎦᎳᏅᏛ ᎤᏂᎶᏎᎢ, ᎩᎳᏉᏃ ᎢᏴᏛ ᏗᎧᎿᎭᏩᏗᏙᎯ ᎤᏓᏓᎴᏔᏁᎢ.</title>
    <meta name="description" content="Igvyiyino ale taline, aniyawisgv unilosv wunilutse talugisgi disdudv digaduhv wigananugoisdisgvi, nasgi uwasvquo unalisduielei. Uninugotsvno saquo galanvdv unilosei, gilaquono iyvdv dikahnawadidohi udadaletanei.&#10;When they were past the first and the second ward, they came unto the iron gate that leadeth unto the city; which opened to them of his own accord: and they went out, and passed on through one street; and forthwith the angel departed from him. [CNT]" />
