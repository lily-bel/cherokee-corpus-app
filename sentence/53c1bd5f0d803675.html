    <title>ᎾᏍᎩᏰᏃ ᎤᏁᎳᏅᎯ ᎤᏅᏏᏓᏍᏗ ᏂᎯ ᎣᏍᏛ ᎢᏣᎵᏍᏓᏁᏗ ᏧᎸᏫᏍᏓᏁᎯ. ᎢᏳᏍᎩᏂ ᎤᏲᏉ ᏙᏣᎸᏫᏍᏓᏁᎮᏍᏗ, ᎯᏍᎦᎢᎮᏍᏗ; ᎥᏝᏰᏃ ᎠᏎᏃ ᏱᎦᏁᎭ ᎠᏰᎳᏍᏗ-ᎦᏅᎯᏛ; ᎤᏁᎳᏅᎯᏰᏃ ᎤᏅᏏᏓᏍᏗ ᎾᏍᎩ, ᎤᏞᎩ, ᎠᏍᏛᏗᏍᏗᏍᎩ ᎾᏍᎩ Ꮎ ᎤᏲ ᏧᎸᏫᏍᏓᏁᎯ.</title>
    <meta name="description" content="Nasgiyeno [nugvwiyusadegi] Unelanvhi unvsidasdi nihi osdv itsalisdanedi tsulvwisdanehi. Iyusgini uyoquo dotsalvwisdanehesdi, hisgaihesdi; vtlayeno aseno yiganeha ayelasdiganvhidv; Unelanvhiyeno unvsidasdi nasgi, utlegi, asdvdisdisgi nasgi na uyo tsulvwisdanehi.&#10;For he is the minister of God to thee for good. But if thou do that which is evil, be afraid; for he beareth not the sword in vain: for he is the minister of God, a revenger to execute wrath upon him that doeth evil. [CNT]" />
