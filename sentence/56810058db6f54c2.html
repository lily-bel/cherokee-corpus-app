    <title>ᎠᎴ ᎢᏳ ᏧᏪᏥ ᏱᎩ, ᎿᎭᏉ ᎢᎦᏘᏰᎯ ᏧᎬᏩᎶᏗ; ᎢᎦᏘᏰᏗ ᏧᎬᏩᎶᏗ ᎤᏁᎳᏅᎯ ᎤᏓᏁᏗ ᎨᏒᎢ, ᎠᎴ ᎦᎶᏁᏛ ᎢᏧᎳᎭ ᎢᎦᏘᏰᏗ; ᎢᏳᏃ ᎰᏩ ᏱᎦᏠᏯᏍᏗᎭ ᎠᎩᎵᏲᎬᎢ, ᎾᏍᏉ ᎢᎦᏠᏯᏍᏙᏗ ᎨᏎᏍᏗ ᎠᏥᎸᏉᏗᏍᎬᎢ. (Ale iyu tsuwetsi yigi, hnaquo igatiyehi tsugvwalodi; igatiyedi tsugvwalodi Unelanvhi udanedi gesvi, ale Galonedv itsulaha igatiyedi; iyuno howa yigatloyasdiha agiliyogvi, nasquo igatloyasdodi gesesdi atsilvquodisgvi.) — Cherokee Corpus</title>
