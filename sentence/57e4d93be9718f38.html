    <title>ᎠᎴ ᎤᎬᏫᏳᎯ ᎤᏂᎧᎲᎩ ᎾᏍᎩ ᏗᎧᎿᎭᏩᏗᏙᎯ ᏥᎩ ᎾᏍᎩ ᏫᎾᏍᏛᎾ ᎠᏔᎴᏒᎢ, ᎾᏍᎩᏃ ᎠᏂᏈᎷ ᎤᏂᏬᏂᎯᏍᏗ ᎠᏆᏙᎾ ᏚᏙᎥ, ᎠᏂᎪᎢᏍᎩᏂ ᎤᏂᏬᏂᎯᏍᏗ ᎨᏒ ᎠᏉᎵᏯᏂ ᏚᏙᎥ. (Ale ugvwiyuhi unikahvgi nasgi dikahnawadidohi tsigi nasgi winasdvna atalesvi, nasgino Aniquilu uniwonihisdi Aquadona dudov, Anigoisgini uniwonihisdi gesv Aquoliyani dudov.) — Cherokee Corpus</title>
