    <title>ᎴᎹᏱ ᎧᏁᎬ ᎤᎾᏛᎦᏅᎩ, ᏓᏂᏴᎬᎢ, ᎠᎴ ᏓᎾᏠᏱᎲᎢ, ᎠᎴ ᎤᏣᏘ ᎤᏁᎷᎬᎢ; ᎴᏥᎵ ᏓᏍᎪᏂᎲ ᏧᏪᏥ, ᎠᎴ ᏄᏚᎵᏍᎬᎾ ᎨᏒ ᎤᏄᏬᎯᏍᏗᏱ, ᏅᏗᎦᎵᏍᏙᏗᏍᎬ ᎾᏁᎲᎾᏉ ᎨᏒᎢ. (Lemayi kanegv unadvganvgi, daniyvgvi, ale danatloyihvi, ale utsati unelugvi; letsili dasgonihv tsuwetsi, ale nudulisgvna gesv unuwohisdiyi, nvdigalisdodisgv nanehvnaquo gesvi.) — Cherokee Corpus</title>
