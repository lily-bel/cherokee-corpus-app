    <title>ᎾᏍᎩ ᎢᏳᏍᏗ ᎢᏳᏃ ᎭᏓᏁᎮᏍᏗ ᏞᏍᏗ ᎠᏤᎷᎩ ᎢᎬᏱ ᏫᏱᏃᏴᎵᏍᏗᏍᎨᏍᏗ ᎾᏍᎩ ᏥᎾᎾᏛᏁᎰ ᎤᎾᏠᎾᏍᏗ ᏧᎳᏫᎢᏍᏗᏱ ᎠᎴ ᎡᎾᎢᏓᏍᏗᏱ ᏕᎦᎳᏅᏛᎢ, ᏴᏫᏉ ᎬᏩᏂᎸᏉᏙᏗᏱ ᏧᏂᏰᎸᏐᎢ; ᎤᏙᎯᏳᎯᏯ ᎢᏨᏲᏎᎭ, ᎨᎦᎫᏴᎡᎸ. (Nasgi iyusdi iyuno hadanehesdi tlesdi atselugi igvyi wiyinoyvlisdisgesdi nasgi tsinanadvneho unatlonasdi tsulawiisdiyi ale enaidasdiyi degalanvdvi, yvwiquo gvwanilvquododiyi tsuniyelvsoi; udohiyuhiya itsvyoseha, gegaguyvelv.) — Cherokee Corpus</title>
