    <title>ᎠᎴ ᏥᎻ, ᎠᎴ ᏏᏆᏏ, ᎠᎴ ᏣᏂ, ᎾᏍᎩ ᏗᎵᎫᏍᏙ ᎨᏥᏰᎸᎢ, ᎤᏂᎪᎲ ᎬᏩᎦᏘᏯ ᎤᏓᏙᎵᏍᏗ ᎨᏒ ᎾᏍᎩ ᎥᎩᏁᎸᎢ, ᎠᏂᎦᏘᏏᏗᏢ ᏕᎪᎩᎾᏌᏕᏔᏅᎩ ᎠᏴ ᎠᎴ ᏆᏂᏆ ᎬᏂᎨᏒ ᎢᎬᏁᎯ ᏙᎦᏚᏓᏛᎢ; ᎠᏴ ᏧᎾᏓᎴᏅᏛ ᏴᏫ ᏗᏁᎲ ᏬᎩᏂᎶᎯᏍᏗᏱ ᎤᎬᏩᎵ, ᎤᏅᏒᏃ ᏗᎨᏥᎤᏍᏕᏎᎸᎯ ᏗᏁᎲᎢ;</title>
    <meta name="description" content="Ale Tsimi, ale Siquasi, ale Tsani, nasgi diligusdo getsiyelvi, unigohv gvwagatiya udadolisdi gesv nasgi vginelvi, anigatisiditlv degoginasadetanvgi ayv ale Quaniqua gvnigesv igvnehi dogadudadvi; ayv tsunadalenvdv yvwi dinehv woginilohisdiyi ugvwali, unvsvno digetsiusdeselvhi dinehvi;&#10;And when James, Cephas, and John, who seemed to be pillars, perceived the grace that was given unto me, they gave to me and Barnabas the right hands of fellowship; that we should go unto the heathen, and they unto the circumcision. [CNT]" />
