    <title>ᎢᏳᏃ ᏴᏫ ᎢᏳᎾᏛᏁᏗ ᎢᏯᏆᏛᏁᎸᎯ ᏱᎩ, ᏅᎩ ᏗᏂᏅᏌᏗ ᎤᏂᏍᎦᏎᏗ ᎣᎦᎵᎸᎯ ᏱᎩ ᎡᏈᏌ ᎦᏚᎲᎢ, ᎦᏙ ᎬᎩᏁᏉᏤᏗ ᎣᏍᏛ ᎨᏒ, ᎢᏳᏃ ᏧᏂᏲᎱᏒᎯ ᏧᎾᎴᎯᏐᏗ ᏂᎨᏒᎾ ᏱᎩ?  ᎢᏓᎵᏍᏓᏴᎲᏍᎨᏍᏗ, ᎠᎴ ᎢᏓᏗᏔᏍᎨᏍᏗ; ᏑᎾᎴᏉᏰᏃ ᏙᏓᏗᏲᎱᏏ. (Iyuno yvwi iyunadvnedi iyaquadvnelvhi yigi, nvgi dininvsadi unisgasedi ogalilvhi yigi Equisa gaduhvi, gado gvginequotsedi osdv gesv, iyuno tsuniyohusvhi tsunalehisodi nigesvna yigi?  idalisdayvhvsgesdi, ale idaditasgesdi; sunalequoyeno dodadiyohusi.) — Cherokee Corpus</title>
    <meta name="description" content="If after the manner of men I have fought with beasts at Ephesus, what advantageth it me, if the dead rise not? let us eat and drink; for to morrow we die." />
