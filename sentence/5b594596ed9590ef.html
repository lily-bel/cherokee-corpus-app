    <title>ᎢᏤᏯᏔᎯᏳ ᎨᏎᏍᏗ ᎾᏍᎩᏃ ᏞᏍᏗ ᎩᎶ ᎡᏍᎦ ᎤᏬᎭᏒᎩ ᎤᏁᎳᏅᎯ ᎬᏩᎦᏘᏯ ᎤᏓᏙᎵᏍᏗ ᎨᏒᎢ; ᏞᏍᏗ ᎤᏴᏍᏗ ᎤᎿᎭᏍᏕᏢ ᎦᎾᏄᎪᎬ ᎢᏣᏕᏯᏙᏔᏅᎩ, ᎠᎴ ᎾᏍᎩ ᎢᏳᏩᏂᏌᏛ ᎤᏂᏣᏘ ᎦᏓᎭ ᎢᏳᎾᎵᏍᏔᏅᎩ; (Itseyatahiyu gesesdi nasgino tlesdi gilo esga uwohasvgi Unelanvhi gvwagatiya udadolisdi gesvi; tlesdi uyvsdi uhnasdetlv gananugogv itsadeyadotanvgi, ale nasgi iyuwanisadv unitsati gadaha iyunalistanvgi;) — Cherokee Corpus</title>
