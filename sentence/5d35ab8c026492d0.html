    <title>ᎠᏎᏃ ᎢᏥᎪᏩᏘᎭ ᏅᏩᏓᎴ ᏗᎧᎿᎭᏩᏛᏍᏗ ᏥᏰᎸ ᎠᏆᏚᏓᏕᏫᏒᎢ, ᎾᏍᎩ ᏗᎦᏘᎴᎩ ᏗᎧᎿᎭᏩᏛᏍᏗ ᎠᏆᏓᏅᏙᎩᎯ ᎠᎲᎢ, ᎠᎴ ᏥᏴᎩ ᎢᏯᏋᏁᎯ ᎠᏊᏓᎸᎥᏍᎩ ᏗᎧᎿᎭᏩᏛᏍᏗᏱ ᎠᏍᎦᏂ ᎤᏤᎵᎦ, ᎾᏍᎩ ᏥᏰᎸ ᎠᏆᏚᏓᏕᏫᏒ ᎠᎲᎢ. (Aseno itsigowatiha nvwadale dikahnawadvsdi tsiyelv aquadudadewisvi, nasgi digatilegi dikahnawadvsdi aquadanvdogihi ahvi, ale tsiyvgi iyaquvnehi aquudalvvsgi dikahnawadvsdiyi asgani utseliga, nasgi tsiyelv aquadudadewisv ahvi.) — Cherokee Corpus</title>
