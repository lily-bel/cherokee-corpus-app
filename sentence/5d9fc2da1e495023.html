    <title>ᎠᎴ ᎾᏍᏉ ᎬᏂᎨᏒ ᏂᎦᎵᏍᏗᎭ ᎦᏰᎪᎩ ᎣᏥᏃᎮᏍᎩ ᎨᏒ ᎤᏁᎳᏅᎯ; ᎣᏥᏃᎮᎸᏰᏃ ᎤᏁᎳᏅᎯ ᎾᏍᎩ ᎤᏲᎱᏒ ᏕᎤᎴᏔᏅ ᎦᎶᏁᏛ; ᏧᎴᎳᏅᎯ ᏂᎨᏒᎾ ᏥᎩ, ᎢᏳᏃ ᎰᏩ ᏧᎾᎴᎯᏐᏗ ᏂᎨᏒᎾ ᏱᎩ ᏧᏂᏲᎱᏒᎯ. (ale nasquo gvnigesv nigalisdiha gayegogi otsinohesgi gesv Unelanvhi; otsinohelvyeno Unelanvhi nasgi uyohusv deuletanv Galonedv; tsulelanvhi nigesvna tsigi, iyuno howa tsunalehisodi nigesvna yigi tsuniyohusvhi.) — Cherokee Corpus</title>
