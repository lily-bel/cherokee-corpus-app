    <title>ᎾᏍᎩ ᎢᏳᏍᏗ ᎢᏗᎯᏯᏍᎬ ᎠᎴᏅᏙᏗ ᎦᎶᏁᏛ ᎤᏤᎵ ᏗᏕᏲᏗ ᎨᏒᎢ, ᏂᎦᎷᎶᎬᎾ ᎨᏒ ᎢᏴᏛ ᏫᏗᏰᎢᎶᎦ; ᏔᎵᏁ ᎦᎫᏍᏛᏗ ᏂᏗᎲᏍᎬᎾ ᎦᏁᏟᏴᏍᏗ ᎨᏒ ᎣᏓᏅᏛ ᎤᎬᏩᎵ, ᎠᏓᎯᎯᏉ ᏗᎦᎸᏫᏍᏓᏁᏗ ᏥᎩ, ᎠᎴ ᎤᏁᎳᏅᎯ ᎪᎯᏳᏗ ᎨᏒᎢ, (Nasgi iyusdi idihiyasgv alenvdodi Galonedv utseli dideyodi gesvi, nigalulogvna gesv iyvdv widiyeiloga; taline gagusdvdi nidihvsgvna ganetliyvsdi gesv odanvdv ugvwali, adahihiquo digalvwisdanedi tsigi, ale Unelanvhi gohiyudi gesvi,) — Cherokee Corpus</title>
