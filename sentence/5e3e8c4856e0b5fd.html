    <title>ᎠᎴ ᏫᏓᏆᎧᎾᏅᎩ, ᎠᎴ ᎬᏂᏳᏉ ᎤᏬᏓᎸ  ᏐᏈᎵ ; ᎠᎴ ᎾᎿᎭᎤᎩᎵ ᎠᏲᎱᎯᏍᏗ ᏚᏙᎥᎩ, ᎠᎴ ᏨᏍᎩᏃ ᎤᏍᏓᏩᏗᏒᎩ; ᎠᎴ ᎨᎦᎵᏍᎪᎸᏓᏁᎸᎩ ᎾᏍᎩ ᏅᎩ ᎢᎦᏛᎯ ᎨᏒ ᎡᎶᎯ ᎾᏍᎩ ᏌᏉ ᏄᏓᎥ ᎾᎿᎭᏧᏂᎯᏍᏗᏱ ᎠᏰᎳᏍᏗᎦᏅᎯᏛ ᎬᏗ, ᎠᎴ ᎠᎪᏄ ᎬᏗ, ᎠᎴ ᎥᏳᎩ ᎬᏗ, ᎠᎴ ᎢᎾᎨ ᎠᏁᎯ ᎤᏂᏍᎦᏎᏗ ᏗᎬᏗ. (Ale widaquakananvgi, ale gvniyuquo uwodalv [dikanodiyi] soquili [witsigovgi]; ale nahna ugili Ayohuhisdi dudovgi, ale tsvsgino usdawadisvgi; ale gegalisgolvdanelvgi nasgi nvgi igadvhi gesv elohi nasgi saquo nudav nahna tsunihisdiyi ayelasdiganvhidv gvdi, ale agonu gvdi, ale vyugi gvdi, ale inage anehi unisgasedi digvdi.) — Cherokee Corpus</title>
