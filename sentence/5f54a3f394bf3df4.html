    <title>ᎢᏳᏃ ᎿᎭᏉ ᎠᏍᎦᏯ ᎦᏁᎳ ᏓᎴᏅᎭ ᎠᎴ ᎠᏍᏚᏅᎭ ᎦᎶᎯᏍᏗᏱ, ᏂᎯᏃ ᎢᏣᎴᏅᎲ ᏙᏱᏗᏢ ᎢᏥᏙᎾᎥᎢ, ᎠᎴ ᎢᏨᏂᎮᏍᏗ ᎦᎶᎯᏍᏗᏱ ᎯᎠ ᏂᏤᏪᏍᎨᏍᏗ, ᏣᎬᏫᏳᎯ, ᏣᎬᏫᏳᎯ, ᎡᏍᎩᏍᏚᎢᏏ; ᎠᎴ ᏗᎧᏁᏨ ᎯᎠ ᏅᏗᏥᏪᏎᎸᎭ, ᎥᏝ ᏱᏥᎦᏔᎭ ᏗᏣᏓᎴᏅᎢ;</title>
    <meta name="description" content="Iyuno hnaquo Asgaya ganela dalenvha ale asdunvha galohisdiyi, nihino itsalenvhv doyiditlv itsidonavi, ale itsvnihesdi galohisdiyi hia nitsewesgesdi, Tsagvwiyuhi, Tsagvwiyuhi, esgisduisi; ale dikanetsv hia nvditsiweselvha, vtla yitsigataha ditsadalenvi;&#10;When once the master of the house is risen up, and hath shut to the door, and ye begin to stand without, and to knock at the door, saying, Lord, Lord, open unto us; and he shall answer and say unto you, I know you not whence ye are: [CNT]" />
