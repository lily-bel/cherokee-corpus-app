    <title>ᎠᏏᏉᏃ ᎦᏬᏂᏍᎨᎢ, ᎬᏂᏳᏉ ᎤᏍᎪᏍᏛ ᎤᎶᎩᎳ ᎤᎾᏓᏩᏗᏍᏔᏁᎢ, ᎠᎴ ᎬᏂᏳᏉ ᎾᎿᎭᎤᎶᎩᎸ ᏧᏁᏤᎢ, ᎯᎠ ᏅᏧᏪᏎᎢ; ᎯᎠ ᎾᏍᎩ ᎠᏇᏥ ᏥᎨᏳᎢ, ᎾᏍᎩ ᎣᏏᏳ ᏥᏰᎸᎢ, ᎾᏍᎩ ᎡᏣᏛᏓᏍᏓᏁᎮᏍᏗ. (Asiquono gawonisgei, gvniyuquo usgosdv ulogila unadawadistanei, ale gvniyuquo nahna ulogilv tsunetsei, Hia nvtsuwesei; hia nasgi Aquetsi tsigeyui, nasgi osiyu tsiyelvi, nasgi etsadvdasdanehesdi.) — Cherokee Corpus</title>
