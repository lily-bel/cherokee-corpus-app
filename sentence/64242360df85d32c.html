    <title>ᏥᏌᏃ ᏂᎦᎥ ᏧᏛᎾ ᏕᎦᏚᎲ ᎠᎴ ᏧᏍᏗ ᏕᎦᏚᎲ ᎤᏪᏙᎸᎩ, ᏓᏕᏲᎲᏍᎬᎩ ᏧᏂᎳᏫᎢᏍᏗᏱ, ᎠᎴ ᎠᎵᏥᏙᎲᏍᎬᎩ ᎣᏍᏛ ᎧᏃᎮᏛ ᎦᎸᎳᏗ ᎡᎯ ᎤᎬᏫᏳᎯ ᎨᏒ ᎧᏃᎮᏍᎬᎩ, ᎠᎴ ᏕᎧᏅᏫᏍᎬ ᏂᎦᎥ ᏚᏂᏢᎬ ᎠᎴ ᏂᎦᎥ ᎥᏳᎩ ᏴᏫ ᎤᏂᏱᎵᏕᎲᎢ. (Tsisano nigav tsudvna degaduhv ale tsusdi degaduhv uwedolvgi, dadeyohvsgvgi tsunilawiisdiyi, ale alitsidohvsgvgi osdv kanohedv galvladi ehi ugvwiyuhi gesv kanohesgvgi, ale dekanvwisgv nigav dunitlvgv ale nigav vyugi yvwi uniyilidehvi.) — Cherokee Corpus</title>
