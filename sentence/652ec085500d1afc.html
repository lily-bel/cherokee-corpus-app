    <title>ᎾᏍᎩᏃ ᏄᎵᏍᏔᏂᏙᎸ ᎣᏂ ᏦᏩ ᎠᎵᎹᏗᏱ ᎡᎯ, ᏥᏌ ᎠᏍᏓᏩᏗᏙᎯ ᎨᏒᎩ, ᎠᏎᏃ ᎤᏕᎵᏛᏉ ᎠᏂᏧᏏ ᏓᏍᎦᎢᎲᎢ ᏅᏓᎦᎵᏍᏙᏗᏍᎬᎩ, ᎾᏍᎩ ᏦᏩ ᎤᏔᏲᏎᎸᎩ ᏆᎴᏗ ᎤᏁᏍᏗᏱ ᏥᏌ ᎠᏰᎸᎢ. ᏆᎴᏗᏃ ᎤᎵᏍᎪᎸᏓᏁᎸᎩ. ᎰᏩᏃ ᎤᎷᏨᎩ ᎤᏁᏒᎩ ᏥᏌ ᎠᏰᎸᎢ.</title>
    <meta name="description" content="Nasgino nulistanidolv oni Tsowa Alimadiyi ehi, Tsisa asdawadidohi gesvgi, aseno udelidvquo Anitsusi dasgaihvi nvdagalisdodisgvgi, nasgi Tsowa utayoselvgi Qualedi unesdiyi Tsisa ayelvi. Qualedino ulisgolvdanelvgi. Howano ulutsvgi unesvgi Tsisa ayelvi.&#10;And after this Joseph of Arimathaea, being a disciple of Jesus, but secretly for fear of the Jews, besought Pilate that he might take away the body of Jesus: and Pilate gave him leave. He came therefore, and took the body of Jesus. [CNT]" />
