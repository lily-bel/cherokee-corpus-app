    <title>ᏕᏤᏯᏙᏤᎮᏍᏗ ᏗᏃᏪᎵᏍᎩ, ᎾᏍᎩ ᏧᎾᏚᎵᏍᎪ ᏗᎦᏅᎯᏛ ᏧᎾᏄᏩᎢ ᎤᏁᏓᏍᏗᏱ, ᎠᎴ ᎣᏏᏳ ᏧᏂᏰᎸᎭ ᎨᏥᏲᎵᏍᏗᏱ ᏗᎦᏃᏙᏗᏱ, ᎠᎴ ᏄᎬᏫᏳᏒ ᏕᎦᏍᎩᎸ ᏗᎦᎳᏫᎢᏍᏗᏱ, ᎠᎴ ᏄᎬᏫᏳᏒ ᏗᎾᏢᏗᏱ ᏓᎾᎵᏍᏓᏴᎲᏍᎬᎢ; (Detseyadotsehesdi dinowelisgi, nasgi tsunadulisgo diganvhidv tsunanuwai unedasdiyi, ale osiyu tsuniyelvha getsiyolisdiyi diganododiyi, ale nugvwiyusv degasgilv digalawiisdiyi, ale nugvwiyusv dinatlvdiyi danalisdayvhvsgvi;) — Cherokee Corpus</title>
