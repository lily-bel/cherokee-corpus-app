    <title>ᎿᎭᏉ ᎠᏆᏓᏅᏙ ᎤᏕᏯᏔᏁᎭ; ᎦᏙᏃ ᏓᎦᏛᏂ?  [ᎯᎠᏍᎪ ᏅᏓᏥᏪᏏ,] ᎡᏙᏓ, ᏍᏊᏓᎳᎩ ᎪᎯ ᎨᏒᎢ?  ᎠᏎᏃ ᎾᏍᎩ ᎢᏳᏍᏗ ᏣᎩᏍᏆᎸᎡ ᎪᎯ ᎠᎩᏍᏆᎸᎡᏗᏱ ᎠᎩᎷᏥᎸ. (Hnaquo aquadanvdo udeyataneha; gadono dagadvni?  [Hiasgo nvdatsiwesi,] Edoda, squudalagi gohi gesvi?  Aseno nasgi iyusdi tsagisqualve gohi agisqualvediyi agilutsilv.) — Cherokee Corpus</title>
