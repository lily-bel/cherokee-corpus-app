    <title>ᎠᎴ ᏅᏩᏓᎴ ᏗᎧᎿᎭᏩᏗᏙᎯ ᎠᏥᎸᎨᎳᏍᏗᏱ ᎾᎥ ᏓᏳᏄᎪᏨᎩ, ᎾᏍᎩ ᎤᎲᎩ ᎠᏓᏅᏖᏍᎬᏉ ᎢᏳᏩᏗᏱ ᎠᏥᎸ; ᎠᎴ ᎠᏍᏓᏯ ᎤᎵᏍᏓᏁᎸᎩ ᎪᏍᏓᏯ ᎠᏍᎫᏕᏍᏗ ᎦᏁᎯ, ᎯᎠ ᏂᎦᏪᏍᎬᎩ, ᎠᏍᎫᏕᏍᏗ ᏣᏤᎵ ᎪᏍᏓᏯ ᎲᏓ, ᎠᎴ ᎯᏟᏌ ᏖᎸᎳᏗ ᎡᎶᎯ ᎤᏛᏒᎯ; ᏖᎸᎳᏗᏰᏃ ᎿᎭᏉ ᎤᏅᎾᏏᏌᏛ. (Ale nvwadale dikahnawadidohi atsilvgelasdiyi nav dayunugotsvgi, nasgi uhvgi adanvtesgvquo iyuwadiyi atsilv; ale asdaya ulisdanelvgi gosdaya asgudesdi ganehi, hia nigawesgvgi, Asgudesdi tsatseli gosdaya hvda, ale hitlisa telvladi elohi udvsvhi; telvladiyeno hnaquo unvnasisadv.) — Cherokee Corpus</title>
