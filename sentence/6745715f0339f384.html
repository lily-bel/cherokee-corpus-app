    <title>ᎠᎩᏁᎫ ᎾᏆᎵᏍᏔᏅ ᎦᏢᏆᏍᎬᎢ; ᏂᎯ ᏂᏍᎩᏴᏂᏌᏏ; ᏂᎯᏰᏃ ᏍᎩᎸᏉᏙᏗ ᎨᏒᎩ; ᎥᏝᏰᏃ ᏑᏓᎴᎩ ᎤᏅ ᎡᏍᎦ ᏱᎦᏥᏲᎠᏍᎦ ᏄᏂᎬᏫᏳᏒ ᎨᏥᏅᏏᏛ, ᎾᏍᏉ ᎠᏴ ᎪᎱᏍᏗ ᏂᎨᏒᎾ ᏱᎩ. (Aginegu naqualistanv gatlvquasgvi; nihi nisgiyvnisasi; nihiyeno sgilvquododi gesvgi; vtlayeno sudalegi unv esga yigatsiyoasga nunigvwiyusv getsinvsidv, nasquo ayv gohusdi nigesvna yigi.) — Cherokee Corpus</title>
