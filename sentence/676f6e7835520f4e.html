    <title>ᎩᎶ ᎠᏓᏎᎪᎩᏍᎨᏍᏗ ᎦᎫᏍᏛᏗ ᏅᏓᏥᏴᏁᎵ ᏗᎦᎳᏫᎢᏍᏗᏱ ᎠᏆᏁᎳᏅᎯ ᎤᏤᎵᎦ, ᎥᏝᏃ ᎿᎭᏉ ᎢᎸᎯᏳ ᎤᏄᎪᎢᏍᏗ ᏱᎨᏎᏍᏗ; ᎠᎴ ᏓᏥᏲᏪᎶᏔᏂ ᏚᏙᎥ ᎠᏆᏁᎳᏅᎯ, ᎠᎴ ᏚᏙᎥ ᎦᏚᎲ ᎠᏆᏁᎳᏅᎯ ᎤᏤᎵᎦ, ᎾᏍᎩ ᎢᏤ ᏥᎷᏏᎵᎻ ᏥᎩ, ᎾᏍᎩ ᎦᎸᎶᎢ ᎤᏁᎳᏅᎯᏱ ᏣᏗᏓᎴᎲᏍᎦ; ᎠᎴ ᏓᏥᏲᏪᎶᏔᏂ ᎢᏤ ᏓᏆᏙᎥᎢ.</title>
    <meta name="description" content="Gilo adasegogisgesdi gagusdvdi nvdatsiyvneli digalawiisdiyi Aquanelanvhi utseliga, vtlano hnaquo ilvhiyu unugoisdi yigesesdi; ale datsiyowelotani dudov Aquanelanvhi, ale dudov gaduhv Aquanelanvhi utseliga, nasgi itse Tsilusilimi tsigi, nasgi galvloi Unelanvhiyi tsadidalehvsga; ale datsiyowelotani itse daquadovi.&#10;Him that overcometh will I make a pillar in the temple of my God, and he shall go no more out: and I will write upon him the name of my God, and the name of the city of my God, which is new Jerusalem, which cometh down out of heaven from my God: and I will write upon him my new name. [CNT]" />
