    <title>ᎤᏣᏘᏃ ᎤᏁᎷᏅᎩ; ᏗᏃᏪᎵᏍᎩᏃ ᎠᏂᏆᎵᏏ ᎤᎾᎵᎪᏒ ᎤᎾᎵᎪᎯ ᏚᎾᎴᏅ ᎤᎾᏗᏒᎩ, ᎯᎠ ᏄᏂᏪᏒᎩ; ᎥᏝ ᎪᎱᏍᏗ ᎤᏲ ᏲᏥᏩᏛᎡᎭ ᎯᎠ ᎠᏍᎦᏯ, ᎢᏳᏍᎩᏂ ᎠᏓᏅᏙ ᎠᎴ ᏗᎧᎿᎭᏩᏗᏙᎯ ᎤᏁᏤᎸᎯ ᎨᏎᏍᏗ, ᏞᏍᏗ ᎤᏁᎳᏅᎯ ᏤᏓᏟᏴᎡᎸᎩ.</title>
    <meta name="description" content="Utsatino unelunvgi; dinowelisgino Aniqualisi unaligosv unaligohi dunalenv unadisvgi, hia nuniwesvgi; Vtla gohusdi uyo yotsiwadveha hia asgaya, iyusgini adanvdo ale dikahnawadidohi unetselvhi gesesdi, tlesdi Unelanvhi tsedatliyvelvgi.&#10;And there arose a great cry: and the scribes that were of the Pharisees&#39; part arose, and strove, saying, We find no evil in this man: but if a spirit or an angel hath spoken to him, let us not fight against God. [CNT]" />
