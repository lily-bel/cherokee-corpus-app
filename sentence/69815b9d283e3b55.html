    <title>ᎥᏝ ᏂᎯ ᎠᏴ ᏍᎩᏯᏑᏰᏛ ᏱᎩ, ᎠᏴᏍᎩᏂ ᏂᎯ ᎢᏨᏯᏑᏰᏛ, ᎠᎴ ᏕᏨᏯᎧᏅ ᎢᏤᏅᏍᏗᏱ ᎤᏁᏉᏨᎯ ᎢᏥᎾᏄᎪᏫᏍᏗᏱ, ᎠᎴ ᎤᏁᏉᏨᎯ ᎢᏣᏤᎵᎦ ᎦᎶᏐᎲᏍᎩ ᏂᎨᏒᎾ ᎢᏳᎵᏍᏙᏗᏱ, ᏂᎦᎥᏃ ᎪᎱᏍᏗ ᎡᏥᏔᏲᏎᎮᏍᏗ ᎠᎦᏴᎵᎨᎢ, ᎠᏴ ᏓᏆᏙᎥ ᎢᏥᏔᏲᏍᏗᏍᎨᏍᏗ, ᎾᏍᎩ ᎢᏥᏁᏗᏱ.</title>
    <meta name="description" content="Vtla nihi ayv sgiyasuyedv yigi, ayvsgini nihi itsvyasuyedv, ale detsvyakanv itsenvsdiyi unequotsvhi itsinanugowisdiyi, ale unequotsvhi itsatseliga galosohvsgi nigesvna iyulisdodiyi, nigavno gohusdi etsitayosehesdi Agayvligei, ayv daquadov itsitayosdisgesdi, nasgi itsinediyi.&#10;Ye have not chosen me, but I have chosen you, and ordained you, that ye should go and bring forth fruit, and that your fruit should remain: that whatsoever ye shall ask of the Father in my name, he may give it you. [CNT]" />
