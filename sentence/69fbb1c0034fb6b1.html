    <title>ᎠᏎᏃ ᎠᏂᏧᏏ ᏄᏃᎯᏳᏒᎾ, ᎠᏅᏳᎬ ᏅᏓᏳᎵᏍᏙᏔᏅᎩ, ᏫᏚᏂᏯᏅᎲᎩ ᎩᎶ ᎢᏳᎾᏍᏗ ᎤᏂᏁᎫᏥᏛ ᎤᏁᏙᎯ, ᏚᏂᏟᏌᏅᏃ ᎤᏂᏖᎸᏅᎩ ᎦᏚᎲᎢ; ᏚᏂᎦᏘᎴᏅᏃ ᏤᏌᏂ ᎦᏁᎸᎢ, ᏴᏫ ᏧᏂᏄᎪᏫᏎᏗᏱ ᎤᎾᏁᎶᏔᏅᎩ.</title>
    <meta name="description" content="Aseno Anitsusi nunohiyusvna, anvyugv nvdayulisdotanvgi, widuniyanvhvgi gilo iyunasdi uninegutsidv unedohi, dunitlisanvno unitelvnvgi gaduhvi; dunigatilenvno Tsesani ganelvi, yvwi tsuninugowisediyi unanelotanvgi.&#10;But the Jews which believed not, moved with envy, took unto them certain lewd fellows of the baser sort, and gathered a company, and set all the city on an uproar, and assaulted the house of Jason, and sought to bring them out to the people. [CNT]" />
