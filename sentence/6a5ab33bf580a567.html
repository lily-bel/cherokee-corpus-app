    <title>ᎠᏛᏳᎨᏗ ᎨᏒᎢ, ᏗᏓᎯᏍᏗ ᎨᏒᎢ, ᎤᏓᏴᏍᏕᏍᏗ ᎨᏒᎢ, ᏧᏂᏴᏍᏕᏍᎩ ᏧᏂᎳᏫᎢᏍᏗ ᎨᏒᎢ, ᎠᎴ ᎾᏍᎩ ᎢᏳᏍᏗᏓᏂ; ᎯᎠ ᎾᏍᎩ ᎦᏳᎳ ᏂᏨᏃᏁᎭ, ᎾᏍᎩᏯ ᎾᏍᏉ ᎢᏨᏃᏁᎸᎯ ᏥᎩ ᏧᏩᎫᏔᏅᏒᎢ, Ꮎ ᎾᏍᎩ ᎢᏯᎾᏛᏁᎯ ᎥᏝ ᎤᎾᏤᎵ ᏱᏅᎦᎵᏍᏓ ᎤᏁᎳᏅᎯ ᎤᏤᎵᎪᎯ.</title>
    <meta name="description" content="Advyugedi gesvi, didahisdi gesvi, udayvsdesdi gesvi, tsuniyvsdesgi tsunilawiisdi gesvi, ale nasgi iyusdidani; hia nasgi gayula nitsvnoneha, nasgiya nasquo itsvnonelvhi tsigi tsuwagutanvsvi, na nasgi iyanadvnehi vtla unatseli yinvgalisda Unelanvhi utseligohi.&#10;Envyings, murders, drunkenness, revellings, and such like: of the which I tell you before, as I have also told you in time past, that they which do such things shall not inherit the kingdom of God. [CNT]" />
