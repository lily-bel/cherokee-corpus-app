    <title>ᎾᏍᎩᏯ ᎾᏍᏉ ᏄᏛᏁᎴ ᎤᎾᎵᏍᏓᏴᏃᏅ, ᎤᎵᏍᏈᏗ ᎤᎩᏎᎢ, ᎯᎠ ᏄᏪᏎᎢ; ᎯᎠ ᎾᏍᎩ ᎢᏤ ᎧᏃᎮᏛ ᏓᏠᎯᏍᏛᎢ, ᎠᏴ ᎠᎩᎩᎬ ᏨᏛᏍᏓᏱᏗ; ᎯᎠ ᎾᏍᎩ ᏂᏣᏛᏁᎮᏍᏗ, ᎢᏳᏍᏗᎭ ᎾᏍᎩ ᎢᏣᏗᏔᏍᎨᏍᏗ ᎠᏴ ᏍᎩᏯᏅᏓᏗᏍᎬᎢ. (Nasgiya nasquo nudvnele unalisdayvnonv, ulisquidi ugisei, hia nuwesei; Hia nasgi itse kanohedv datlohisdvi, ayv agigigv tsvdvsdayidi; hia nasgi nitsadvnehesdi, iyusdiha nasgi itsaditasgesdi ayv sgiyanvdadisgvi.) — Cherokee Corpus</title>
