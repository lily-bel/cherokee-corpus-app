    <title>ᎠᎴ ᎿᎭᏉ ᏕᏣᏘᏁᎨᏍᏗ, ᎠᎴ ᏕᏥᏲᏍᎨᏍᏗ, ᏞᏍᏗ ᎢᎬᏱ ᎦᏰᎯ ᏱᏤᎵᎯᏍᎨᏍᏗ ᎢᏥᏪᏍᏗᏱ ᎢᏥᏁᎢᏍᏗᏱ, ᎠᎴ ᏞᏍᏗ ᎢᎬᏱ ᎦᏰᎯ ᏱᏣᏓᏅᏖᏍᎨᏍᏗ; ᏄᏍᏛᏍᎩᏂ ᏫᎯᏳ ᎨᏒ ᎡᏥᏁᎸ ᎾᏍᎩ ᎢᏥᏁᎨᏍᏗ; ᎥᏝᏰᏃ ᏂᎯ ᏱᏣᏁᎪᎢ, ᎦᎸᏉᏗᏳᏍᎩᏂ ᎠᏓᏅᏙ.</title>
    <meta name="description" content="Ale hnaquo detsatinegesdi, ale detsiyosgesdi, tlesdi igvyi gayehi yitselihisgesdi itsiwesdiyi itsineisdiyi, ale tlesdi igvyi gayehi yitsadanvtesgesdi; nusdvsgini wihiyu gesv etsinelv nasgi itsinegesdi; vtlayeno nihi yitsanegoi, Galvquodiyusgini Adanvdo.&#10;But when they shall lead you, and deliver you up, take no thought beforehand what ye shall speak, neither do ye premeditate: but whatsoever shall be given you in that hour, that speak ye: for it is not ye that speak, but the Holy Ghost. [CNT]" />
