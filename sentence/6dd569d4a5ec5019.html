    <title>ᏄᏬᎯᏳᏒᎾᏰᏃ ᎠᏍᎦᏯ ᎤᏓᏅᎦᎸᏛ ᎢᎩ ᎤᏓᎵᎢ ᎢᏳᏩᏂᏌᏛ, ᎠᎴ ᏄᏬᎯᏳᏒᎾ ᎠᎨᏴ ᎤᏓᏅᎦᎸᏛ ᎢᎩ ᎤᏰᎯ ᎢᏳᏩᏂᏌᏛ; ᎥᏝᏰᏃ ᎾᏍᎩ, ᎿᎭᏉ ᏗᏤᏥ ᎠᏂᎦᏓᎭ ᏱᎩ; ᎠᏎᏃ ᎪᎯ ᎨᏒ ᎤᎾᏓᏅᎦᎸᏛ ᎢᎩ. (Nuwohiyusvnayeno asgaya udanvgalvdv igi udalii iyuwanisadv, ale nuwohiyusvna ageyv udanvgalvdv igi uyehi iyuwanisadv; vtlayeno nasgi, hnaquo ditsetsi anigadaha yigi; aseno gohi gesv unadanvgalvdv igi.) — Cherokee Corpus</title>
