    <title>ᎢᏥᎦᏔᎭᏰᏃ ᎬᏩᎦᏘᏯ ᎤᏓᏙᎵᏍᏗ ᎨᏒ ᎤᎬᏫᏳᎯ ᎢᎦᏤᎵᎦ ᏥᏌ ᎦᎶᏁᏛ, ᎾᏍᎩ ᎤᏪᎾᎢᏳ ᏥᎨᏎᎢ, ᎠᏎᏃ ᏂᎯ ᎨᏒ ᏅᏗᎦᎵᏍᏙᏗᏍᎬ ᎤᏲ ᎢᏳᏛᎿᎭᏕᎩ ᏄᎵᏍᏔᏅᎢ, ᎾᏍᎩ ᎤᏩᏒ ᎤᏲ ᎢᏳᏛᎿᎭᏕᎩ ᎨᏒ ᎢᏳᏩᏂᏐᏗᏱ ᏂᎯ ᏗᏤᎿᎭᎢ ᎢᏣᎵᏍᏙᏗᏱ. (Itsigatahayeno gvwagatiya udadolisdi gesv Ugvwiyuhi igatseliga Tsisa Galonedv, nasgi uwenaiyu tsigesei, aseno nihi gesv nvdigalisdodisgv uyo iyudvhnadegi nulistanvi, nasgi uwasv uyo iyudvhnadegi gesv iyuwanisodiyi nihi ditsehnai itsalisdodiyi.) — Cherokee Corpus</title>
