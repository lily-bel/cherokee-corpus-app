    <title>ᎯᎠᏰᏃ ᎾᏍᎩ [ᏗᎧᎿᎭᏩᏛᏍᏗ,] ᏞᏍᏗ ᏣᏓᏲᏁᎸᎩ, ᏞᏍᏗ ᏣᏓᎸᎩ, ᏞᏍᏗ ᏣᏃᏍᎩᏒᎩ, ᏞᏍᏗ ᎦᏰᎪᎩ ᏣᏃᎮᎸᎩ, ᏞᏍᏗ ᎪᎱᏍᏗ ᏱᏣᎬᎥᏍᎨᏍᏗ, ᎠᎴ ᏂᎦᎥ ᏅᏩᏓᎴ ᏗᎧᎿᎭᏩᏛᏍᏗ, ᎯᎠᏉ ᎢᎦᏪᏛ ᏥᎩ ᎾᎿᎭᎠᏙᏣᎸᏍᎦ ᎤᏍᏆᎳ ᎧᏁᎢᏍᏗ ᎨᏒᎢ, ᏨᏒ ᏂᏣᏓᎨᏳᏒ ᎾᏍᎩᏯ ᏂᎨᏳᏎᏍᏗ ᎾᎥ ᎢᏗᏍᏓᏓᎳ. (Hiayeno nasgi [dikahnawadvsdi,] Tlesdi tsadayonelvgi, tlesdi tsadalvgi, Tlesdi tsanosgisvgi, Tlesdi gayegogi tsanohelvgi, Tlesdi gohusdi yitsagvvsgesdi, ale nigav nvwadale dikahnawadvsdi, hiaquo igawedv tsigi nahna adotsalvsga usquala kaneisdi gesvi, Tsvsv nitsadageyusv nasgiya nigeyusesdi nav idisdadala.) — Cherokee Corpus</title>
