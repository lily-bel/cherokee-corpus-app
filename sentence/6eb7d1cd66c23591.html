    <title>ᎥᏝ ᎠᎴ ᎩᎶ ᎢᏤ ᎩᎦᎨ-ᎠᏗᏔᏍᏗ ᏧᏪᏘ ᏗᏑᏢᏛ ᏱᏓᏟᏍᏗᏍᎪᎢ; ᎢᏤᏰᏃ ᎩᎦᎨ-ᎠᏕᏔᏍᏗ ᏱᏙᎦᏣᎦᎸ ᏗᏑᏢᏛ, ᎠᎴ ᎩᎦᎨ-ᎠᏗᏔᏍᏗ ᏯᏤᏬᎩ, ᎠᎴ ᏗᏑᏢᏛ ᏱᏓᏲᎩ; ᎢᏤᏍᎩᏂ ᎩᎦᎨ-ᎠᏗᏔᏍᏗ, ᏗᏤ ᏗᏑᏢᏛ ᏗᏟᏍᏙᏗ ᎨᏐᎢ. (Vtla ale gilo itse gigageaditasdi tsuweti disutlvdv yidatlisdisgoi; itseyeno gigageadetasdi yidogatsagalv disutlvdv, ale gigageaditasdi yatsewogi, ale disutlvdv yidayogi; itsesgini gigageaditasdi, ditse disutlvdv ditlisdodi gesoi.) — Cherokee Corpus</title>
    <meta name="description" content="And no man putteth new wine into old bottles: else the new wine doth burst the bottles, and the wine is spilled, and the bottles will be marred: but new wine must be put into new bottles." />
