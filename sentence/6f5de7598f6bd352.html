    <title>ᎾᏍᎩ ᎢᏳᏍᏗ ᎭᏅᏓᏓ ᏄᏍᏛ ᏕᏣᏓᏂᎸᏨ ᎠᎴ ᏣᏛᎦᏅᎢ, ᎠᎴ ᎠᏍᏓᏯ ᏘᏂᏴ ᎠᎴ ᎯᏁᏟᏴᎾ ᏣᏓᏅᏛᎢ. ᎾᏍᎩ ᎢᏳᏍᏗ ᎢᏳᏃ ᏂᏯᏫᏍᎬᎾ ᎢᎨᏎᏍᏗ ᏓᎬᎷᏤᎵ ᎦᏃᏍᎩᏍᎩ ᏥᎦᎷᎪ ᎾᏍᎩᏯᎢ, ᎥᏝ ᎠᎴ ᏱᎦᏔᎮᏍᏗ ᎢᏳ ᎨᏒ ᏗᎬᎷᏤᎵᏒᎢ.</title>
    <meta name="description" content="Nasgi iyusdi hanvdada nusdv detsadanilvtsv ale tsadvganvi, ale asdaya tiniyv ale hinetliyvna tsadanvdvi. Nasgi iyusdi iyuno niyawisgvna igesesdi dagvlutseli ganosgisgi tsigalugo nasgiyai, vtla ale yigatahesdi iyu gesv digvlutselisvi.&#10;Remember therefore how thou hast received and heard, and hold fast, and repent. If therefore thou shalt not watch, I will come on thee as a thief, and thou shalt not know what hour I will come upon thee. [CNT]" />
