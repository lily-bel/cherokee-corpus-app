    <title>ᎬᏂᎨᏒ ᎾᏅᏁᎭ ᎠᏂᎦᏔᎯᏳ ᎨᏒ ᎤᏁᎳᏅᎯ; ᎠᏎᏃ ᏚᏂᎸᏫᏍᏓᏁᎲ ᎢᎬᏩᏓᏱᎭ, ᏅᏗᎦᎵᏍᏙᏗᎭ ᎤᏂᏂᏆᏘᏍᏗᏳ ᎨᏒᎢ, ᎠᎴ ᎤᏃᎯᏳᎯᏍᏛ ᏂᎨᏒᎾ ᎨᏒᎢ; ᎠᎴ ᏂᎦᎥ ᎣᏍᏛ ᏗᎦᎸᏫᏍᏓᏁᏗ ᎨᏒ ᎨᏥᏐᏅᎢᏍᏔᏅᎯ. (Gvnigesv nanvneha anigatahiyu gesv Unelanvhi; aseno dunilvwisdanehv igvwadayiha, nvdigalisdodiha uniniquatisdiyu gesvi, ale unohiyuhisdv nigesvna gesvi; ale nigav osdv digalvwisdanedi gesv getsisonvistanvhi.) — Cherokee Corpus</title>
