    <title>ᎾᏍᎩᏃ ᏥᏄᏍᏗ ᎢᏳᏃ ᏧᎾᏁᎶᏗ ᎤᎾᏓᏡᎬ ᏂᎦᏛ ᎢᎸᎯᏢ ᏱᏚᏂᎳᏫᏦᏅ, ᎠᎴ ᏂᎦᏛ ᏧᏓᎴᏅᏛ ᏗᎦᏬᏂᎯᏍᏗ ᎨᏒ ᏱᏓᏂᏬᏂᎭ, ᏳᏂᏴᎵᎸᏃ ᎾᎿᎭᏂ ᎾᏂᎦᏔᎾᎥᎾ, ᎠᎴ ᎠᏃᎯᏳᎲᏍᎩᏂ ᏂᎨᏒᎾ, ᏝᏍᎪ ᏚᏂᎸᏃᏘᎭ ᏴᎬᎾᏛ? (Nasgino tsinusdi iyuno tsunanelodi unadatlugv nigadv ilvhitlv yidunilawitsonv, ale nigadv tsudalenvdv digawonihisdi gesv yidaniwoniha, yuniyvlilvno nahnani nanigatanavna, ale anohiyuhvsgini nigesvna, tlasgo dunilvnotiha yvgvnadv?) — Cherokee Corpus</title>
