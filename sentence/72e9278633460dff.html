    <title>ᎠᎺᏉᎯᏃ ᎤᎶᏗ ᏃᏳᎯ ᎨᏒ ᎥᏆᎴᏔᏅᎩ, ᎠᎴ ᏅᎩ ᏗᎦᏅᏌᏗ ᏥᎪᎥᎩ ᎠᎺᏉᎯ ᏓᏳᏚᎩᏒᎩ, ᎦᎵᏉᎩ, ᏓᏍᎫᏓᏛᎩ ᎠᎴ ᎠᏍᎪᎯ ᏚᎷᎬᎩ, ᏚᎷᎬᏃ ᎠᏍᎪᎯ ᏚᎵᏍᏚᎸᎩ, ᏓᏍᎫᏓᏛᏃ ᎤᏁᎳᏅᎯ ᏚᏙᎥ ᎠᏐᏢᎢᏍᏙᏗ ᎨᏒ ᎪᏪᎸᎩ. (Amequohino ulodi noyuhi gesv vqualetanvgi, ale nvgi diganvsadi tsigovgi amequohi dayudugisvgi, galiquogi, dasgudadvgi ale asgohi dulugvgi, dulugvno asgohi dulisdulvgi, dasgudadvno unelanvhi dudov asotlvisdodi gesv gowelvgi.) — Cherokee Corpus</title>
