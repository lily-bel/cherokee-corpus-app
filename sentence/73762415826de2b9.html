    <title>ᏗᎧᎿᎭᏩᏛᏍᏗᏰᏃ ᎥᏝ ᎦᎷᎶᎩ ᏂᎨᏒᎾ ᎢᎬᏁᎯ ᏱᎨᏎ ᎪᎱᏍᏗ; ᎤᏟᏍᎩᏂ ᎢᏝᏍᏛ ᎤᏚᎩ ᎬᏗ ᎨᏒ ᎠᏴᏔᏂᎸᎯ ᏥᎩ, ᎾᏍᎩ ᎢᏛᏗᏍᎬ ᎾᎥ ᎦᏰᏗᎷᏤᏗ ᏥᏂᎦᎵᏍᏗᎭ ᎤᏁᎳᏅᎯ ᎦᎷᎶᎩ ᏂᎨᏒᎾ ᏂᎬᏁᎭ.</title>
    <meta name="description" content="Dikahnawadvsdiyeno vtla galulogi nigesvna igvnehi yigese gohusdi; utlisgini itlasdv udugi gvdi gesv ayvtanilvhi tsigi, nasgi idvdisgv nav gayedilutsedi tsinigalisdiha Unelanvhi galulogi nigesvna nigvneha.&#10;For the law made nothing perfect, but the bringing in of a better hope did; by the which we draw nigh unto God. [CNT]" />
