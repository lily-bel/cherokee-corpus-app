    <title>ᎢᏳᏰᏃ ᏥᏍᎦᎾ ᏱᎩ, ᎠᎴ ᎬᎩᏲᎱᎯᏍᏗ ᎢᎦᎢ ᎠᎩᏍᎦᏅᏨᎯ ᏱᎩ, ᎥᏝ ᏱᏙᎬᏆᏢᏫᏏ ᎠᎩᏲᎱᎯᏍᏗᏱ; ᎢᏳᏍᎩᏂ ᏄᏙᎯᏳᏒᎾ ᏱᎩ ᎯᎠ ᎾᏍᎩ ᏥᎬᏇᎯᏍᏗᎭ, ᎥᏝ ᎩᎶ ᏰᎵ ᏗᎬᏩᏂᏲᎯᏎᏗ ᏱᎩ ᎠᏴ. ᏏᏐᎢ ᏫᏥᎥᏍᏓ.</title>
    <meta name="description" content="Iyuyeno tsisgana yigi, ale gvgiyohuhisdi igai agisganvtsvhi yigi, vtla yidogvquatlvwisi agiyohuhisdiyi; iyusgini nudohiyusvna yigi hia nasgi tsigvquehisdiha, vtla gilo yeli digvwaniyohisedi yigi ayv. Sisoi witsivsda.&#10;For if I be an offender, or have committed any thing worthy of death, I refuse not to die: but if there be none of these things whereof these accuse me, no man may deliver me unto them. I appeal unto Caesar. [CNT]" />
