    <title>ᎾᏍᎩᏃ ᏅᏩᎾᏓᎴ ᏴᏫ ᎤᏂᎪᎲ ᎢᎾᏛ ᎦᏖᎳᏛ ᎤᏬᏰᏂ, ᎯᎠ ᏂᏚᎾᏓᏪᏎᎸᎩ; ᎥᏝ ᏳᏝᏏᏛᎭ ᎯᎠ ᎠᏍᎦᏯ ᏴᏫ ᏗᎯᎯ ᎨᏒᎢ; ᎤᏙᎯᏳᎯᏍᎩᏂᏃᏅ ᎾᏍᎩ ᎠᎺᏉᎯ ᎠᏗᏫᏏ, ᎠᏎᏃ ᎤᏞᎩ ᎥᏝ ᎬᏁᏍᏗ ᏳᏪᎵᏎᎭ.</title>
    <meta name="description" content="Nasgino nvwanadale yvwi unigohv inadv gateladv uwoyeni, hia nidunadaweselvgi; vtla yutlasidvha hia asgaya yvwi dihihi gesvi; udohiyuhisgininonv nasgi amequohi adiwisi, aseno utlegi vtla gvnesdi yuweliseha.&#10;And when the barbarians saw the venomous beast hang on his hand, they said among themselves, No doubt this man is a murderer, whom, though he hath escaped the sea, yet vengeance suffereth not to live. [CNT]" />
