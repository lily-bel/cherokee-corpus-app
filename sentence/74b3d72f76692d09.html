    <title>ᎠᎴ ᎢᎬᏱ ᏓᏳᏪᏅᎡᎵ ᎢᎳᏯ ᎾᏍᎩᏯ ᎨᏎᏍᏗ ᎤᏓᏅᏙᎩ ᎠᎴ ᎤᎵᏂᎩᏗᏳ ᎨᏒᎢ, ᏧᎦᏔᎲᏍᏗᏱ ᏧᏂᎾᏫ ᎠᏂᎦᏴᎵᎨᎢ ᏗᏂᏲᎵ ᎢᏗᏢ ᏫᏚᎦᏔᎲᏍᏙᏗᏱ, ᎠᎴ ᏄᏃᎯᏳᏒᎾ ᏧᎦᏔᎲᏍᏗᏱ ᎤᎾᏓᏅᏘ ᎠᏂᎦᏔᎿᎭᎥ ᎢᏗᏢ ᏫᏚᎦᏔᎲᏍᏙᏗᏱ; ᏧᏛᏅᎢᏍᏙᏗᏱ ᏴᏫ, ᎤᎬᏫᏳᎯ ᏧᏛᏅᎢᏍᏓᏁᏗᏱ.</title>
    <meta name="description" content="Ale igvyi dayuwenveli [Ugvwiyuhi] Ilaya nasgiya gesesdi udanvdogi ale ulinigidiyu gesvi, tsugatahvsdiyi tsuninawi anigayvligei diniyoli iditlv widugatahvsdodiyi, ale nunohiyusvna tsugatahvsdiyi unadanvti anigatahnav iditlv widugatahvsdodiyi; tsudvnvisdodiyi yvwi, Ugvwiyuhi tsudvnvisdanediyi.&#10;And he shall go before him in the spirit and power of Elias, to turn the hearts of the fathers to the children, and the disobedient to the wisdom of the just; to make ready a people prepared for the Lord. [CNT]" />
