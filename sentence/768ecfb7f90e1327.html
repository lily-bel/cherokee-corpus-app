    <title>ᎢᏨᏲᏎᎭ ᎬᏩᏗᏛᏗ ᏂᎨᏒᎾ ᎠᎴ ᏗᎬᏩᏁᏗ ᏂᎨᏒᎾ ᏱᎩ, ᎤᎾᎵᎢᏉ ᎨᏒ ᎢᏳᏍᏗ, ᎾᏑᎵᎪᎬᎾᏍᎩᏂ ᎨᏒ ᎢᏳᏍᏗ ᏯᏗᏛ ᎠᎴ ᏱᏕᎠᎲᏏ ᏂᎦᎥ ᏚᏚᎵᏍᎬᎢ. (Itsvyoseha gvwadidvdi nigesvna ale digvwanedi nigesvna yigi, unaliiquo gesv iyusdi, nasuligogvnasgini gesv iyusdi yadidv ale yideahvsi nigav dudulisgvi.) — Cherokee Corpus</title>
