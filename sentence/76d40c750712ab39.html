    <title>ᏫᏕᏓᎦᏂᏍᎨᏍᏗ ᏥᏌ ᎾᏍᎩ ᎢᏳᏩᏂᏌᏛ, ᎠᎴ ᎠᏍᏆᏗᏍᎩ ᏥᎩ ᎢᎪᎯᏳᏒᎢ.  ᎾᏍᎩ ᎤᎵᎮᎵᏍᏗ ᎨᏒ ᎢᎬᏱᏗᏢ ᎾᎬᏁᎸ ᎢᏳᏍᏗ ᎬᏂᏗᏳ ᏓᏓᎿᎭᏩᏍᏛ ᎤᎩᎵᏲᏤᎢ, ᎤᎵᏌᎵᏉ ᎤᏰᎸᏎ ᎤᏕᎰᎯᏍᏗ ᎨᏒᎢ, ᎠᎴ ᎠᎦᏘᏏᏗᏢ ᎤᏪᏅ ᎤᏁᎳᏅᎯ ᎤᏪᏍᎩᎸᎢ. (Widedaganisgesdi Tsisa nasgi iyuwanisadv, ale asquadisgi tsigi igohiyusvi.  Nasgi ulihelisdi gesv igvyiditlv nagvnelv iyusdi gvnidiyu dadahnawasdv ugiliyotsei, ulisaliquo uyelvse udehohisdi gesvi, ale agatisiditlv uwenv Unelanvhi uwesgilvi.) — Cherokee Corpus</title>
