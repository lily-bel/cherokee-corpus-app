    <title>ᎢᏳᏍᎩᏂᏃᏅ ᏄᏬᎯᏳᏒᎾ ᏳᏓᏅᏒ, ᎤᏁᎳᎩ ᎠᏓᏅᏍᎨᏍᏗ.  ᎩᎶ ᎢᎩᏅᏟ ᎠᎴ ᎢᎩᏙ, ᎥᏝ ᏳᏚᏓᎶ ᎾᏍᎩ ᏥᏄᏍᏙᎢ.  ᎤᏁᎳᏅᎯᏍᎩᏂ ᏅᏩᏙᎯᏯᏛ ᎢᎦᏕᏗᏱ ᎢᎩᏯᏅᎲ. (Iyusgininonv nuwohiyusvna yudanvsv, unelagi adanvsgesdi.  Gilo iginvtli ale igido, vtla yududalo nasgi tsinusdoi.  Unelanvhisgini nvwadohiyadv igadediyi igiyanvhv.) — Cherokee Corpus</title>
