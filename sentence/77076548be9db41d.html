    <title>ᏥᎪᏃ ᎾᏍᎩ Ꮎ ᎣᏍᏛ ᎨᏒ ᎠᎩᎯᎯᏉ ᏄᎵᏍᏔᏁᎢ?  ᎬᏩᏟᏍᏗ.  ᎠᏍᎦᏂᏍᎩᏂ, ᎾᏍᎩ ᎬᏂᎨᏒ ᎢᏳᎵᏍᏙᏗᏱ ᎾᏍᎩ ᏄᏍᏛ ᎠᏍᎦᏂ, ᏚᎸᏫᏍᏓᏁᎲᎩ ᎠᎩᎯᏍᏗᏱ ᎬᏗᏍᎬᎩ ᎾᏍᎩ Ꮎ ᎣᏍᏛ ᎨᏒᎢ; ᎾᏍᎩ ᎠᏍᎦᏂ ᎤᎵᏁᏨ ᎢᏳᏩᏂᏌᏛ ᎤᏣᏘ ᎠᏍᎦᎾᎯᏳ ᎢᏳᎵᏍᏙᏗᏱ. (Tsigono nasgi na osdv gesv agihihiquo nulistanei?  gvwatlisdi.  Asganisgini, nasgi gvnigesv iyulisdodiyi nasgi nusdv asgani, dulvwisdanehvgi agihisdiyi gvdisgvgi nasgi na osdv gesvi; nasgi asgani ulinetsv iyuwanisadv utsati asganahiyu iyulisdodiyi.) — Cherokee Corpus</title>
    <meta name="description" content="Was then that which is good made death unto me? God forbid. But sin, that it might appear sin, working death in me by that which is good; that sin by the commandment might become exceeding sinful." />
