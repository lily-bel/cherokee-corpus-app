    <title>ᏚᎾᏓᎴᎿᎭᎠ ᎾᏍᏉ ᎠᏥᏰᎯ ᎠᎨᏴ ᎠᏃ ᎾᏥᏰᎲᎾ.  ᎾᏥᏰᎲᎾ ᎠᎨᏴ ᎠᏓᏅᏖᏍᎪ ᏧᏓᎴᏅᏛ ᎤᎬᏫᏳᎯ ᎤᏤᎵᎦ, ᎾᏍᎩ ᎾᏍᎦᏅᎾ ᎢᏳᎵᏍᏙᏗᏱ ᎠᏰᎵ ᎨᏒ ᎠᎴ ᎤᏓᏅᏙᎩᎯ ᎨᏒᎢ; Ꮎ-ᏍᎩᏂ ᎠᏥᏰᎯ ᎠᏓᏅᏖᏍᎪ ᏧᏓᎴᏅᏛ ᎡᎶᎯ ᎡᎯ, ᎢᏳᏛᏁᏗᏱ ᎤᏰᎯ ᎣᏍᏛ ᎤᏰᎸᏗ ᏧᎸᏫᏍᏓᏁᏗᏱ. (Dunadalehnaa nasquo atsiyehi ageyv ano natsiyehvna.  Natsiyehvna ageyv adanvtesgo tsudalenvdv Ugvwiyuhi utseliga, nasgi nasganvna iyulisdodiyi ayeli gesv ale udanvdogihi gesvi; nasgini atsiyehi adanvtesgo tsudalenvdv elohi ehi, iyudvnediyi uyehi osdv uyelvdi tsulvwisdanediyi.) — Cherokee Corpus</title>
    <meta name="description" content="There is difference also between a wife and a virgin. The unmarried woman careth for the things of the Lord, that she may be holy both in body and in spirit: but she that is married careth for the things of the world, how she may please her husband." />
