    <title>ᏥᎦᏔᎭ, ᎠᎴ ᎠᏉᎯᏳᏗ ᎾᏋᏁᎸ ᎤᎬᏫᏳᎯ ᏥᏌ, ᎾᏍᎩ ᎪᎱᏍᏗ ᎤᏩᏒᏉ ᎨᏒ ᎦᏓᎭ ᏂᎨᏒᎾ ᎨᏒᎢ; ᎩᎶᏍᎩᏂ ᎪᎱᏍᏗ ᎦᏓᎭ ᎠᏰᎸᏍᎩ, ᎾᏍᎩ ᎦᏓᎭ ᏄᎵᏍᏓᏁᎰᎢ. (Tsigataha, ale aquohiyudi naquvnelv Ugvwiyuhi Tsisa, nasgi gohusdi uwasvquo gesv gadaha nigesvna gesvi; gilosgini gohusdi gadaha ayelvsgi, nasgi gadaha nulisdanehoi.) — Cherokee Corpus</title>
