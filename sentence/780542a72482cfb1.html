    <title>ᎾᏂᎥᏰᏃ ᏗᎧᎿᎭᏩᏛᏍᏗ ᏂᎦᏪᏍᎬ ᎢᏯᏛᏁᏗᏱ ᎠᎾᎵᏍᎦᏍᏙᏗᏍᎩ, ᎾᏍᎩ ᎨᏥᏍᎦᏨᎯ; ᎯᎠᏰᏃ ᏂᎬᏅ ᎢᎬᏪᎳ, ᎨᏥᏍᎦᏨᎯ ᎨᏎᏍᏗ ᎾᏂᎥ ᎩᎶ ᏂᏓᏂᎧᎿᎭᏩᏕᎬᎾ ᎢᎨᏎᏍᏗ ᎾᎾᏛᏁᎲ ᏂᎦᏛ ᏧᏓᎴᏅᏛ ᏗᎧᎿᎭᏩᏛᏍᏗᏱ ᎪᏪᎸᎢ. (Nanivyeno dikahnawadvsdi nigawesgv iyadvnediyi analisgasdodisgi, nasgi getsisgatsvhi; hiayeno nigvnv igvwela, Getsisgatsvhi gesesdi naniv gilo nidanikahnawadegvna igesesdi nanadvnehv nigadv tsudalenvdv dikahnawadvsdiyi gowelvi.) — Cherokee Corpus</title>
    <meta name="description" content="For as many as are of the works of the law are under the curse: for it is written, Cursed is every one that continueth not in all things which are written in the book of the law to do them." />
