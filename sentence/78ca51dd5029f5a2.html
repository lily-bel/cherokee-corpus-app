    <title>ᎠᏁᎭᏰᏃ ᎠᏂᎾᎵ ᏅᏩᎾᏍᏙ ᏧᏂᏥ ᎬᏩᏂᎾᏄᎪᏫᏒ, ᎠᎴ ᎠᏁᎭ ᎠᏂᎾᎵ ᏴᏫ ᎬᏩᏂᎾᎵᏛᎯ, ᎠᎴ ᎠᏁᎭ ᎠᏂᎾᎵ ᎤᏅᏒ ᎤᎾᏓᎾᎵᏛᎯ ᎦᎸᎳᏗ ᎡᎯ ᎤᎬᏫᏳᎯ ᎨᏒ ᏗᎵᏰᎢᎸᏍᏗᏍᎬᎢ. ᎩᎶ ᏗᎬᏩᏓᏂᎸᎢᏍᏗ ᎨᏎᏍᏗ ᎾᏍᎩ ᏓᏓᏂᎸᎨᏍᏗ.</title>
    <meta name="description" content="Anehayeno aninali nvwanasdo tsunitsi gvwaninanugowisv, ale aneha aninali yvwi gvwaninalidvhi, ale aneha aninali unvsv unadanalidvhi galvladi ehi ugvwiyuhi gesv diliyeilvsdisgvi. Gilo digvwadanilvisdi gesesdi nasgi dadanilvgesdi.&#10;For there are some eunuchs, which were so born from their mother&#39;s womb: and there are some eunuchs, which were made eunuchs of men: and there be eunuchs, which have made themselves eunuchs for the kingdom of heaven&#39;s sake. He that is able to receive it, let him receive it. [CNT]" />
