    <title>ᎥᏝ ᎾᏍᎩᏯ ᎧᏃᎮᏛ ᏕᎦᏥᏯᏠᎢᏍᏓᏁᎸ ᏧᏂᎦᏴᎵᎨᎢ, ᎾᎯᏳ ᎦᏂᏲᏯᏁᏒ ᎦᏥᏄᎪᏫᏍᏗᏱ ᎢᏥᏈᏱ ᎦᏓ ᎠᎲᎢ; ᎥᏝᏰᏃ ᏳᏂᏍᏆᏂᎪᏔᏁ ᎧᏃᎮᏛ ᏕᎦᏥᏯᏠᎢᏍᏓᏁᎸᎢ, ᎠᎴ ᎠᏴ ᎥᏝ ᏱᎦᏥᏯᎦᏌᏯᏍᏔᏁᎢ, ᎠᏗᎭ ᎤᎬᏫᏳᎯ.</title>
    <meta name="description" content="Vtla nasgiya kanohedv degatsiyatloisdanelv tsunigayvligei, nahiyu ganiyoyanesv gatsinugowisdiyi Itsiquiyi gada ahvi; vtlayeno yunisquanigotane kanohedv degatsiyatloisdanelvi, ale ayv vtla yigatsiyagasayastanei, adiha Ugvwiyuhi.&#10;Not according to the covenant that I made with their fathers in the day when I took them by the hand to lead them out of the land of Egypt; because they continued not in my covenant, and I regarded them not, saith the Lord. [CNT]" />
