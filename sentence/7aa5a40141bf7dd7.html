    <title>ᎾᎯᏳ ᏥᏌ ᎤᎵᎮᎵᏤ ᎤᏓᏅᏙᎩᎯ, ᎯᎠ ᏄᏪᏎᎢ, ᎬᏯᎵᎡᎵᏤᎭ ᎡᏙᏓ ᏣᎬᏫᏳᎯ ᎦᎸᎳᏗ ᎠᎴ ᎡᎶᎯ, ᎾᏍᎩ ᎯᎠ ᏥᏕᎲᏍᎦᎳᏁᎸ ᎠᏂᏏᎾᏌᏂ ᎠᎴ ᎠᏁᏯᏔᎯ, ᏗᏂᏲᎵᏃ ᏥᏕᎯᎾᏄᎪᏫᏎᎸ; ᎥᎥ, ᎡᏙᏓ; ᎾᏍᎩᏰᏃ ᎣᏏᏳ ᏣᏰᎸᏅᎯ.</title>
    <meta name="description" content="Nahiyu Tsisa ulihelitse udanvdogihi, hia nuwesei, gvyalielitseha Edoda Tsagvwiyuhi galvladi ale elohi, nasgi hia tsidehvsgalanelv anisinasani ale aneyatahi, diniyolino tsidehinanugowiselv; vv, Edoda; nasgiyeno osiyu tsayelvnvhi.&#10;In that hour Jesus rejoiced in spirit, and said, I thank thee, O Father, Lord of heaven and earth, that thou hast hid these things from the wise and prudent, and hast revealed them unto babes: even so, Father; for so it seemed good in thy sight. [CNT]" />
