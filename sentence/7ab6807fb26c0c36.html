    <title>ᎠᏴ ᏥᏧᏏ ᏏᎵᏏᏱ ᎠᏆᏕᏅᎯ ᏓᏌ ᎦᏚᎲᎢ, ᎠᏎᏃ ᎠᏂ ᎦᏚᎲ ᎠᏆᏛᏒᎯ, ᎨᎺᎵ ᏚᎳᏍᎬᎢ ᎥᏇᏲᏅᎯ ᏭᏂᎫᏛ ᏗᎧᎿᎭᏩᏛᏍᏗ ᎨᏒ ᏗᎩᎦᏴᎵᎨ ᎨᎩᏁᎸᎯ, ᎤᎵᏂᎩᏗᏳᏃ ᎠᏆᏓᏅᏛᎩ ᏕᏥᎦᎿᎭᏩᏗᏒ ᎤᏁᎳᏅᎯ ᎾᏍᎩᏯ ᏂᏥᎥ ᏂᎯ ᏥᏄᏍᏗ ᏥᏣᏓᏅᏔ ᎪᎯ ᎢᎦ ᏥᎩ. (Ayv Tsitsusi Silisiyi aquadenvhi Dasa gaduhvi, aseno ani gaduhv aquadvsvhi, Gemeli dulasgvi vqueyonvhi wunigudv dikahnawadvsdi gesv digigayvlige geginelvhi, ulinigidiyuno aquadanvdvgi detsigahnawadisv Unelanvhi nasgiya nitsiv nihi tsinusdi tsitsadanvta gohi iga tsigi.) — Cherokee Corpus</title>
