    <title>ᎾᏍᎩᏃ ᎤᎶᏒᏍᏔᏅᎯ ᎠᏆᎵᏌᎳᏙᏗᏱ ᏂᎨᏒᎾ ᎢᏳᎵᏍᏙᏗᏱ ᏅᏗᎦᎵᏍᏙᏗᏍᎬ ᎤᏣᏘ ᎥᎩᎾᏄᎪᏫᏎᎸᎩ, ᎠᎩᏣᏲᎯᎯ ᎥᎩᏁᎸᎩ ᎠᎩᏇᏓᎸᎢ, ᏎᏓᏂ ᎤᏅᏏᏛ ᎠᏋᏂᎯ, ᎾᏍᎩ ᎤᎶᏒᏍᏔᏅᎯ ᎠᏆᎵᏌᎳᏙᏗᏱ ᏂᎨᏒᎾ ᎢᏳᎵᏍᏙᏗᏱ. (Nasgino ulosvstanvhi aqualisaladodiyi nigesvna iyulisdodiyi nvdigalisdodisgv utsati vginanugowiselvgi, agitsayohihi vginelvgi agiquedalvi, Sedani unvsidv aquvnihi, nasgi ulosvstanvhi aqualisaladodiyi nigesvna iyulisdodiyi.) — Cherokee Corpus</title>
