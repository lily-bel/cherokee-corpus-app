    <title>ᎠᏴ ᏣᏂ, ᎢᏓᎵᏅᏟ ᎾᏍᏉ ᏥᎩ, ᎠᎴ ᎢᎦᎵᎪ ᏩᏕᎩ ᎢᏗᎩᎵᏲᏥᏙᎲᎢ, ᎠᎴ ᏥᏌ ᎦᎶᏁᏛ ᎤᏤᎵᎪᎯ ᎢᏖᎸᎢ, ᎠᎴ ᎬᏂᏗᏳ ᎨᏒ ᎾᏍᎩ ᎤᏤᎵᎦ, ᎠᏴ ᎨᏙᎲᎩ ᎠᎹᏰᎵ ᏆᏗᎹ ᏥᏚᏙᎥ, ᎧᏃᎮᏛ ᎤᏁᎳᏅᎯ ᎤᏤᎵᎦ ᎠᎩᏍᏛᏗᏍᎬᎩ, ᎠᎴ ᏥᏌ ᎦᎶᏁᏛ ᏥᏃᎮᏍᎬ ᎢᏳᏍᏗ.</title>
    <meta name="description" content="Ayv Tsani, idalinvtli nasquo tsigi, ale igaligo wadegi idigiliyotsidohvi, ale Tsisa Galonedv utseligohi itelvi, ale gvnidiyu gesv nasgi utseliga, ayv gedohvgi amayeli Quadima tsidudov, kanohedv Unelanvhi utseliga agisdvdisgvgi, ale Tsisa Galonedv tsinohesgv iyusdi.&#10;I John, who also am your brother, and companion in tribulation, and in the kingdom and patience of Jesus Christ, was in the isle that is called Patmos, for the word of God, and for the testimony of Jesus Christ. [CNT]" />
