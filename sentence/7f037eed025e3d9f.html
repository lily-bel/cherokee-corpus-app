    <title>ᎢᏤᏯᏔᎮᏍᏗ ᏞᏍᏗᏉ ᎡᏥᏲᎢᏎᎸᎩ ᎾᏍᎩ Ꮎ ᏥᎧᏁᎦ.  ᎢᏳᏰᏃ ᏄᎾᏓᏗᏫᏎᎸᎾ ᏱᎩ ᎾᏍᎩ Ꮎ ᎤᏂᏲᎢᏎᏛ ᎡᎶᎯ ᎤᏁᏨᎯ, ᎤᏟᎯᏳ ᎬᏩᏟᏍᏗ ᎢᎦᏓᏗᏫᏎᏗᏱ ᎢᏳᏃ ᎢᏴᏛ ᏱᏁᏓᏛᏁᎸ ᎦᎸᎳᏗ ᏨᏗᎧᏁᎦ; (Itseyatahesdi tlesdiquo etsiyoiselvgi nasgi na tsikanega.  Iyuyeno nunadadiwiselvna yigi nasgi na uniyoisedv elohi unetsvhi, utlihiyu gvwatlisdi igadadiwisediyi iyuno iyvdv yinedadvnelv galvladi tsvdikanega;) — Cherokee Corpus</title>
