    <title>ᏇᏍᏓᏃ ᎯᎠ ᏄᏪᏒᎩ; ᏣᎬᏫᏳᎯ ᎡᎩᎵᏈ, ᎠᎴ ᎾᏍᏉ ᏂᎦᏛ ᎢᏥᏍᎦᏯ ᎠᏂ ᏥᏗᎾ; ᎡᏥᎪᏩᏗᎭ ᎯᎠ ᎠᏍᎦᏯ, ᎾᏍᎩ; ᎠᏄᎯᏍᏗᏍᎬ ᏂᎦᏛ ᎤᏂᏣᏘ ᎠᏂᏧᏏ ᏥᎬᎩᎷᏤᎸᎩ ᏥᎷᏏᎵᎻ, ᎠᎴ ᎾᏍᏉ ᎠᏂ, ᎯᎠ ᏥᎾᏂᏪᏍᎬᎩ; ᎥᏝ ᎣᏏᏳ ᏱᎦᎩ ᎠᏏᏉ ᏱᎬᏅ.</title>
    <meta name="description" content="Quesdano hia nuwesvgi; tsagvwiyuhi Egiliqui, ale nasquo nigadv itsisgaya ani tsidina; etsigowadiha hia asgaya, nasgi; anuhisdisgv nigadv unitsati Anitsusi tsigvgilutselvgi Tsilusilimi, ale nasquo ani, hia tsinaniwesgvgi; vtla osiyu yigagi asiquo yigvnv.&#10;And Festus said, King Agrippa, and all men which are here present with us, ye see this man, about whom all the multitude of the Jews have dealt with me, both at Jerusalem, and also here, crying that he ought not to live any longer. [CNT]" />
