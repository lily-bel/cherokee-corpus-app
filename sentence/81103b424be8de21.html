    <title>ᎿᎭᏉᏃ ᏨᏆᏓᏁᎳᏁᎸ ᎠᎵᏍᏚᎶ ᏚᏳᎪᏛ ᎢᏳᎾᏛᏁᎸᎯ ᎨᎦᎫᏴᏓᏁᏗ, ᎾᏍᎩ ᎤᎬᏫᏳᎯ ᎾᏍᎦᏅᎾ ᏗᎫᎪᏗᏍᎩ ᎠᏗᏅᏁᏗ ᎾᎯᏳ ᎢᎦ, ᎥᏝ ᎠᎴ ᎠᏴᏉ ᎠᏋᏒ, ᎾᏍᏉᏍᎩᏂ ᎾᏂᎥ ᎤᎾᏄᎪᎢᏍᏗ ᎨᏒ ᎣᏏᏳ ᎣᏂᏰᎸᎯ. (Hnaquono tsvquadanelanelv alisdulo duyugodv iyunadvnelvhi gegaguyvdanedi, nasgi Ugvwiyuhi nasganvna digugodisgi adinvnedi nahiyu iga, vtla ale ayvquo aquvsv, nasquosgini naniv unanugoisdi gesv osiyu oniyelvhi.) — Cherokee Corpus</title>
