    <title>ᎤᏁᎳᏅᎯᏰᏃ ᎠᎦᏴᎵᎨ ᎤᎵᏍᎪᎸᏓᏁᎸᎩ ᎦᎸᏉᏗᏳ ᎨᏒ ᎠᎴ ᎢᎦᏚᎸᏌᏛᎢ, ᎾᎯᏳ ᎧᏁᎬ ᏧᎷᏤᎸ ᎤᏣᏘ ᎦᎸᏉᏗᏳ ᎢᎦ-ᏚᎸᏌᏛ ᏅᏓᏳᏓᎴᎤᎯ, [ᎯᎠ ᏥᏂᎦᏪᏍᎬᎩ,] ᎯᎠ ᏥᎨᏳᎢ ᎠᏇᏥ, ᎾᏍᎩ ᎣᏏᏳ ᏥᏰᎸᎢ ᏥᎩ.</title>
    <meta name="description" content="Unelanvhiyeno Agayvlige ulisgolvdanelvgi galvquodiyu gesv ale igadulvsadvi, nahiyu kanegv tsulutselv utsati galvquodiyu igadulvsadv nvdayudaleuhi, [hia tsinigawesgvgi,] Hia tsigeyui Aquetsi, nasgi osiyu tsiyelvi tsigi.&#10;For he received from God the Father honour and glory, when there came such a voice to him from the excellent glory, This is my beloved Son, in whom I am well pleased. [CNT]" />
