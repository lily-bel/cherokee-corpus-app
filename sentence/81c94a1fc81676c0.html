    <title>ᎠᎴ ᎩᎶ ᎠᏏᏴᏫ ᎯᎠ ᏧᎾᏍᏗ ᎨᏒ ᎾᏍᎩ ᏥᎬᏉᎯᏳᎲᏍᎦ ᏙᎪᏕᏍᏗᏍᎨᏍᏗ, ᎤᏟ ᎣᏏᏳ ᎢᏳᎵᏍᏓᏁᏗ ᎠᏍᏙᏍᎩ ᏅᏯ ᏯᏥᏯᏝᏅ, ᎠᎴ ᎠᎺᏉᎯ ᏱᏩᎦᏓᎢᏅ. (Ale gilo asiyvwi hia tsunasdi gesv nasgi tsigvquohiyuhvsga dogodesdisgesdi, utli osiyu iyulisdanedi asdosgi nvya yatsiyatlanv, ale amequohi yiwagadainv.) — Cherokee Corpus</title>
