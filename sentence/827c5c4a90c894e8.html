    <title>ᎠᎴ ᎾᏍᎩ Ꮀ ᎤᎬᏫᏳᎭ ᎤᏇᏓᎵ ᎠᏂᏍᏓᏩᏕᎩ ᎤᏂᎬᎥᏍᎬ ᎦᏓᎭ ᎨᏒᎢ, ᎠᎴ ᏗᏂᏍᎦᎩ ᏄᏂᎬᏫᏳᏌᏕᎩ. ᎤᏂᏍᎦᎢᏍᏗ, ᎤᏅᏒ ᎠᎾᏓᏅᏖᏍᎬ ᎤᏂᎸᏉᏗ; ᎥᏝ ᏯᏂᏍᎦᎢᎭ ᏗᎬᏩᏂᏐᏢᏙᏗᏱ ᎨᏥᎸᏉᏗ.</title>
    <meta name="description" content="Ale nasgi ho ugvwiyuha [genigiliyoisdodi gesesdi] uquedali anisdawadegi unigvvsgv gadaha gesvi, ale dinisgagi nunigvwiyusadegi. Unisgaisdi, unvsv anadanvtesgv unilvquodi; vtla yanisgaiha digvwanisotlvdodiyi getsilvquodi.&#10;But chiefly them that walk after the flesh in the lust of uncleanness, and despise government. Presumptuous are they, selfwilled, they are not afraid to speak evil of dignities. [CNT]" />
