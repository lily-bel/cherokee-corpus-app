    <title>ᎢᏳᏃ ᎬᏩᎦᏘᏯ ᎤᏓᏙᎵᏍᏗ ᎨᏒ ᎢᏳᏩᏂᏌᏅᎯ ᏱᎩ; ᎿᎭᏉ ᎥᏝ ᏗᎦᎸᏫᏍᏓᏁᏗ ᎨᏒ ᎢᏳᏩᏂᏌᏅᎯ ᏱᎩ; ᎢᏳᏃ ᎾᏍᎩ ᏱᏄᏍᏗ, ᎬᏩᎦᏘᏯ ᎤᏓᏙᎵᏍᏗ ᎨᏒ ᎥᏝ ᎿᎭᏉ ᎬᏩᎦᏘᏯ ᎤᏓᏙᎵᏍᏗ ᎨᏒ ᏱᎦᎩ. ᎢᏳᏍᎩᏂ ᏗᎦᎸᏫᏍᏓᏁᏗ ᎨᏒ ᎢᏳᏩᏂᏌᏅᎯ ᏱᎩ, ᎿᎭᏉ ᎥᏝ ᎬᏩᎦᏘᏯ ᎤᏓᏙᎵᏍᏗ ᎨᏒ ᎢᏳᏩᏂᏌᏅᎯ ᏱᎩ; ᎢᏳᏃ ᎾᏍᎩ ᏱᏄᏍᏗ, ᏗᎦᎸᏫᏍᏓᏁᏗ ᎨᏒ ᎥᏝ ᎿᎭᏉ ᏗᎦᎸᏫᏍᏓᏁᏗ ᎨᏒ ᏱᎦᎩ.</title>
    <meta name="description" content="Iyuno gvwagatiya udadolisdi gesv iyuwanisanvhi yigi; hnaquo vtla digalvwisdanedi gesv iyuwanisanvhi yigi; iyuno nasgi yinusdi, gvwagatiya udadolisdi gesv vtla hnaquo gvwagatiya udadolisdi gesv yigagi. Iyusgini digalvwisdanedi gesv iyuwanisanvhi yigi, hnaquo vtla gvwagatiya udadolisdi gesv iyuwanisanvhi yigi; iyuno nasgi yinusdi, digalvwisdanedi gesv vtla hnaquo digalvwisdanedi gesv yigagi.&#10;And if by grace, then is it no more of works: otherwise grace is no more grace. But if it be of works, then is it no more grace: otherwise work is no more work. [CNT]" />
