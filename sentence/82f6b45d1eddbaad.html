    <title>ᎠᎴ ᎦᏃᏙᏗᏱ ᏛᏂᎶᎯ, ᎢᏳᏃ ᏂᏚᎾᏑᎴᎲᎾ ᏱᎩ, ᎥᏝ ᏴᎬᎾᎵᏍᏓᏴᎲᎦ.  ᎠᎴ ᎤᏣᏔ ᏄᏓᎴ ᎪᎱᏍᏗ ᏧᏂᎧᎿᎭᏩᏛᏍᏗ ᏄᏅᏁᎸ, ᎾᏍᎩ ᏧᎵᏍᏈᏗ ᏗᎫᎯᎶᎥᎢ ᎠᎴ ᏗᏖᎵᏙ, ᎠᎴ ᎥᏣᏱᏗᎪᏢᏔᏅᎯ ᏗᏖᎵᏙ, ᎠᎴ ᏗᏂᏢᏗᏱ. (Ale ganododiyi dvnilohi, iyuno nidunasulehvna yigi, vtla yvgvnalisdayvhvga.  Ale utsata nudale gohusdi tsunikahnawadvsdi nunvnelv, nasgi tsulisquidi diguhilovi ale ditelido, ale vtsayidigotlvtanvhi ditelido, ale dinitlvdiyi.) — Cherokee Corpus</title>
    <meta name="description" content="And when they come from the market, except they wash, they eat not. And many other things there be, which they have received to hold, as the washing of cups, and pots, brasen vessels, and of tables." />
