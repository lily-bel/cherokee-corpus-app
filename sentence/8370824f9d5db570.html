    <title>ᎠᏰᎸᎢᏰᏃ ᎤᎬᏩᎵ ᏗᎦᎸᏫᏍᏓᏁᏗ ᎨᏒ ᎤᏍᏗᎩᏳ ᎠᏓᏍᏕᎵᎭ; ᎤᏁᎳᏅᎯᏍᎩᏂ ᏗᏁᎶᏙᏗ ᎨᏒ ᏂᎦᎥ ᎪᎱᏍᏗ ᎤᎬᏩᎵ ᎬᏩᏓᏍᏕᎸᏗ, ᎾᏍᎩᏰᏃ ᎠᏚᎢᏍᏗ ᎠᏥᏁᏗᏱ ᎬᏅ ᎪᎯ ᏥᎩ, ᎠᎴ ᎾᏍᎩ ᎤᎵᏱᎶᎯᏍᏗ ᎨᏒᎢ.</title>
    <meta name="description" content="Ayelviyeno ugvwali digalvwisdanedi gesv usdigiyu adasdeliha; Unelanvhisgini dinelododi gesv nigav gohusdi ugvwali gvwadasdelvdi, nasgiyeno aduisdi atsinediyi gvnv gohi tsigi, ale nasgi uliyilohisdi gesvi.&#10;For bodily exercise profiteth little: but godliness is profitable unto all things, having promise of the life that now is, and of that which is to come. [CNT]" />
