    <title>ᎾᏍᎩ ᎢᏳᏍᏗ ᎢᏣᏓᎦᏌᏯᏍᏕᏍᏗ ᎢᏨᏒ, ᎠᎴ ᏕᏥᎦᏌᏯᏍᏕᏍᏗ ᏂᎦᏛ ᏑᎾᏓᏡᎩ ᎨᏒᎢ, ᎾᏍᎩ ᏗᏥᎦᏘᏯ ᎢᏨᏁᎸᎯ ᏥᎩ ᎦᎸᏉᏗᏳ ᎠᏓᏅᏙ, ᏗᏤᎳᏍᏗᏱ ᏧᎾᏁᎶᏗ ᎤᎾᏓᏡᎬ ᎤᏁᎳᏅᎯ ᏧᏤᎵᎦ, ᎾᏍᎩ ᎤᏩᏒ ᎤᎩᎬ ᏧᎫᏴᏔᏅᎯ ᏥᎩ. (Nasgi iyusdi itsadagasayasdesdi itsvsv, ale detsigasayasdesdi nigadv sunadatlugi gesvi, nasgi ditsigatiya itsvnelvhi tsigi Galvquodiyu Adanvdo, ditselasdiyi tsunanelodi unadatlugv Unelanvhi tsutseliga, nasgi uwasv ugigv tsuguyvtanvhi tsigi.) — Cherokee Corpus</title>
    <meta name="description" content="Take heed therefore unto yourselves, and to all the flock, over the which the Holy Ghost hath made you overseers, to feed the church of God, which he hath purchased with his own blood." />
