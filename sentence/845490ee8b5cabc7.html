    <title>ᎾᏍᎩᏯᏃ ᎲᏂᏗᏳ ᎨᏒ ᏥᏣᏍᏆᏂᎪᏔᏅ ᎠᏆᏤᎵ ᎧᏃᎮᏛ, ᎾᏍᎩ ᎢᏳᏍᏗ ᎾᏍᏉ ᎠᏴ ᏓᎬᏍᏆᏂᎪᏔᏂ ᏓᎬᏳᏓᎴᏏ ᎾᎯᏳ ᎤᏓᎪᎵᏰᏗ ᎨᏒ ᎠᏍᏆᎸᎲᎭ, ᎡᎳᏂᎬ ᎤᏂᎷᏤᏗ ᏥᎩ, ᎤᏂᎪᎵᏰᏗᏱ ᎾᏍᎩ Ꮎ ᎡᎶᎯ ᏣᏁᎭ. (Nasgiyano hvnidiyu gesv tsitsasquanigotanv aquatseli kanohedv, nasgi iyusdi nasquo ayv dagvsquanigotani dagvyudalesi nahiyu udagoliyedi gesv asqualvhvha, elanigv unilutsedi tsigi, unigoliyediyi nasgi na elohi tsaneha.) — Cherokee Corpus</title>
