    <title>ᏌᏗᏏᏃ ᎤᎾᏓᏡᎬ ᏧᎾᏁᎶᏗ ᏗᎧᎿᎭᏩᏗᏙᎯ ᏫᏲᏪᎳᏏ, ᎯᎠ ᎾᏍᎩ ᏫᏂᏪᏏ ᎠᏗᎭ ᎾᏍᎩ Ꮎ ᎦᎵᏉᎩ ᏗᏓᏅᏙ ᎤᏁᎳᏅᎯ ᏧᏤᎵ ᏧᏪᎯ ᏥᎩ, ᎠᎴ ᎦᎵᏉᎩ ᏃᏈᏏ ᏧᏪᎯ ᏥᎩ; ᏥᎦᏔᎭ ᏄᏍᏛ ᏕᏣᎸᏫᏍᏓᏁᎲᎢ, ᎬᏃᏛ ᏥᎨᏦᏎᎭ, ᎠᏎᏃ ᏣᏲᎱᏒᎯᏉ ᏥᎩ.</title>
    <meta name="description" content="Sadisino unadatlugv tsunanelodi dikahnawadidohi wiyowelasi, hia nasgi winiwesi adiha nasgi na galiquogi Didanvdo unelanvhi tsutseli tsuwehi tsigi, ale galiquogi noquisi tsuwehi tsigi; tsigataha nusdv detsalvwisdanehvi, gvnodv tsigetsoseha, aseno tsayohusvhiquo tsigi.&#10;And unto the angel of the church in Sardis write; These things saith he that hath the seven Spirits of God, and the seven stars; I know thy works, that thou hast a name that thou livest, and art dead. [CNT]" />
