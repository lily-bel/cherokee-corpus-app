    <title>ᏄᎬᏫᏳᏒᏃ ᎠᏥᎸ-ᎨᎶᎯ ᎾᏍᏉ ᎬᏂᎨᏒ ᎾᏋᏁᎭ, ᎠᎴ ᏂᎦᏛ ᏗᎨᎦᏁᎶᏗ ᎨᏒᎢ, ᎾᏍᎩ ᎾᏍᏉ ᎪᏪᎵ ᏕᎬᎩᏅᏁᎸᎩ ᎢᏓᎵᏅᏟ ᏧᏂᎪᏩᏛᏗ, ᎠᎴ ᏕᎹᏍᎦ ᏩᎩᎶᏒᎩ, ᏕᏥᏯᏅᎲᏒ ᎾᎿᎭᎠᏁᎯ ᏗᎨᎦᎸᎢᏛ ᏗᎦᏥᏯᏘᏃᎯᏍᏗᏱ ᏥᎷᏏᎵᎻ, ᎨᏥᎩᎵᏲᎢᏍᏙᏗᏱ. (Nugvwiyusvno atsilvgelohi nasquo gvnigesv naquvneha, ale nigadv digeganelodi gesvi, nasgi nasquo goweli degvginvnelvgi idalinvtli tsunigowadvdi, ale Demasga wagilosvgi, detsiyanvhvsv nahna anehi digegalvidv digatsiyatinohisdiyi Tsilusilimi, getsigiliyoisdodiyi.) — Cherokee Corpus</title>
