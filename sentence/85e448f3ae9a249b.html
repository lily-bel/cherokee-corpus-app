    <title>ᎠᏎᏃ ᎪᎯ ᏥᎩ, ᎿᎭᏉ ᎡᏥᎦᏙᎥᏒᎯ ᏥᎩ ᎤᏁᎳᏅᎯ, ᎠᎴ ᏯᏛᏅ ᎤᏁᎳᏅᎯ ᎢᏥᎦᏙᎥᏒᎯ ᏥᎩ, ᎦᏙ ᏗᎦᎵᏍᏙᏗᎭ ᎢᏣᏨᎭ ᏙᏣᎵᏍᎦᏍᏙᏗᎭ ᎠᏩᎾᎦᎳ ᎠᎴ ᎤᏲ ᎢᏳᏛᎿᎭᏕᎩ ᏗᎴᏅᏙᏗ ᏗᏕᎶᏆᏍᏗ, ᎾᏍᎩ ᎠᏏ ᎾᎿᎭᏥᏣᏚᎵ ᏤᏥᎾᏝ ᏔᎵᏁ ᎢᏣᎵᏍᏙᏗᏱ? (Aseno gohi tsigi, hnaquo etsigadovsvhi tsigi Unelanvhi, ale yadvnv Unelanvhi itsigadovsvhi tsigi, gado digalisdodiha itsatsvha dotsalisgasdodiha awanagala ale uyo iyudvhnadegi dilenvdodi dideloquasdi, nasgi asi nahna tsitsaduli tsetsinatla taline itsalisdodiyi?) — Cherokee Corpus</title>
