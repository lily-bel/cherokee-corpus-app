    <title>ᎥᏝ ᎠᎴ ᎤᏅᏒᏉ, ᎢᎬᏒᏍᎩᏂ ᎾᏍᏉ ᎾᏍᎩ ᎢᎬᏱᏱ ᎤᎾᏄᎪᏫᏒᎯ ~ᎠᏓᏅᏙ ᏥᎨᎭ, ᎠᏴ ᎾᏍᏉ ᎢᎬᏒ ᎨᏒ ᎭᏫᏂ ᏕᎩᎵᏰᏗᎭ, ᎢᏗᎦᏘᏴ ᏧᏪᏥ ᎢᎨᎬᏁᏗ, ᎾᏍᎩ ᏗᏗᏰᎸ ᏧᎫᏴᏗᏱ ᏧᏭᏓᎴᏍᏗᏱ. (Vtla ale unvsvquo, igvsvsgini nasquo nasgi igvyiyi unanugowisvhi ~adanvdo tsigeha, ayv nasquo igvsv gesv hawini degiliyediha, idigatiyv tsuwetsi igegvnedi, nasgi didiyelv tsuguyvdiyi tsuwudalesdiyi.) — Cherokee Corpus</title>
