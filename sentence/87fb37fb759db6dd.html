    <title>ᎿᎭᏉᏃ ᏧᎾᏁᎶᏗ ᎤᎾᏓᏡ Ꭼ ᏅᏩᏙᎯᏯᏛ ᏄᎾᎵᏍᏓᏁᎴ ᏂᎬᎾᏛ ᏧᏗᏱ ᎠᎴ ᎨᎵᎵ ᎠᎴ ᏌᎺᎵᏱ, ᎠᎴ ᎨᎦᎵᏂᎪᎯᏍᏔᏁᎢ, ᎠᎴ ᎠᎾᎢᏎ ᎾᎿᎭᎦᎾᏰᎯᏍᏗ ᎨᏒ ᎤᎬᏫᏳᎯ, ᎠᎴ ᎣᏍᏛ ᎤᏂᎦᎵᏍᏓᏗᏍᎬ ᎦᎸᏉᏗᏳ ᎠᏓᏅᏙ, ᎠᏂᏁᏉᎨᎢ.</title>
