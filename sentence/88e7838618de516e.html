    <title>ᎦᏙᎨᏃ ᏓᏓᏛᏂ? ᏥᎪ ᏗᎧᎿᎭᏩᏛᏍᏗ ᎠᏍᎦᏂᏉ? ᎬᏩᏟᏍᏗ. ᎥᏝᏍᎩᏂ ᎠᏍᎦᏂ ᏱᎬᎩᎦᏙᎥᏎ ᎥᏝ ᏗᎧᎿᎭᏩᏛᏍᏗ; ᎥᏝᏰᏃ ᏱᎦᏥᎦᏔᎮ ᎤᏲ ᎠᏚᎸᏅᏗ ᎨᏒᎢ, ᎢᏳᏃ ᏗᎧᎿᎭᏩᏛᏍᏗ ᎯᎠ ᏄᏪᏒᎾ ᏱᎨᏎᎢ, ᏞᏍᏗ ᏣᏓᏚᎸᎡᎸᎩ.</title>
    <meta name="description" content="Gadogeno dadadvni? Tsigo dikahnawadvsdi asganiquo? gvwatlisdi. Vtlasgini asgani yigvgigadovse vtla dikahnawadvsdi; Vtlayeno yigatsigatahe uyo adulvnvdi gesvi, iyuno dikahnawadvsdi hia nuwesvna yigesei, Tlesdi tsadadulvelvgi.&#10;What shall we say then? Is the law sin? God forbid. Nay, I had not known sin, but by the law: for I had not known lust, except the law had said, Thou shalt not covet. [CNT]" />
