    <title>ᎡᏙᏓ, ᎠᏆᏚᎵ ᎾᏍᏉ ᏗᏍᎩᎧᏁᎸᎯ ᎠᏴ ᎨᎥᎢ ᎾᏍᎩ ᎢᏧᎳᎭ ᎣᎦᏕᏗᏱ, -ᎾᏍᎩᏃ ᎤᏂᎪᏩᏛᏗᏱ ᎥᎩᎸᏉᏛᎢ, ᎾᏍᎩ ᏍᎩᏁᎸᎯ ᏥᎩ; ᏍᎩᎨᏳᎯᏳᏰᏃ ᎨᏒᎩ ᎠᏏ ᎡᎶᎯ ᎾᏓᎴᏂᏍᎬᎾ ᏥᎨᏒᎩ.</title>
    <meta name="description" content="Edoda, aquaduli nasquo disgikanelvhi ayv gevi nasgi itsulaha ogadediyi, nasgino unigowadvdiyi vgilvquodvi, nasgi sginelvhi tsigi; sgigeyuhiyuyeno gesvgi asi elohi nadalenisgvna tsigesvgi.&#10;Father, I will that they also, whom thou hast given me, be with me where I am; that they may behold my glory, which thou hast given me: for thou lovedst me before the foundation of the world. [CNT]" />
