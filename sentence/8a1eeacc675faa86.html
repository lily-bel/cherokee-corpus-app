    <title>ᎣᏏᏳ ᎤᏂᏰᎸᏅ ᎤᏙᎯᏳᎯ; ᎠᎴ ᎾᏍᎩ ᎬᏩᏂᏚᎦ. ᎢᏳᏰᏃ ᏧᎾᏓᎴᏅᏛ ᏴᏫ ᎤᏁᎳᏗᏍᏔᏅᎯ ᏱᎩ ᎾᏍᎩ ᎤᎾᏤᎵ ᏧᏓᎴᏅᏛ ᎠᏓᏅᏙ ᎤᎵᏍᏕᎸᏙᏗ ᎤᎬᏩᎵ, ᎢᏳᎾᏛᏁᏗ ᎾᏍᏉ ᏄᎾᎵᏍᏓᏁᎲᎩ ᎾᏍᎩ ᏧᏂᏍᏕᎸᏗᏱ ᎤᏇᏓᎵ ᎤᎵᏍᏕᎸᏙᏗ ᎤᎬᏩᎵ.</title>
    <meta name="description" content="Osiyu uniyelvnv udohiyuhi; ale nasgi gvwaniduga. Iyuyeno tsunadalenvdv yvwi uneladistanvhi yigi nasgi unatseli tsudalenvdv adanvdo ulisdelvdodi ugvwali, iyunadvnedi nasquo nunalisdanehvgi nasgi tsunisdelvdiyi uquedali ulisdelvdodi ugvwali.&#10;It hath pleased them verily; and their debtors they are. For if the Gentiles have been made partakers of their spiritual things, their duty is also to minister unto them in carnal things. [CNT]" />
