    <title>ᎢᏳᏃ ᏱᏅᏩᏍᏗᏗᏉ ᎢᏦᎯᏳᏒᎢ, ᎦᎫᏍᏛᏅᎯ ᎠᎴ ᎠᏍᏓᏱᏛᎯ ᎨᏒᎢ, ᎠᎴ ᎢᏴᏛ ᎢᎦᏰᏨᏁᏗ ᏂᎨᏒᎾ ᏱᎩ ᎤᏚᎩ ᎢᏨᏒ ᎣᏍᏛ ᎧᏃᎮᏛᏱ, ᎾᏍᎩ ᎢᏣᏛᎦᏅᎯ ᏥᎩ, ᎾᏂᎥ ᎨᎦᏁᎳᏅᎯ ᎨᏒ ᎨᎦᎵᏥᏙᏁᎸᎯ ᏥᎩ ᎦᎸᎶ ᎭᏫᏂᏗᏢ ᏄᎾᏛᏅᎢ; ᎾᏍᎩ ᎾᎿᎭᎠᏴ ᏉᎳ ᎪᎱᏍᏗ ᎦᏛᏁᎯ ᏥᏅᏋᏁᎸ; (Iyuno yinvwasdidiquo itsohiyusvi, gagusdvnvhi ale asdayidvhi gesvi, ale iyvdv igayetsvnedi nigesvna yigi udugi itsvsv osdv kanohedvyi, nasgi itsadvganvhi tsigi, naniv geganelanvhi gesv gegalitsidonelvhi tsigi galvlo hawiniditlv nunadvnvi; nasgi nahna ayv Quola gohusdi Gadvnehi tsinvquvnelv;) — Cherokee Corpus</title>
