    <title>ᎠᏂᎪᏩᏗᏍᎬᏰᏃ ᎢᏳᏍᏗ ᎾᏍᎩ ᎯᎠ ᎤᎾᎵᏍᏕᎸᏙᏗ ᎨᏒ ᎤᏁᎳᏅᎯ ᏛᏂᎸᏉᏔᏂ ᏂᎦᎵᏍᏙᏗᏍᎨᏍᏗ ᎬᏂᎨᏒ ᏂᏨᏁᎲ ᎢᏦᎯᏳᏒ ᎣᏍᏛ ᎧᏃᎮᏛ ᎦᎶᏁᏛ ᎤᏤᎵᎦ, ᎠᎴ ᏂᎦᎵᏍᏙᏗᏍᎨᏍᏗ ᏂᏥᎨᏳᎿᎭᎥᎾ ᎨᏒ ᏕᏥᏁᎲ ᎾᏍᎩ, ᎠᎴ ᎾᏂᎥᏉ; (Anigowadisgvyeno iyusdi nasgi hia unalisdelvdodi gesv Unelanvhi dvnilvquotani nigalisdodisgesdi gvnigesv nitsvnehv itsohiyusv osdv kanohedv Galonedv utseliga, ale nigalisdodisgesdi nitsigeyuhnavna gesv detsinehv nasgi, ale nanivquo;) — Cherokee Corpus</title>
