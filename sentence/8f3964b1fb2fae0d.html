    <title>ᏭᎪᎮᏃ Ꭸ ᎢᏴᏛ ᏗᏡᎨ ᏒᎦᎳᎢᏳᏍᏗ, ᎤᎵᏍᏚᏎᎢ, ᏭᎷᏤᎢ, ᏯᏎᎦᎩ ᏱᏥᏩᏛ ᎪᎱᏍᏗ ᏳᏔ ᎤᏪᎵᏎᎢ; ᎾᎿᎭᏃ ᏭᎷᏨ ᎥᏝ ᎪᎱᏍᏗ ᏳᏩᏛᎮ ᎤᎵᏍᏚᏒᏉ ᎤᏩᏒ; ᎥᏝᏰᏃ ᎠᏏ ᏳᏍᏆᎸᎮ ᏒᎦᏔᎢᏳᎾᏍᏗ ᎤᏅᏂᏍᏗᏱ. (Wugoheno ge iyvdv ditluge svgalaiyusdi, ulisdusei, wulutsei, yasegagi yitsiwadv gohusdi yuta uwelisei; nahnano wulutsv vtla gohusdi yuwadvhe ulisdusvquo uwasv; vtlayeno asi yusqualvhe svgataiyunasdi unvnisdiyi.) — Cherokee Corpus</title>
    <meta name="description" content="And seeing a fig tree afar off having leaves, he came, if haply he might find any thing thereon: and when he came to it, he found nothing but leaves; for the time of figs was not yet." />
