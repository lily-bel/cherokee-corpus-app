    <title>ᎠᎴ ᏅᏩᏓᎴ ᏗᎧᎿᎭᏩᏗᏙᎯ ᎤᎷᏨᎩ ᎠᎴ ᎠᏥᎸ-ᎨᎳᏍᏗᏱ ᎤᎴᏅᎩ, ᎠᏰᎲᎩ ᎠᏕᎸ-ᏓᎶᏂᎨ ᎪᏢᏔᏅᎯ ᎠᏜᏓᎦᏩᏒᎩ ᎠᎪᎲᏍᏙᏗᏱ; ᎤᏣᏘᏃ ᎠᏥᏁᎸᎩ ᎠᏜᏓᎦᏩᏒᎩ ᎾᏍᎩ ᎤᎵᏍᎪᎸᏙᏗᏱ ᎤᏠᏯᏍᏙᏗᏱ ᎠᎾᏓᏙᎵᏍᏗᏍᎬ ᏂᎦᏛ ᎤᎾᏓᏅᏘ, ᎾᎿᎭᎠᏥᎸ-ᎨᎳᏍᏗᏱ ᎠᏕᎸ-ᏓᎶᏂᎨ ᎪᏢᏔᏅᎯ ᎦᏍᎩᎸ ᎢᎬᏱᏗᏢ ᏥᎦᎧᎭ.</title>
    <meta name="description" content="Ale nvwadale dikahnawadidohi ulutsvgi ale atsilvgelasdiyi ulenvgi, ayehvgi adelvdalonige gotlvtanvhi adla gawasvgi agohvsdodiyi; utsatino atsinelvgi adla gawasvgi nasgi ulisgolvdodiyi utloyasdodiyi anadadolisdisgv nigadv unadanvti, nahna atsilvgelasdiyi adelvdalonige gotlvtanvhi gasgilv igvyiditlv tsigakaha.&#10;And another angel came and stood at the altar, having a golden censer; and there was given unto him much incense, that he should offer it with the prayers of all saints upon the golden altar which was before the throne. [CNT]" />
