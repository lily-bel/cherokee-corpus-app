    <title>ᎡᎶᏛᏃ ᏚᏔᎳᏬᎯᏎᎴ ᏓᏯ ᎠᎴ ᏌᏙᏂ ᎠᏁᎯ; ᎠᏎᏃ ᏌᏉ ᎢᎦᎦᏛ ᎬᏩᎷᏤᎴᎢ, ᎤᎾᎵᎢᏛᏃ ᏆᎳᏍᏓ ᎤᎬᏫᏳᎯ ᎤᏂᏏᏗᏱ ᎠᏥᎦᏘᏗᏍᏗ, ᏙᎯᏱ ᎢᏳᏅᏁᏗᏱ ᎤᏂᏔᏲᏎᎴᎢ; ᎤᎾᏤᎵᎪᎯᏰᏃ ᎤᎵᏍᏕᎸᏙᏕ ᎤᎬᏫᏳᎯ ᎤᏤᎵᎪᎯ.</title>
    <meta name="description" content="Elodvno dutalawohisele Daya ale Sadoni anehi; aseno saquo igagadv gvwalutselei, unaliidvno Qualasda ugvwiyuhi unisidiyi atsigatidisdi, dohiyi iyunvnediyi unitayoselei; unatseligohiyeno ulisdelvdode ugvwiyuhi utseligohi.&#10;And Herod was highly displeased with them of Tyre and Sidon: but they came with one accord to him, and, having made Blastus the king&#39;s chamberlain their friend, desired peace; because their country was nourished by the king&#39;s country. [CNT]" />
