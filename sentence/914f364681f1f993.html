    <title>ᏗᎧᎿᎭᏩᏛᏍᏗᏍᎪᏃ ᏓᏡᏗᎭ ᎤᏁᎳᏅᎯ ᏚᏚᎢᏍᏔᏅᎢ? ᎬᏩᏟᏍᏗ, ᎢᏳᏰᏃ ᏗᎧᎿᎭᏩᏛᏍᏗ ᏴᏫ ᎨᏥᏁᎸᎯ ᏱᎨᏎ, ᎾᏍᎩ ᏰᎵ ᎬᏂᏛ ᎬᏩᏓᏁᏗ ᎨᏒᎢ, ᎤᏙᎯᏳᎯᏯ ᏗᎧᎿᎭᏩᏛᏍᏗ ᎠᎲ ᎠᏚᏓᎴᏍᏗ ᎨᏒ ᏴᏗᏓᎴᎲᏍᎨᎢ.</title>
    <meta name="description" content="Dikahnawadvsdisgono datludiha Unelanvhi duduistanvi? gvwatlisdi, iyuyeno dikahnawadvsdi yvwi getsinelvhi yigese, nasgi yeli gvnidv gvwadanedi gesvi, udohiyuhiya dikahnawadvsdi ahv adudalesdi gesv yvdidalehvsgei.&#10;Is the law then against the promises of God? God forbid: for if there had been a law given which could have given life, verily righteousness should have been by the law. [CNT]" />
