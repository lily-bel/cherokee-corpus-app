    <title>ᏴᏫ ᏂᏂᏫ ᏣᏁᎲᎩ ᏙᏛᎾᎴᏂ ᏓᎬᏩᎾᏡᏔᏂ ᎪᎯ ᏣᏁᎭ, ᏗᎫᎪᏙᏗᏱ ᎢᎦ ᎨᏒᎢ, ᎠᎴ ᎤᏂᏍᎦᏅᏨ ᎬᏂᎨᏒ ᎤᏛᏅᏁᎵ; ᎾᏍᎩᏰᏃ ᏚᎾᏓᏅᏛ ᏚᏂᏁᏟᏴᏒᎩ ᏦᎾ ᎠᎵᏥᏙᎲᏍᎬ ᏄᏩᏂᏌᏅᎩ, ᎬᏂᏳᏉᏃ ᎠᏂ ᎡᏙᎭ ᎤᏟ ᎠᏥᎸᏉᏗᏳ ᎡᏍᎦᏉ ᏦᎾ. (Yvwi Niniwi tsanehvgi dodvnaleni dagvwanatlutani gohi tsaneha, digugododiyi iga gesvi, ale unisganvtsv gvnigesv udvnvneli; nasgiyeno dunadanvdv duninetliyvsvgi Tsona alitsidohvsgv nuwanisanvgi, gvniyuquono ani edoha utli atsilvquodiyu esgaquo Tsona.) — Cherokee Corpus</title>
    <meta name="description" content="The men of Nineveh shall rise in judgment with this generation, and shall condemn it: because they repented at the preaching of Jonas; and, behold, a greater than Jonas is here." />
