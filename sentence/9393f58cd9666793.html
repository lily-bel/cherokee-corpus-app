    <title>ᏗᏣᏓᏲᏁᎯ ᎢᏥᏍᎦᏯ ᎠᎴ ᎢᏥᎨᏴ, ᏝᏍᎪ ᏱᏥᎦᏔᎭ ᎡᎶᎯ ᎤᎾᎵᎢ ᎨᏒᎢ ᎤᏁᎳᏅᎯ ᎠᏍᎦᎩ ᎨᏒᎢ?  ᎾᏍᎩᏃ ᎢᏳᏍᏗ ᎢᏳᏃ ᎩᎶ ᎡᎶᎯ ᎤᎾᎵᎢ ᎢᏳᎵᏍᏙᏗᏱ ᏯᏓᏅᏖᎭ ᎾᏍᎩ ᎤᏁᎳᏅᎯ ᎠᏍᎦᎩ ᎨᏐᎢ. (Ditsadayonehi itsisgaya ale itsigeyv, tlasgo yitsigataha elohi unalii gesvi Unelanvhi asgagi gesvi?  Nasgino iyusdi iyuno gilo elohi unalii iyulisdodiyi yadanvteha nasgi Unelanvhi asgagi gesoi.) — Cherokee Corpus</title>
