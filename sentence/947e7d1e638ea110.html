    <title>ᎬᏂᏤᎭ ᏍᎩᏩᎯᏎᏗᏱ ᎠᏕᎸ ᏓᎶᏂᎨ ᎠᏥᎸᏱ ᎬᏔᏅᎯ, ᎾᏍᎩ ᎤᏙᎯᏳᎯ ᏤᏅᎢᏍᏗᏱ; ᎠᎴ ᎤᏁᎬ ᎠᏄᏬ ᏣᏄᏬᏍᏗ, ᎾᏍᎩ ᎤᏕᎰᎯᏍᏗ ᏣᏲᏓᎦ ᎨᏒ ᎬᏂᎨᏒ ᎢᏳᎵᏍᏙᏗᏱ ᏂᎨᏒᎾ; ᎠᎴ ᏘᎦᏙᎵ ᏗᏣᎶᏁᏙᏗᏱ ᏗᎦᏔ-ᏗᎦᎶᏁᏗ, ᎾᏍᎩ ᎨᏣᎪᏩᏛᏗ ᎢᏳᎵᏍᏙᏗᏱ. (Gvnitseha sgiwahisediyi adelv dalonige atsilvyi gvtanvhi, nasgi udohiyuhi tsenvisdiyi; ale unegv anuwo tsanuwosdi, nasgi udehohisdi tsayodaga gesv gvnigesv iyulisdodiyi nigesvna; ale tigadoli ditsalonedodiyi digatadigalonedi, nasgi getsagowadvdi iyulisdodiyi.) — Cherokee Corpus</title>
    <meta name="description" content="I counsel thee to buy of me gold tried in the fire, that thou mayest be rich; and white raiment, that thou mayest be clothed, and that the shame of thy nakedness do not appear; and anoint thine eyes with eyesalve, that thou mayest see." />
