    <title>ᏥᎦᏔᎭᏰᏃ ᎾᏍᎩ ᎠᏴ ᎨᏒᎢ, (ᎾᏍᎩ ᎠᎩᏇᏓᎸ ᏯᏛᏅ,) ᎪᎱᏍᏗ ᎣᏍᏛ ᏄᎵᏠᏯᏍᏛᎾ ᎨᏒᎢ; ᎠᏚᎸᏗᏱᏰᏃ ᎠᎩᎭ; ᎾᏍᎩᏍᎩᏂ Ꮎ ᎣᏍᏛ ᎨᏒ ᎢᏯᏛᏁᏗᏱ ᎥᏝ ᏱᏥᏩᏘᎭ. (Tsigatahayeno nasgi ayv gesvi, (nasgi agiquedalv yadvnv,) gohusdi osdv nulitloyasdvna gesvi; adulvdiyiyeno agiha; nasgisgini na osdv gesv iyadvnediyi vtla yitsiwatiha.) — Cherokee Corpus</title>
