    <title>ᎠᎴ ᏛᏂᏩᏛᎯ ᎨᎦᎫᏴᏓᏁᏗ ᏂᏚᏳᎪᏛᎾ ᏚᏂᎸᏫᏍᏓᏁᎲᎢ, ᎾᏍᎩᏯ ᎣᏏᏳ ᎤᏥᏰᎸᎯ ᎢᎦ ᎨᏒ ᎣᏍᏛ ᏧᎾᎵᏍᏓᏴᏗᏱ. ᏥᏚᏓᏓᎶᎢ ᎠᎴ ᎪᎱᏍᏗ ᏧᏍᏙᎢ ᎾᏍᎩᏯᎢ, ᎣᏏᏳ ᎤᏂᏰᎸᎭ ᎤᏅᏒ ᎠᎾᏓᎵᏓᏍᏗᏍᎬᎢ, ᎾᎯᏳ ᎢᏧᎳᎭ ᎢᏣᎵᏍᏓᏴᎲᏍᎬᎢ.</title>
    <meta name="description" content="Ale dvniwadvhi gegaguyvdanedi niduyugodvna dunilvwisdanehvi, nasgiya [gegaguyvdanedi tsigi] osiyu utsiyelvhi iga gesv osdv tsunalisdayvdiyi. Tsidudadaloi ale gohusdi tsusdoi nasgiyai, osiyu uniyelvha unvsv anadalidasdisgvi, nahiyu itsulaha itsalisdayvhvsgvi.&#10;And shall receive the reward of unrighteousness, as they that count it pleasure to riot in the day time. Spots they are and blemishes, sporting themselves with their own deceivings while they feast with you; [CNT]" />
