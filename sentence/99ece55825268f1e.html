    <title>ᎯᎠ ᎾᏍᎩ ᏓᎿᎭᏩ ᏅᏛᏅᏁᎵ ᎤᏃᏕᎾ ᎠᎩᎾ, ᎠᎴ ᎤᏃᏕᎾ ᎠᎩᎾ ᏙᏛᏎᎪᎩᏏ ᎾᏍᎩ; ᎾᏍᎩᏰᏃ ᎤᏂᎬᏫᏳᎯ ᎠᏁᎲ ᎤᎬᏫᏳᎯ; ᎠᎴ ᏄᏂᎬᏫᏳᏒ ᎠᏁᎲ ᎾᏍᎩ ᏄᎬᏫᏳᏌᏕᎩ; ᎠᎴ ᎾᏍᎩ ᎬᏩᏜᏓᏩᏍᏗᏕᎩ ᏥᎩ ᎨᏥᏯᏅᏛ, ᎠᎴ ᎨᎦᏑᏰᏛ, ᎠᎴ ᏄᎾᏓᎵᏓᏍᏛᎾ.</title>
    <meta name="description" content="Hia nasgi dahnawa nvdvnvneli Unodena agina, ale Unodena agina dodvsegogisi nasgi; nasgiyeno unigvwiyuhi anehv Ugvwiyuhi; ale nunigvwiyusv anehv nasgi Nugvwiyusadegi; ale nasgi gvwadlawasdidegi tsigi getsiyanvdv, ale gegasuyedv, ale nunadalidasdvna.&#10;These shall make war with the Lamb, and the Lamb shall overcome them: for he is Lord of lords, and King of kings: and they that are with him are called, and chosen, and faithful. [CNT]" />
