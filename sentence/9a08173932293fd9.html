    <title>ᎬᏩᎷᏤᎴᏃ ᎠᎴ ᎬᏩᏰᏍᏔᏁᎢ, ᎯᎠ ᎾᏂᏪᏍᎨᎢ; ᏔᏕᏲᎲᏍᎩ, ᏔᏕᏲᎲᏍᎩ, ᏓᏲᏣᏗᏒᏂ! ᎿᎭᏉᏃ ᎤᏗᏛᎮ ᎠᎴ ᏚᏍᎦᏤ ᎦᏃᎸᎥᏍᎬ ᎠᎴ ᏓᎵᏍᏗᎳᏁᎬ ᎠᎹ; ᎤᏂᏑᎵᎪᏤᏃ ᎠᎴ ᎤᏓᏥᎾᏍᏛᎯ ᏄᎵᏍᏔᏁᎢ.</title>
    <meta name="description" content="Gvwalutseleno ale gvwayestanei, hia naniwesgei; Tadeyohvsgi, Tadeyohvsgi, dayotsadisvni! Hnaquono udidvhe ale dusgatse ganolvvsgv ale dalisdilanegv ama; unisuligotseno ale udatsinasdvhi nulistanei.&#10;And they came to him, and awoke him, saying, Master, master, we perish. Then he arose, and rebuked the wind and the raging of the water: and they ceased, and there was a calm. [CNT]" />
