    <title>ᎤᏓᏅᏙᎩᎯᏃ ᎭᏫᏂ ᎤᎵᏰᏔᏁᎢ, ᎠᎴ ᎯᎠ ᏄᏪᏎᎢ, ᎦᏙᏃ ᎪᎯ ᎯᎠ ᏣᏁᎭ ᎤᏰᎸᏛ ᎤᏂᏲᎭ?  ᎤᏙᎯᏳᎯᏯ ᎯᎠ ᏂᏨᏪᏎᎭ, ᎥᏝ ᎬᏂᎨᏒ ᎢᎨᎬᏁᏗ ᏱᎨᏎᏍᏗ ᎤᏰᎸᏛ ᎯᎠ ᎪᎯ ᏣᏁᎭ. (Udanvdogihino hawini uliyetanei, ale hia nuwesei, Gadono gohi hia tsaneha uyelvdv uniyoha?  udohiyuhiya hia nitsvweseha, vtla gvnigesv igegvnedi yigesesdi uyelvdv hia gohi tsaneha.) — Cherokee Corpus</title>
