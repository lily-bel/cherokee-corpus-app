    <title>ᎠᎴ ᎩᎶ ᏗᎦᏬᏁᏗᏍᎩ ᎨᏎᏍᏗ, ᏗᎦᏬᏁᏙᏗᏉ ᎨᏒ ᏚᎸᏫᏍᏓᏁᎮᏍᏗ; ᎠᎴ ᎩᎶ ᏓᏯᏙᎮᎮᏍᏗ, ᏄᎨᏳᎲᏍᎬᎾ ᎾᏍᎩ ᎾᏛᏁᎮᏍᏗ; ᎩᎶ ᏣᎦᏁᎶᏗ ᎨᏎᏍᏗ, ᎣᏍᏛ ᎤᎦᏌᏯᏍᏗ ᎨᏎᏍᏗ; ᎩᎶ ᎠᏓᏙᎵᎨᏍᏗ, ᎤᎧᎵᏍᏗ ᎤᏓᏅᏛ ᎾᏍᎩ ᎾᏛᏁᎮᏍᏗ.</title>
    <meta name="description" content="Ale gilo digawonedisgi gesesdi, digawonedodiquo gesv dulvwisdanehesdi; ale gilo dayadohehesdi, nugeyuhvsgvna nasgi nadvnehesdi; gilo tsaganelodi gesesdi, osdv ugasayasdi gesesdi; gilo adadoligesdi, ukalisdi udanvdv nasgi nadvnehesdi.&#10;Or he that exhorteth, on exhortation: he that giveth, let him do it with simplicity; he that ruleth, with diligence; he that sheweth mercy, with cheerfulness. [CNT]" />
