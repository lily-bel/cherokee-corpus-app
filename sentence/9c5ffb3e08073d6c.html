    <title>ᎿᎭᏉᏃ ᎠᏂᏯᏫᏍᎩ, ᏥᏌ ᎬᏩᏛᏅ, ᏚᏂᏁᏒᎩ ᏧᏄᏬ, ᏅᎩ ᏂᏚᏂᏛᎩ, ᏌᏉ ᎢᎦᏛᎯ ᎠᏏᏴᏫ ᎠᏯᏫᏍᎩ ᎤᏤᎵᎦ ᏄᏅᏁᎸᎩ; ᎠᎴ ᎾᏍᏉ ᎭᏫᏂ ᎤᏄᏬᎥᎯ.  ᎾᏍᎩ ᎭᏫᏂ ᎠᏄᏬ ᎥᏝ ᎦᏰᏫᏛ ᏱᎨᏎᎢ, ᏂᎬ ᎬᏅᎯ ᎨᏒᎩ. (Hnaquono aniyawisgi, Tsisa gvwadvnv, duninesvgi tsunuwo, nvgi nidunidvgi, saquo igadvhi asiyvwi ayawisgi utseliga nunvnelvgi; ale nasquo hawini unuwovhi.  Nasgi hawini anuwo vtla gayewidv yigesei, nigv gvnvhi gesvgi.) — Cherokee Corpus</title>
