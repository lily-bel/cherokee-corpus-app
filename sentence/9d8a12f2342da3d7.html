    <title>ᎠᎴ ᎤᏣᏘ ᎤᏗᎴᎩ ᎨᏒ ᏕᎨᏥᎴᏴᏙᏔᏅᎩ ᏴᏫ, ᎠᎴ ᎤᏁᎳᏅᎯ ᏚᏙᎥ ᎤᏂᏐᏢᎢᏍᏔᏅᎩ, ᎾᏍᎩ ᎠᏓᏅᏖᏍᎬᏉ ᎢᎬᏩᏁᎵᏓᏍᏗ ᏥᎩ ᎯᎠ ᎾᏍᎩ ᎤᏕᏯᏙᏗ ᎨᏒᎢ; ᎠᎴ ᎥᏝ ᏱᏚᏂᏁᏟᏴᏎ ᏚᎾᏓᏅᏛ ᎾᏍᎩ ᎬᏩᎸᏉᏙᏗᏱ.</title>
    <meta name="description" content="Ale utsati udilegi gesv degetsileyvdotanvgi yvwi, ale Unelanvhi dudov unisotlvistanvgi, nasgi adanvtesgvquo igvwanelidasdi tsigi hia nasgi udeyadodi gesvi; ale vtla yiduninetliyvse dunadanvdv nasgi gvwalvquododiyi.&#10;And men were scorched with great heat, and blasphemed the name of God, which hath power over these plagues: and they repented not to give him glory. [CNT]" />
