    <title>ᎠᏂ ᎠᎦᏙᎥᎯᏍᏗ ᎨᏒ ᎪᎱᏍᏗ ᎢᏛᏓ.  ᎩᎶ ᎤᏬᎵᏣᏘ ᎨᏎᏍᏗ ᏩᏎᎦ ᎢᎦᎢ ᎨᏒ ᎠᎦᏎᏍᏗᏱ ᏅᎩ-ᏗᎦᏅᏎᏗ; ᏴᏫᏰᏃ ᎤᏎᏍᏗ ᎨᏒ ᎤᎬᏩᎳ; ᎠᎴ ᎾᏍᎩ ᎠᎦᏎᏍᏗ ᎨᏒ ᎯᎠ ᏂᎦᎥ, ᏑᏓᎵᏧᏈ ᏑᏓᎳᏍᎪᎯ ᏑᏓᎵᎦᎵ. (Ani agadovhisdi gesv gohusdi idvda.  Gilo uwolitsati gesesdi wasega igai gesv agasesdiyi nvgidiganvsedi; yvwiyeno usesdi gesv ugvwala; ale nasgi agasesdi gesv hia nigav, Sudalitsuqui sudalasgohi sudaligali.) — Cherokee Corpus</title>
