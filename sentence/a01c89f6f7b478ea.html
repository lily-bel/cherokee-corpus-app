    <title>ᏦᎢᏃ ᏫᏄᏒᎸ ᎯᎠ ᏄᎵᏍᏔᏅᎩ; ᏉᎳ ᏚᏪᏟᏌᏅᎩ ᏄᏂᎬᏫᏳᏒ ᎠᏂᏧᏏ; ᎤᎾᏓᏟᏌᏅᏃ ᎯᎠ ᏂᏚᏪᏎᎸᎩ; ᎢᏥᏍᎦᏯ ᎢᏓᏓᏅᏟ, ᎠᏴ ᎥᏝ ᎪᎱᏍᏗ ᎦᏥᏍᎦᏅᏤᎸᎯ ᏱᎩ ᏗᎦᏤᎵ ᏴᏫ, ᎥᏝ ᎠᎴ ᎠᎩᏲᏍᏔᏅᎯ ᏱᎩ ᏗᎧᎿᎭᏩᏛᏍᏗ ᏗᎩᎦᏴᎵᎨ ᎨᎩᏁᎸᎯ; ᎠᏎᏃ ᏥᎷᏏᎵᎻ ᏥᏴᎩ ᏓᎬᏆᏘᎾᏫᏛᎲᎩ ᏕᎬᎩᏲᏒᎩ ᎠᏂᎶᎻᏱ.</title>
    <meta name="description" content="Tsoino winusvlv hia nulistanvgi; Quola duwetlisanvgi nunigvwiyusv Anitsusi; unadatlisanvno hia niduweselvgi; Itsisgaya idadanvtli, ayv vtla gohusdi gatsisganvtselvhi yigi digatseli yvwi, vtla ale agiyostanvhi yigi dikahnawadvsdi digigayvlige geginelvhi; aseno Tsilusilimi tsiyvgi dagvquatinawidvhvgi degvgiyosvgi Anilomiyi.&#10;And it came to pass, that after three days Paul called the chief of the Jews together: and when they were come together, he said unto them, Men and brethren, though I have committed nothing against the people, or customs of our fathers, yet was I delivered prisoner from Jerusalem into the hands of the Romans. [CNT]" />
