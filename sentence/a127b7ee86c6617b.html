    <title>ᎯᎠᏃ ᏂᏚᏪᏎᎴᎢ, ᎯᎠ ᎾᏍᎩ ᏥᏂᏨᏪᏎᎸᎩ, ᎠᏏᏉ ᏥᏨᏰᎳᏗᏙᎲᎩ, ᎾᏍᎩ ᏂᎦᎥ ᎾᏍᎩ ᎠᏎ ᎢᏳᎵᏍᏙᏗ ᎨᏒᎢ ᎪᏪᎳᏅᎯ ᎨᏒ ᏗᎧᎿᎭᏩᏛᏍᏗᏱ ᎼᏏ ᎤᏤᎵᎦ, ᎠᎴ ᎠᎾᏙᎴᎰᏍᎩ ᏚᏃᏪᎸᎢ, ᎠᎴ ᏗᎧᏃᎩᏍᏗᏱ, ᎠᏴ ᎬᎩᏃᎮᏍᎬᎢ. (Hiano niduweselei, Hia nasgi tsinitsvweselvgi, asiquo tsitsvyeladidohvgi, nasgi nigav nasgi ase iyulisdodi gesvi gowelanvhi gesv dikahnawadvsdiyi Mosi utseliga, ale anadolehosgi dunowelvi, ale dikanogisdiyi, ayv gvginohesgvi.) — Cherokee Corpus</title>
