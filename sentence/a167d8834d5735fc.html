    <title>ᎠᏏ ᎢᎦ ᏥᏕᏥᎸᏌᏓᏕᎭ, ᎢᏦᎯᏳᎲᎦ ᎢᎦ ᏚᎸᏌᏛᎢ, ᎾᏍᎩᏃ ᏂᎯ ᎢᎦ ᏚᎸᏌᏛ ᏧᏪᏥ ᎨᏎᏍᏗ.  ᎾᏍᎩ ᎯᎠ ᏄᏪᏒᎩ ᏥᏌ, ᎠᎴ ᎤᏓᏅᏒᎩ ᏚᏗᏍᎦᎳᏁᎸᎩ. (Asi iga tsidetsilvsadadeha, itsohiyuhvga iga dulvsadvi, nasgino nihi iga dulvsadv tsuwetsi gesesdi.  Nasgi hia nuwesvgi Tsisa, ale udanvsvgi dudisgalanelvgi.) — Cherokee Corpus</title>
