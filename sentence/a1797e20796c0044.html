    <title>ᏗᏂᏍᎪᎵᏃ ᎪᏍᏚ ᏚᏂᏝᏅᎩ, ᎠᎴ ᎤᏁᎷᏅᎩ ᏓᎾᏠᏱᎲᎢ, ᎠᎴ ᏓᏂᏴᎬᎢ, ᎯᎠ ᎾᏂᏪᏍᎬᎩ, ᎤᏲᏍᏛᏉ, ᎤᏲᏍᏛᏉ, ᎾᏍᎩ Ꮎ ᎡᏆ ᎦᏚᎲᎢ, ᎾᎿᎭᏧᏁᎿᎭᎢ ᏥᏄᎾᎵᏍᏔᏅᎩ ᏂᎦᏛ ᎠᎺᏉᎯ ᏥᏳ ᏗᏂᏂᏙᎯ, ᏅᏗᎦᎵᏍᏙᏗᏍᎬ ᎤᏣᏘ ᎤᏪᎿᎭᎢᏳ ᎨᏒᎢ, ᏑᏟᎶᏛᏉᏰᏃ ᎢᎪᎯᏛ ᏅᏔ ᎾᎬᏁᎸ.</title>
    <meta name="description" content="Dinisgolino gosdu dunitlanvgi, ale unelunvgi danatloyihvi, ale daniyvgvi, hia naniwesgvgi, Uyosdvquo, uyosdvquo, nasgi na equa gaduhvi, nahna tsunehnai tsinunalistanvgi nigadv amequohi tsiyu dininidohi, nvdigalisdodisgv utsati uwehnaiyu gesvi, sutlilodvquoyeno igohidv nvta nagvnelv.&#10;And they cast dust on their heads, and cried, weeping and wailing, saying, Alas, alas, that great city, wherein were made rich all that had ships in the sea by reason of her costliness! for in one hour is she made desolate. [CNT]" />
