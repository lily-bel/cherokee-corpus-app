    <title>ᏗᏂᏍᎪᎵᏃ ᎪᏍᏚ ᏚᏂᏝᏅᎩ, ᎠᎴ ᎤᏁᎷᏅᎩ ᏓᎾᏠᏱᎲᎢ, ᎠᎴ ᏓᏂᏴᎬᎢ, ᎯᎠ ᎾᏂᏪᏍᎬᎩ, ᎤᏲᏍᏛᏉ, ᎤᏲᏍᏛᏉ, ᎾᏍᎩ Ꮎ ᎡᏆ ᎦᏚᎲᎢ, ᎾᎿᎭᏧᏁᎿᎭᎢ ᏥᏄᎾᎵᏍᏔᏅᎩ ᏂᎦᏛ ᎠᎺᏉᎯ ᏥᏳ ᏗᏂᏂᏙᎯ, ᏅᏗᎦᎵᏍᏙᏗᏍᎬ ᎤᏣᏘ ᎤᏪᎿᎭᎢᏳ ᎨᏒᎢ, ᏑᏟᎶᏛᏉᏰᏃ ᎢᎪᎯᏛ ᏅᏔ ᎾᎬᏁᎸ. (Dinisgolino gosdu dunitlanvgi, ale unelunvgi danatloyihvi, ale daniyvgvi, hia naniwesgvgi, Uyosdvquo, uyosdvquo, nasgi na equa gaduhvi, nahna tsunehnai tsinunalistanvgi nigadv amequohi tsiyu dininidohi, nvdigalisdodisgv utsati uwehnaiyu gesvi, sutlilodvquoyeno igohidv nvta nagvnelv.) — Cherokee Corpus</title>
