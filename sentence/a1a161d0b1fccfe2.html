    <title>ᎢᏳᏰᏃ ᎤᏁᎳᏅᎯ ᎾᏍᎩ ᏱᏂᎬᏁᎭ ᏱᎦᏄᏬᎭ ᎧᏁᏍᎦ, ᎾᏍᎩ ᎪᎯ ᎢᎦ ᏠᎨᏏ ᏤᎭ, ᎤᎩᏨᏅᏃ ᏗᎦᏚᏗᏱ ᏬᎾᏗᏅᏗ ᏥᎩ, ᎤᏟᎯᏳᏍᎩᏂ ᏂᎯ ᏂᏙᏓᏥᏄᏬᎢ ᎤᏍᏗ ᎢᏦᎯᏳᎯ! (Iyuyeno Unelanvhi nasgi yinigvneha yiganuwoha kanesga, nasgi gohi iga tlogesi tseha, ugitsvnvno digadudiyi wonadinvdi tsigi, utlihiyusgini nihi nidodatsinuwoi usdi itsohiyuhi!) — Cherokee Corpus</title>
