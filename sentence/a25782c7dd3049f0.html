    <title>ᎬᏂᏳᏉ ᎣᏏᏳ ᎢᏳᎾᎵᏍᏓᏁᏗ ᎢᎩᏰᎸᏐ ᏗᏅᏂᏗᏳ ᏥᎨᏐᎢ. ᎢᏣᏛᎦᏅ ᎬᏂᏗᏳ ᎨᏒ ᏦᏈ, ᎠᎴ ᎢᏥᎪᎲ ᏄᏍᏛ ᏭᏰᎢᎶᎯᏍᏗ ᎨᏒ ᎤᎬᏫᏳᎯ, ᎠᎴ ᎾᏍᎩ ᎤᎬᏫᏳᎯ ᎤᏣᏘ ᎤᏓᏅᏘᏳ ᎨᏒ ᎠᎴ ᎤᏓᏙᎵᏣᏘᏳ ᎨᏒᎢ.</title>
    <meta name="description" content="Gvniyuquo osiyu iyunalisdanedi igiyelvso dinvnidiyu tsigesoi. Itsadvganv gvnidiyu gesv Tsoqui, ale itsigohv nusdv wuyeilohisdi gesv Ugvwiyuhi, ale nasgi Ugvwiyuhi utsati udanvtiyu gesv ale udadolitsatiyu gesvi.&#10;Behold, we count them happy which endure. Ye have heard of the patience of Job, and have seen the end of the Lord; that the Lord is very pitiful, and of tender mercy. [CNT]" />
