    <title>ᏥᏌ ᎯᎠ ᏄᏪᏎᎸᎩ; ᎩᎶ ᎤᏙᏑᎵᏌᏛ ᏥᎨᏐᎢ ᏧᎳᏏᏕᏂᏉ ᏧᏩᏒ ᏧᏬᏑᎴᏗ ᎨᏐᎢ; ᏂᎬᏃ ᎤᏓᏅᎦᎸᏛ ᎨᏐᎢ.  ᎠᎴ ᏂᎯ ᎢᏣᏓᏅᎦᎸᏛ, ᎠᏎᏃ ᎥᏝ ᏂᏥᎥ ᏱᎩ. (Tsisa hia nuweselvgi; Gilo udosulisadv tsigesoi tsulasideniquo tsuwasv tsuwosuledi gesoi; nigvno udanvgalvdv gesoi.  Ale nihi itsadanvgalvdv, aseno vtla nitsiv yigi.) — Cherokee Corpus</title>
    <meta name="description" content="Jesus saith to him, He that is washed needeth not save to wash his feet, but is clean every whit: and ye are clean, but not all." />
