    <title>ᎾᎯᏳᏰᏃ ᎨᏎᏍᏗ ᎠᎩᎵᏯ ᎡᎮᏍᏗ, ᎾᏍᎩ ᎪᏢᏅᎢ ᎾᏍᎩ ᎤᏁᎳᏅᎯ ᏧᏬᏢᏁ ᏅᏓᎬᏩᏓᎴᏅᏛ ᎪᎯ ᎢᏯᏍᏗ ᎥᏝ ᎾᏍᎩ ᎢᏳᏍᏗ ᏳᏕᏃᎢ, ᎥᏝ ᎠᎴ ᎤᏕᏗ ᏱᎨᏎᏍᏗ. (Nahiyuyeno gesesdi agiliya ehesdi, nasgi gotlvnvi nasgi Unelanvhi tsuwotlvne nvdagvwadalenvdv gohi iyasdi vtla nasgi iyusdi yudenoi, vtla ale udedi yigesesdi.) — Cherokee Corpus</title>
