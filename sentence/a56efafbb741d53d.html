    <title>ᎠᏎᏃ ᏠᎨᏏ ᏧᏂᎸᏫᏍᏓᏁᎯ ᎤᏂᎪᎲ, ᎤᏅᏒ ᎨᏒ ᎤᎾᎵᏃᎮᎴ ᎯᎠ ᏂᏚᎾᏓᏪᏎᎴᎢ, ᎯᎠ ᎾᏍᎩ ᎤᏘᏰᏗ ᏥᎩ ᏧᎬᏩᎶᏗ, Ꭷ, ᎡᏗᎷᎦ, ᎾᏍᎩᏃ ᏧᎬᏩᎶᏗ ᎤᏘᏯᏍᏓᏁᏗ ᎨᏒ ᎢᎦᏤᎵ ᏱᏂᎦᎵᏍᏓ. (Aseno tlogesi tsunilvwisdanehi unigohv, unvsv gesv unalinohele hia nidunadaweselei, Hia nasgi utiyedi tsigi tsugvwalodi, Ka, ediluga, nasgino tsugvwalodi utiyasdanedi gesv igatseli yinigalisda.) — Cherokee Corpus</title>
