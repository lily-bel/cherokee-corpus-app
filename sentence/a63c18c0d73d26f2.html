    <title>ᎤᏙᎯᏳᎯᏍᎩᏂᏃᏅ ᎠᏩᎾᎦᎳᎯᏳ ᎨᏒ ᏓᏓᎾᏩᏍᏛ ᎠᎦᏛᏅᎩ, ᎠᏎᏃ ᎬᏃᏛ ᎢᏯᎬᏁᎸᎯ ᎬᏔᏅᎯ ᎤᎵᏂᎩᏗᏳ ᎨᏒ ᎤᏁᎳᏅᎯ. ᎠᏴ ᎾᏍᏉ ᎾᏍᎩ ᎣᏥᏯᎥ ᏦᏥᏩᎾᎦᎳᎯᏳ, ᎠᏎᏃ ᎢᏧᎳᎭ ᏙᏨᏁᏍᏗ ᎾᏍᎩ, ᎤᏁᎳᏅᎯ ᎤᎵᏂᎩᏗᏳ ᎨᏒ ᎢᏨᏴᏓᏁᎲ ᏂᎯ.</title>
    <meta name="description" content="Udohiyuhisgininonv awanagalahiyu gesv dadanawasdv agadvnvgi, aseno gvnodv iyagvnelvhi gvtanvhi ulinigidiyu gesv Unelanvhi. Ayv nasquo nasgi otsiyav tsotsiwanagalahiyu, aseno itsulaha dotsvnesdi nasgi, Unelanvhi ulinigidiyu gesv itsvyvdanehv nihi.&#10;For though he was crucified through weakness, yet he liveth by the power of God. For we also are weak in him, but we shall live with him by the power of God toward you. [CNT]" />
