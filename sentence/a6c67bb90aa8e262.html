    <title>ᎯᎠᏃ ᏄᎵᏍᏔᏅᎩ, ᎾᏍᎩ ᏆᏟᏯ ᎤᏙᏓ ᎦᏅᎬᎩ ᎤᏗᎴᎲᏍᎬᎩ ᎠᎴ ᎩᎬ ᏚᏩᎫᏍᎬᎩ, ᎾᏍᎩ ᏉᎳ ᎤᏴᎸᎩ ᎦᏅᎬᎢ, ᎤᏓᏙᎵᏍᏔᏅᏃ ᎠᎴ ᏚᏏᏔᏛ ᎤᏅᏩᏅᎩ. (Hiano nulistanvgi, nasgi Quatliya udoda ganvgvgi udilehvsgvgi ale gigv duwagusgvgi, nasgi Quola uyvlvgi ganvgvi, udadolistanvno ale dusitadv unvwanvgi.) — Cherokee Corpus</title>
