    <title>ᎤᎵᏍᏆᎸᏗᏃ ᎨᏒᎢ ᎢᏓᎵᏅᏟ, ᏂᎦᎥ ᎦᏰᎪᎩ ᏂᎨᏒᎾ ᎨᏒᎢ, ᏂᎦᎥ ᎦᎸᏉᏙᏗ ᎨᏒᎢ, ᏂᎦᎥ ᏚᏳᎪᏛ ᎨᏒᎢ, ᏂᎦᎥ ᎦᏓᎭ ᏂᎨᏒᎾ ᎨᏒᎢ, ᏂᎦᎥ ᎣᏏᏳ ᎬᏰᎸᏗ ᎨᏒᎢ, ᏂᎦᎥ ᎣᏏᏳ ᎠᏂᏃᎮᏍᎨᏍᏗ; ᎢᏳᏃ ᎣᏏᏳ ᎢᏯᏛᏁᏗ ᏰᎭ, ᎢᏳᏃ ᎪᎱᏍᏗ ᎦᎸᏉᏙᏗ ᎨᏎᏍᏗ, ᎾᏍᎩ ᏕᏣᏓᏅᏖᏍᎨᏍᏗ.</title>
    <meta name="description" content="Ulisqualvdino gesvi idalinvtli, nigav gayegogi nigesvna gesvi, nigav galvquododi gesvi, nigav duyugodv gesvi, nigav gadaha nigesvna gesvi, nigav osiyu gvyelvdi gesvi, nigav osiyu aninohesgesdi; iyuno osiyu iyadvnedi yeha, iyuno gohusdi galvquododi gesesdi, nasgi detsadanvtesgesdi.&#10;Finally, brethren, whatsoever things are true, whatsoever things are honest, whatsoever things are just, whatsoever things are pure, whatsoever things are lovely, whatsoever things are of good report; if there be any virtue, and if there be any praise, think on these things. [CNT]" />
