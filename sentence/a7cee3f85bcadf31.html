    <title>ᏞᏍᏗ ᎤᏲ ᏁᏨᏁᎲ ᏱᏣᏞᎨᏍᏗ ᎤᏲ ᏱᏂᏣᏓᏛᏁᎮᏍᏗ, ᎠᎴ ᎦᏰᏥᏐᏢᏔᏅ ᏞᏍᏗ ᏱᏣᏞᎨᏍᏗ ᏱᎨᏣᏓᏐᏢᏗᏍᎨᏍᏗ, ᎣᏍᏛᏉᏍᏗᏂ ᎨᏥᏁᏤᎮᏍᏗ; ᎢᏥᎦᏔᎭᏰᏃ ᎾᏍᎩ ᎢᏣᏛᏁᏗᏱ ᎡᏥᏯᏅᏛ ᎨᏒᎢ, ᎾᏍᎩ ᎢᏣᏤᎵ ᎢᏳᎵᏍᏙᏗᏱ ᎣᏍᏛ ᎡᏥᏁᏤᏗᏱ.</title>
    <meta name="description" content="Tlesdi uyo netsvnehv yitsatlegesdi uyo yinitsadadvnehesdi, ale gayetsisotlvtanv tlesdi yitsatlegesdi yigetsadasotlvdisgesdi, osdvquosdini getsinetsehesdi; itsigatahayeno nasgi itsadvnediyi etsiyanvdv gesvi, nasgi itsatseli iyulisdodiyi osdv etsinetsediyi.&#10;Not rendering evil for evil, or railing for railing: but contrariwise blessing; knowing that ye are thereunto called, that ye should inherit a blessing. [CNT]" />
