    <title>ᎯᎠᏃ ᎾᏍᎩ ᏥᏄᏍᏗ ᎡᎩᏚᎢᏍᏓᏁᎸᎯ ᏥᎩ, ᎢᏨᎨᏳᎢ, ᎢᏓᏓᏅᎦᎸ ᎢᏗᎲᎾ ᏄᏓᎴᏒ ᎦᏓᎭ ᎨᏒ ᎢᎩᏇᏓᎸ, ᎠᎴ ᎢᎦᏓᏅᏙᎩᎯ, ᎢᏗᏍᏆᏗᏍᎨᏍᏗ ᏚᏳᎪᏛ ᎨᏒᎢ, ᎤᏁᎳᏅᎯ ᎡᏗᎾᏰᏍᎬᎢ. (Hiano nasgi tsinusdi egiduisdanelvhi tsigi, itsvgeyui, idadanvgalv idihvna nudalesv gadaha gesv igiquedalv, ale igadanvdogihi, idisquadisgesdi duyugodv gesvi, Unelanvhi edinayesgvi.) — Cherokee Corpus</title>
