    <title>ᎿᎭᏉᏃ ᎺᎵ ᎤᎩᏒᎩ ᏑᏓᎨᏛ ᎠᏠᏁᏗ ᎾᏓ ᏧᏙᎢᏛ ᎪᎱᏍᏗ ᎾᏑᏴᎾ, ᎤᏣᏘ ᏧᎬᏩᎶᏗ, ᎠᎴ ᏚᏅᎵᏰᎥᎩ ᏥᏌ ᏧᎳᏏᏕᏂ, ᎠᎴ ᎤᏍᏘᏰᎬ ᎤᏩᏔᏅᎩ ᏚᏅᎦᎸᎲᎩ ᏧᎳᏏᏕᏂ. ᎠᎴ ᎦᎵᏦᏕ ᎤᎧᎵᏨᎩ ᎦᏩᏒᎬ ᎠᏠᏁᏗ.</title>
    <meta name="description" content="Hnaquono Meli ugisvgi sudagedv atlonedi nada tsudoidv gohusdi nasuyvna, utsati tsugvwalodi, ale dunvliyevgi Tsisa tsulasideni, ale ustiyegv uwatanvgi dunvgalvhvgi tsulasideni. Ale galitsode ukalitsvgi gawasvgv atlonedi.&#10;Then took Mary a pound of ointment of spikenard, very costly, and anointed the feet of Jesus, and wiped his feet with her hair: and the house was filled with the odour of the ointment. [CNT]" />
