    <title>ᏗᏣᏤᎵ ᏓᎶᏂᎨ ᎠᏕᎸ ᎠᎴ ᎤᏁᎬ ᎠᏕᎸ ᏚᏯᏍᏜᏓᏛ, ᏚᏯᏍᏜᏓᏛᏃ ᎢᏥᏃᎮᏍᎩ ᎨᏎᏍᏗ, ᎠᎴ ᎤᏪᏰᏍᏗ ᎨᏎᏍᏗ ᎢᏥᏇᏓᎸ ᎠᏥᎸ ᏥᎦᏰᏍᎪ ᎾᏍᎩᏯᎢ.  ᎢᏥᏟᏌᏅ ᏧᎬᏩᎶᏗ ᎤᎵᏍᏆᎸᏗ ᎢᎦ ᎨᏒ ᎤᎬᏩᎵ. (Ditsatseli dalonige adelv ale unegv adelv duyasdladv, duyasdladvno itsinohesgi gesesdi, ale uweyesdi gesesdi itsiquedalv atsilv tsigayesgo nasgiyai.  Itsitlisanv tsugvwalodi ulisqualvdi iga gesv ugvwali.) — Cherokee Corpus</title>
