    <title>ᎢᏳᏃ ᎣᏍᏛ ᎠᏥᏃᎮᏍᎩ ᎨᏎᏍᏗ ᎣᏏ ᏕᎤᎸᏫᏍᏓᏁᎲᎢ, ᎢᏳᏃ ᏗᏂᏲᎵ ᏧᏛᎯᏍᏔᏅᎯ ᎨᏎᏍᏗ, ᎢᏳᏃ ᎠᏁᏙᎯ ᏧᏍᏆᏂᎪᏔᏅᎯ ᎨᏎᏍᏗ, ᎢᏳᏃ ᎤᎾᏓᏅᏘ ᏧᎾᎳᏏᏕᏂ ᏧᏬᏑᎴᎸᎯ ᎨᏎᏍᏗ, ᎢᏳᏃ ᏧᏍᏕᎸᏛ ᎨᏎᏍᏗ ᎠᏂᎩᎵᏲᎩ, ᎢᏳᏃ ᎤᏍᏓᏩᏛᏛ ᎨᏎᏍᏗ ᏂᎦᎥ ᎣᏍᏛ ᏗᎦᎸᏫᏍᏓᏁᏗ ᎨᏒᎢ. (Iyuno osdv atsinohesgi gesesdi osi deulvwisdanehvi, iyuno diniyoli tsudvhistanvhi gesesdi, iyuno anedohi tsusquanigotanvhi gesesdi, iyuno unadanvti tsunalasideni tsuwosulelvhi gesesdi, iyuno tsusdelvdv gesesdi anigiliyogi, iyuno usdawadvdv gesesdi nigav osdv digalvwisdanedi gesvi.) — Cherokee Corpus</title>
    <meta name="description" content="Well reported of for good works; if she have brought up children, if she have lodged strangers, if she have washed the saints&#39; feet, if she have relieved the afflicted, if she have diligently followed every good work." />
