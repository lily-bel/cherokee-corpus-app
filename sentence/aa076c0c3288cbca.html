    <title>ᎠᏎᏃ ᎢᏨᎨᏳᎢ, ᎯᎠ ᎾᏍᎩ ᏑᏓᎴᎩ ᏞᏍᏗ ᏂᏥᎦᏔᎲᎾᏉ ᏱᎨᏎᏍᏗ, ᎾᏍᎩ ᏌᏉ ᎢᎦ ᎨᏒ ᎤᎬᏫᏳᎯ ᏙᏗᎧᏂᏍᎬ ᏌᏉ ᎢᏯᎦᏴᎵ ᎢᏧᏕᏘᏴᏛ ᎤᏠᏱ, ᏌᏉᏃ ᎢᏯᎦᏴᎵ ᎢᏧᏕᏘᏴᏛ ᏌᏉ ᎢᎦ ᎨᏒ ᎤᏠᏱ. (Aseno itsvgeyui, hia nasgi sudalegi tlesdi nitsigatahvnaquo yigesesdi, nasgi saquo iga gesv Ugvwiyuhi dodikanisgv saquo iyagayvli itsudetiyvdv utloyi, saquono iyagayvli itsudetiyvdv saquo iga gesv utloyi.) — Cherokee Corpus</title>
