    <title>ᎠᏎᏃ ᎤᏟ ᎢᎦᎢ ᏧᏃᏣᎶᎢᏍᏗᏱ ᏂᎨᏒᎾ ᏴᏫ ᎠᏁᎲᎢ, ᎤᎵᏂᎩᏛᏯ ᏗᏗᏍᎦᎩ ᏗᏗᏁᏥ, ᎪᎯ ᎢᏳᏓᎴᏅᏛ ᎯᎠ ᎾᏍᎩ ᏚᏙᎥ ᎠᏂᏁᎢᏍᏗᏍᎬ ᎩᎶ ᎤᏂᏬᏁᏙᏗᏱ ᏂᎨᏒᎾ. (Aseno utli igai tsunotsaloisdiyi nigesvna yvwi anehvi, ulinigidvya didisgagi didinetsi, gohi iyudalenvdv hia nasgi dudov anineisdisgv gilo uniwonedodiyi nigesvna.) — Cherokee Corpus</title>
