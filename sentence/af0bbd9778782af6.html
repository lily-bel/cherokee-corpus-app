    <title>ᏫᏨᏲᏪᎳᏏ ᏗᏣᏁᎶᏗ ᎢᏣᏓᏡᎬ ᎤᏁᎳᏅᎯ ᎤᏤᎵᎦ, ᎾᏍᎩ ᎪᎵᏂᏗᏱ ᏥᏣᏓᏡᎦ, ᎾᏍᎩ ᎢᏥᏍᎦᎾ ᏂᎨᏒᎾ ᎢᏰᏨᏁᎸᎯ ᏥᏌ ᎦᎶᏁᏛ ᎢᏳᏩᏂᏌᏛ, ᎡᏥᏯᏅᏛ ᎢᏣᏓᏅᏘ, ᎠᎴ ᎾᏂᎥ ᏂᎦᎥ ᏕᎨᏌᏗᏒ ᏥᏌ ᎦᎶᏁᏛ ᎢᎦᏤᎵ ᎤᎬᏫᏳᎯ ᏚᏙᎥ ᎠᏂᏁᎢᏍᏗᏍᎩ, ᎾᏍᎩ ᎢᏧᎳᏉ ᎾᏍᎩ ᎤᎾᏤᎵᎦ ᎠᎴ ᎠᏴ ᎢᎦᏤᎵᎦ; (Witsvyowelasi ditsanelodi itsadatlugv Unelanvhi utseliga, nasgi Golinidiyi tsitsadatluga, nasgi itsisgana nigesvna iyetsvnelvhi Tsisa Galonedv iyuwanisadv, etsiyanvdv itsadanvti, ale naniv nigav degesadisv Tsisa Galonedv igatseli Ugvwiyuhi dudov anineisdisgi, nasgi itsulaquo nasgi unatseliga ale ayv igatseliga;) — Cherokee Corpus</title>
