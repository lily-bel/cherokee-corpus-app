    <title>ᎾᏍᎩ ᎾᎿᎭᏥᏚᏂᎸᏫᏍᏓᏁᎭ ᏗᏟᎶᏍᏔᏅᎯ ᎠᎴ ᎤᏓᏩᏗᏍᏙᏛ ᎦᎸᎳᏗ ᎡᎯ ᎦᎵᏦᏛᎢ, ᎾᏍᎩᏯ ᎼᏏ ᏧᏁᏤᎴ ᎾᎯᏳ ᎦᎵᏦᏙᏗ ᏨᏗᎪᏢᏂᏎᎢ; ᎭᎦᏌᏯᏍᏔᏅᎭ ᏧᏛᏁᎢ, ᏕᎰᏢᏍᎬ ᏂᎦᏛ ᏧᏓᎴᏅᏛ ᎾᏍᎩᏯ ᏗᏟᎶᏍᏙᏗ ᎠᎲ ᎾᏍᎩ ᏤᏣᎾᏄᎪᏫᏎᎸ ᎣᏓᎸ ᏅᏁᎸᎭ.</title>
    <meta name="description" content="Nasgi nahna tsidunilvwisdaneha ditlilostanvhi ale udawadisdodv galvladi ehi galitsodvi, nasgiya [Unelanvhi] Mosi tsunetsele nahiyu galitsododi tsvdigotlvnisei; hagasayastanvha tsudvnei, Dehotlvsgv nigadv tsudalenvdv nasgiya ditlilosdodi ahv nasgi tsetsananugowiselv odalv nvnelvha.&#10;Who serve unto the example and shadow of heavenly things, as Moses was admonished of God when he was about to make the tabernacle: for, See, saith he, that thou make all things according to the pattern shewed to thee in the mount. [CNT]" />
