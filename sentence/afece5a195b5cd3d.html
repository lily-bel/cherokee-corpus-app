    <title>ᏰᎵᏉᏰᏃ ᏗᏕᎶᏆᏍᎩ ᏧᏪᏲᎲᏍᎩ ᎢᏧᎳᎭᏉ ᏱᎩ, ᎠᎴ ᎠᏥᏅᏏᏓᏍᏗ ᎤᏅᏏᏙᎯ ᎢᏧᎳᎭᏉ ᏱᎩ.  ᎢᏳᏰᏃ ᏧᏓᏘᎿᎭᎢ ᎠᏓᏁᎸ ᏇᎵᏥᏆ ᏳᏃᏎᎸ, ᎤᏟ ᎠᎯᏗᏳ ᎾᏍᎩ ᎢᏧᏂᏪᏎᏗᏱ ᏚᏓᏘᎿᎭᎥᎢ. (Yeliquoyeno dideloquasgi tsuweyohvsgi itsulahaquo yigi, ale atsinvsidasdi unvsidohi itsulahaquo yigi.  Iyuyeno tsudatihnai adanelv Quelitsiqua yunoselv, utli ahidiyu nasgi itsuniwesediyi dudatihnavi.) — Cherokee Corpus</title>
    <meta name="description" content="It is enough for the disciple that he be as his master, and the servant as his lord. If they have called the master of the house Beelzebub, how much more shall they call them of his household?" />
