    <title>ᎾᏍᎩᏯ ᎤᏣᏘ ᎠᏆᏚᎵᏍᎬ ᎠᎴ ᎤᏚᎩ ᎠᏋᏒᎢ, ᎾᏍᎩ ᏂᎦᎥ ᎪᎱᏍᏗ ᎠᏆᏕᎰᎯᏍᏗᏱ ᏂᎨᏒᎾ, ᏂᎦᎥᏉᏍᎩᏂ ᏂᏥᏍᎦᎢᎲᎾ ᎨᏒᎢ, ᏥᏄᏍᏙᏉ, ᎾᏍᎩᏯ ᎾᏍᏉ ᎪᎯ, ᎦᎶᏁᏛ ᏥᎸᏉᏙᏗ ᎨᏎᏍᏗ ᏥᏰᎸ ᎬᏗ, ᎾᏍᏉ ᎬᏃᏛ ᎨᏒ ᎠᎴ ᎠᎩᏲᎱᎯᏍᏗ ᎨᏒᎢ. (Nasgiya utsati aquadulisgv ale udugi aquvsvi, nasgi nigav gohusdi aquadehohisdiyi nigesvna, nigavquosgini nitsisgaihvna gesvi, tsinusdoquo, nasgiya nasquo gohi, Galonedv tsilvquododi gesesdi tsiyelv gvdi, nasquo gvnodv gesv ale agiyohuhisdi gesvi.) — Cherokee Corpus</title>
