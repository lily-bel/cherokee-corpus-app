    <title>ᎾᏍᎩ ᎢᏳᏍᏗ ᎠᎾᏓᏅᏟ ᎠᏁᎲ ᎤᏰᎵᏒᎩ ᎯᎠ ᎾᏂᏪᏍᎬᎢ, ᎾᏍᎩ ᎠᏓᏍᏓᏩᏗᏙᎯ ᎥᏝ ᎠᏛᏲᎱᏏ. ᎠᏎᏃ ᏥᏌ ᎥᏝ ᏴᏛᏲᎱᏏ ᎥᏝ ᏳᏬᏎᎴᎢ, ᎯᎠᏉᏍᎩᏂ ᏄᏪᏎᎸᎩ; ᎢᏳᏃ ᏥᎷᏨᎭ ᎬᏗᏍᎩ ᎡᎮᏍᏗ ᏯᏇᎵᏒ, ᎦᏙ ᎾᏍᎩ ᏨᏙᏗ.</title>
    <meta name="description" content="Nasgi iyusdi anadanvtli anehv uyelisvgi hia naniwesgvi, nasgi adasdawadidohi vtla advyohusi. Aseno Tsisa vtla yvdvyohusi vtla yuwoselei, hiaquosgini nuweselvgi; Iyuno tsilutsvha gvdisgi ehesdi yaquelisv, gado nasgi tsvdodi.&#10;Then went this saying abroad among the brethren, that that disciple should not die: yet Jesus said not unto him, He shall not die; but, If I will that he tarry till I come, what is that to thee? [CNT]" />
