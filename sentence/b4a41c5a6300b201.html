    <title>ᎾᎯᏳᏰᏃ ᏅᏩᏙᎯᏯᏛ ᎠᎴ ᏄᎾᏰᎯᏍᏛᎾ ᎠᎾᏗᏍᎨᏍᏗ, ᎿᎭᏉ ᏄᏰᎶᎢᏍᏔᏅᏛ ᎠᏓᏛᏗᏍᎩ ᎤᏂᎷᏤᏗ ᎨᏎᏍᏗ, ᎾᏍᎩᏯ ᎠᎩᎵᏯ ᏧᎷᏤᎰ ᎠᎨᏴ ᎦᏁᎵᏛ; ᎠᎴ ᎥᏝ ᎤᎾᏗᏫᏎᏗ ᏱᎨᏎᏍᏗ. (Nahiyuyeno nvwadohiyadv ale nunayehisdvna anadisgesdi, hnaquo nuyeloistanvdv adadvdisgi unilutsedi gesesdi, nasgiya agiliya tsulutseho ageyv ganelidv; ale vtla unadiwisedi yigesesdi.) — Cherokee Corpus</title>
