    <title>ᏇᏗᏂᏱᏃ ᎡᏙᎮᎢ, ᎠᎠᏩᏂ ᎠᏓᏰᏍᎩ ᎤᏢᏨᎯ ᎦᏁᎸᎢ, ᎦᏅᎨᏃ ᎠᎵᏍᏓᏴᎲᏍᎨᎢ, ᎠᎨᏴ ᎤᎷᏤ ᎠᏰᎮ ᎫᎫ ᏅᏯ ᎤᏁᎬ ᎪᏢᏔᏅᎯ ᎠᏟᏍᏕ ᎠᏠᏁᏗ ᎾᏓ ᏧᏙᎢᏛ, ᎤᏣᏘ ᏧᎬᏩᎶᏗ; ᎠᎴ ᎤᎶᏒ ᎫᎫ, ᎠᎴ ᎤᎶᏁᏔᏁ ᎠᏍᎪᎵ.</title>
    <meta name="description" content="Quediniyino edohei, Aawani adayesgi utlvtsvhi ganelvi, ganvgeno alisdayvhvsgei, ageyv ulutse ayehe gugu nvya unegv gotlvtanvhi atlisde atlonedi nada tsudoidv, utsati tsugvwalodi; ale ulosv gugu, ale ulonetane asgoli.&#10;And being in Bethany in the house of Simon the leper, as he sat at meat, there came a woman having an alabaster box of ointment of spikenard very precious; and she brake the box, and poured it on his head. [CNT]" />
