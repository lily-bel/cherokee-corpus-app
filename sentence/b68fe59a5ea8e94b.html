    <title>ᎿᎭᏉᏃ ᎡᎪᎢ, ᎠᎴ ᏫᏓᏯᏂᏍᎪ ᎦᎵᏉᎩ ᏗᏓᏅᏙ ᏅᏩᎾᏓᎴ ᎤᏟ ᎢᏳᏂᏁᎫᏥᏛ ᎡᏍᎦᏉ ᎤᏩᏒ; ᎾᏍᎩᏃ ᎠᏂᏴᎯᎰ ᎠᎴ ᎾᎿᎭᎠᎾᏁᎳᏗᏍᎪᎢ; ᎣᏂᏱᏃ ᏄᏍᏛ Ꮎ ᎠᏍᎦᏯ ᎤᏟ ᎤᏲᎢᏳ ᎨᏐᎢ ᎡᏍᎦᏉ ᎢᎬᏱᏱ. (Hnaquono egoi, ale widayanisgo galiquogi didanvdo nvwanadale utli iyuninegutsidv esgaquo uwasv; nasgino aniyvhiho ale nahna ananeladisgoi; oniyino nusdv na asgaya utli uyoiyu gesoi esgaquo igvyiyi.) — Cherokee Corpus</title>
