    <title>ᎤᎪᎲᏃ ᏥᏌ, ᎤᏪᎷᏁᎢ, ᎠᎴ ᎤᏓᏅᏁ ᎦᏙᎬ ᎢᎬᏱᏗᏢ, ᎠᎴ ᎠᏍᏓᏯ ᎯᎠ ᏄᏪᏎᎢ; ᎦᏙ ᏗᎩᎾᏓ-ᏛᏙᏗ, ᏥᏌ, ᎤᏁᎳᏅᎯ ᏩᏍᏛ ᎦᎸᎳᏗᏳ ᎡᎯ ᎤᏪᏥ?  ᎬᏔᏲᏎᎭ ᏞᏍᏗ ᏍᎩᎩᎸᏅᎩ. (Ugohvno Tsisa, uwelunei, ale udanvne gadogv igvyiditlv, ale asdaya hia nuwesei; Gado diginadadvdodi, Tsisa, Unelanvhi wasdv galvladiyu ehi Uwetsi?  Gvtayoseha tlesdi sgigilvnvgi.) — Cherokee Corpus</title>
