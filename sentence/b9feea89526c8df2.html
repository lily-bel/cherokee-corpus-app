    <title>ᏄᎳᏉ ᎣᏍᏛ ᏂᏍᏛ ᏣᏱᎵᏙᎯ, ᎠᏏᏉ ᎢᏍᏓᎢᏒᎢ, ᏗᎫᎪᏗᏍᎩᏱᎾᏏ ᏫᏱᏣᎧᎲᎦ ᏣᏱᎵᏙᎯ, ᏗᎫᎪᏗᏍᎩᏃ ᏗᏓᏂᏱᏍᎩᏱ ᏫᏱᏣᎧᎲᎦ, ᎠᎴ ᏗᏓᏍᏚᏗᏱ ᏱᏪᏣᏴᏓ. (Nulaquo osdv nisdv tsayilidohi, asiquo isdaisvi, digugodisgiyinasi wiyitsakahvga tsayilidohi, digugodisgino didaniyisgiyi wiyitsakahvga, ale didasdudiyi yiwetsayvda.) — Cherokee Corpus</title>
