    <title>ᎤᎵᏍᏆᎸᏗᏃ, ᎢᏓᎵᏅᏟ, ᏅᏩᏙᎯᏯᏛᏉ ᏂᏣᏛᎿᎭᏕᎨᏍᏗ. ᎪᎱᏍᏗ ᏂᏥᎪᎸᎾ ᎨᏎᏍᏗ, ᎤᎦᎵᏍᏗᏉ ᏕᏣᏓᏅᏖᏍᏗ, ᎤᏠᏱᏉ ᎨᏎᏍᏗ ᏕᏣᏓᏅᏛᎢ, ᏅᏩᏙᎯᏯᏛᏉ ᎢᏤᎮᏍᏗ; ᎤᏁᎳᏅᎯᏃ ᎠᏓᎨᏳᏗ ᎨᏒ ᎠᎴ ᏅᏩᏙᎯᏯᏛ ᎠᏓᏁᎯ ᏥᎩ, ᎢᏤᎳᏗᏙᎮᏍᏗ.</title>
    <meta name="description" content="Ulisqualvdino, idalinvtli, nvwadohiyadvquo nitsadvhnadegesdi. Gohusdi nitsigolvna gesesdi, ugalisdiquo detsadanvtesdi, utloyiquo gesesdi detsadanvdvi, nvwadohiyadvquo itsehesdi; Unelanvhino adageyudi gesv ale nvwadohiyadv adanehi tsigi, itseladidohesdi.&#10;Finally, brethren, farewell. Be perfect, be of good comfort, be of one mind, live in peace; and the God of love and peace shall be with you. [CNT]" />
