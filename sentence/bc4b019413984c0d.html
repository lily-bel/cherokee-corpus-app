    <title>ᎾᏍᎩ ᎾᏍᏉ ᏧᏩᎫᏔᏅᏒ ᏂᏗᎥ ᎨᏓᎵᎪᏁᎲᎩ ᎾᎿᎭᎢᎩᏇᏓᎸ ᎤᎬᎥᏍᎬᎢ, ᎠᎴ ᎤᏇᏓᎸ ᎠᎴ ᎠᏓᏅᏖᏗ ᎨᏒ ᎤᎾᏚᎵᏍᎬ ᏂᏓᏛᏁᎲᎩ; ᎠᎴ ᏗᎦᏕᏅ ᏂᎦᏍᏛ ᎤᏔᎳᏬᎯᏍᏗ ᎨᏒ ᏧᏪᏥ ᎨᏒᎩ, ᎾᏍᎩᏯᏉ ᎠᏂᏐᎢ ᏄᎾᏍᏛᎢ. (Nasgi nasquo tsuwagutanvsv nidiv gedaligonehvgi nahna igiquedalv ugvvsgvi, ale uquedalv ale adanvtedi gesv unadulisgv nidadvnehvgi; ale digadenv nigasdv utalawohisdi gesv tsuwetsi gesvgi, nasgiyaquo anisoi nunasdvi.) — Cherokee Corpus</title>
