    <title>ᎠᏓᏅᏙᏃ ᎠᎴ ᎠᏥᏰᎯ ᎡᎮᎾ ᎠᎾᏗᎭ.  ᎠᎴ ᎠᏛᎩᏍᎩ ᎡᎮᎾ ᎠᏗᏍᎨᏍᏗ.  ᎠᎴ ᎩᎶ ᎤᏔᏕᎩᏍᎩ ᏫᎦᎷᎩ; ᎠᎴ ᎩᎶ ᎤᏚᎵᏍᎨᏍᏗ ᎦᏁᎩᏍᎨᏍᏗ ᎠᎹ ᎬᏂᏛ ᎠᏓᏁᎯ ᏧᎬᏩᎶᏗ ᏂᎨᏒᎾ. (Adanvdono ale atsiyehi Ehena anadiha.  Ale advgisgi Ehena adisgesdi.  Ale gilo utadegisgi wigalugi; ale gilo udulisgesdi ganegisgesdi ama gvnidv adanehi tsugvwalodi nigesvna.) — Cherokee Corpus</title>
