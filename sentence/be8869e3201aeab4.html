    <title>ᎠᎨᏴᏃ ᏔᎵ ᏓᏥᏕᎸᎩ ᎠᏬᏎᎵ ᎤᏔᏅ ᏗᎧᏃᎨ, ᎾᏍᎩ ᎢᎾᎨ ᏭᏃᎯᎸᏍᏙᏗᏱ ᎠᏥᏰᎸᎾᏁᎸᎩ, ᎾᎿᎭᎤᏤᎵᎪᎯ ᏗᎨᏒᎢ, ᎾᎿᎭᎠᎨᎳᏍᏗᏱ ᏑᏕᏘᏴᏛ, ᎠᎴ ᏔᎵ ᏧᏕᏘᏴᏛ, ᎠᎴ ᎠᏰᎵ ᎢᏳᏕᏘᏴᏛ, ᎾᏍᎩ ᎠᏥᎧᎲᏍᏗᏱ ᎢᎾᏛ ᎠᎦᏔᎲᎢ.</title>
    <meta name="description" content="Ageyvno tali datsidelvgi awoseli utanv dikanoge, nasgi inage wunohilvsdodiyi atsiyelvnanelvgi, nahna utseligohi digesvi, nahna agelasdiyi sudetiyvdv, ale tali tsudetiyvdv, ale ayeli iyudetiyvdv, nasgi atsikahvsdiyi inadv agatahvi.&#10;And to the woman were given two wings of a great eagle, that she might fly into the wilderness, into her place, where she is nourished for a time, and times, and half a time, from the face of the serpent. [CNT]" />
