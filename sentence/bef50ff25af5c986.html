    <title>ᏕᎤᏒᏍᏔᏅᏰᏃ ᎢᎦ ᎾᎯᏳ ᎡᎶᎯ ᏚᏳᎪᏛ ᏧᏭᎪᏓᏁᏗᏱ, ᎬᏗᏍᎬ ᎠᏍᎦᏯ ᎾᏍᎩ ᎤᏪᎧᏅᎯ, ᏄᏜᏓᏏᏛᏒᎾ ᏂᏚᏩᏁᎸ ᎾᏂᎥ ᏴᏫ ᎾᏍᎩ ᏕᎤᎴᏔᏅᎢ ᎤᏲᎱᏒᎢ. (Deusvstanvyeno iga nahiyu elohi duyugodv tsuwugodanediyi, gvdisgv asgaya nasgi uwekanvhi, nudlasidvsvna niduwanelv naniv yvwi nasgi deuletanvi uyohusvi.) — Cherokee Corpus</title>
