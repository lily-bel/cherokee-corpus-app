    <title>ᏥᎦᏔᎲᎩ ᎠᏍᎦᏯ ᎦᎶᏁᏛ ᎪᎯᏳᎲᏍᎩ, ᎿᎭᏉ ᏂᎦᏚ ᎾᏕᏘᏴ, (ᎠᏯᎥ ᎠᏰᎸ ᎥᏝ ᏱᏥᎦᏔᎭ, ᎠᎴ ᎠᏰᎸ ᎾᏯᎥᎾ ᎨᏒ ᎥᏝ ᏱᏥᎦᏔᎭ; ᎤᏁᎳᏅᎯ ᎠᎦᏔᎭ;) ᎾᏍᎩ ᎯᎠ ᎠᎦᏘᎾᏫᏛᎲᎩ ᏦᎢᏁ ᎦᎸᎶ ᏗᎨᏒ ᏩᎦᏘᏃᎸᎩ. (Tsigatahvgi asgaya Galonedv gohiyuhvsgi, hnaquo nigadu nadetiyv, (ayav ayelv vtla yitsigataha, ale ayelv nayavna gesv vtla yitsigataha; Unelanvhi agataha;) nasgi hia agatinawidvhvgi tsoine galvlo digesv wagatinolvgi.) — Cherokee Corpus</title>
    <meta name="description" content="I knew a man in Christ above fourteen years ago, (whether in the body, I cannot tell; or whether out of the body, I cannot tell: God knoweth;) such an one caught up to the third heaven." />
