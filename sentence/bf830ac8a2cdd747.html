    <title>ᏧᎾᏁᎶᏗᏃ ᎥᏘᎣᎩ ᏧᎾᏓᏡᎬ ᎠᏁᎲᎩ ᎩᎶ ᎢᏳᎾᏍᏗ ᎠᎾᏙᎴᎰᏍᎩ ᎠᎴ ᏗᎾᏕᏲᎲᏍᎩ, ᎾᏍᎩ ᏆᏂᏆ, ᎠᎴ ᏏᎻᏂ ᎾᎦ ᏧᏙᎢᏛ, ᎠᎴ ᎷᏏᏯ ᏌᎵᏂ ᎡᎯ, ᎠᎴ ᎹᏁᏂ ᎾᏍᎩ ᎢᏧᎳᎭ ᏧᎾᏛᏒᎯ ᎡᎶᏛ ᏅᎩ ᎢᎦᏚᎩ ᎨᏒ ᏍᎦᏚᎩ ᎠᏥᎦᏘᏗᏍᏗ, ᎠᎴ ᏐᎳ. (Tsunanelodino Vtiogi tsunadatlugv anehvgi gilo iyunasdi anadolehosgi ale dinadeyohvsgi, nasgi Quaniqua, ale Simini Naga tsudoidv, ale Lusiya Salini ehi, ale Maneni nasgi itsulaha tsunadvsvhi Elodv nvgi igadugi gesv sgadugi atsigatidisdi, ale Sola.) — Cherokee Corpus</title>
