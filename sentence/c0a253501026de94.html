    <title>ᏥᏌ ᎯᎠ ᏄᏪᏒᎩ; ᎠᎩᎬᏫᏳᎯ ᎨᏒ ᎥᏝ ᎠᏂ ᎡᎶᎯ ᎡᎯ ᏱᎩ. ᎢᏳᏃ ᎠᎩᎬᏫᏳᎯ ᎨᏒ ᎠᏂ ᎡᎶᎯ ᎡᎯ ᏱᎨᏎᎢ, ᏗᏆᏤᎵᎦ ᏱᏚᎾᏟᏴᎮᎢ, ᏞᏍᏗ ᎠᏂᏧᏏ ᏗᎨᏥᏲᎯᏎᎸᎩ, ᏳᏁᎵᏎᎢ. ᎠᏎᏃ ᎥᏝ ᎠᏂ ᎤᏓᎴᏅᎯ ᏱᎩ ᎠᎩᎬᏫᏳᎯ ᎨᏒᎢ.</title>
    <meta name="description" content="Tsisa hia nuwesvgi; Agigvwiyuhi gesv vtla ani elohi ehi yigi. Iyuno agigvwiyuhi gesv ani elohi ehi yigesei, diquatseliga yidunatliyvhei, tlesdi Anitsusi digetsiyohiselvgi, yunelisei. Aseno vtla ani udalenvhi yigi agigvwiyuhi gesvi.&#10;Jesus answered, My kingdom is not of this world: if my kingdom were of this world, then would my servants fight, that I should not be delivered to the Jews: but now is my kingdom not from hence. [CNT]" />
