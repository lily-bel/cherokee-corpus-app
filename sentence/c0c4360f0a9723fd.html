    <title>ᎠᏏᏃ ᎤᏃᏒᎩ ᎧᏃᎯᏰᎩ ᏗᎵᏍᏓᏴᏗᏱ, ᏥᏌ ᎠᎦᏔᎯᏳ ᎨᏒᎩ ᎤᏍᏆᎸᎡᎸ ᎠᏂ ᎡᎶᎯ ᎤᏓᏅᏍᏗᏱ, ᎠᎦᏴᎵᎨᏍᏛᏱ ᏭᎶᎯᏍᏗᏱ, ᏧᎨᏳᎯᏳ ᎢᏳᎵᏍᏔᏅᎯ ᎨᏒᎩ ᏧᏤᎵᎦ ᎡᎶᎯ ᎠᏁᎯ, ᎬᎵᏍᏆᏗᏍᎩ ᏧᎨᏳᎯᏳ ᎨᏒᎩ. (Asino unosvgi kanohiyegi dilisdayvdiyi, Tsisa agatahiyu gesvgi usqualvelv ani elohi udanvsdiyi, Agayvligesdvyi wulohisdiyi, tsugeyuhiyu iyulistanvhi gesvgi tsutseliga elohi anehi, gvlisquadisgi tsugeyuhiyu gesvgi.) — Cherokee Corpus</title>
