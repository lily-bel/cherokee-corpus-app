    <title>ᏗᏂᏲᎵᏉ ᎾᏍᎩᏯ ᎦᏃᏙᏗᏱ ᏣᏂᏃᎢ, ᎠᎴ ᏥᏫᏓᎾᏓᏯᏂᏍᎪᎢ, ᎯᎠ ᏥᏫᎾᏂᏪᏍᎪᎢ; ᎠᏤᎷᎩ ᎣᎬᏔᏅ ᏕᏨᏃᎩᎡᎸ, ᎠᏎᏃ ᎥᏝ ᏱᏣᎵᏍᎩᏎᎢ; ᏙᏥᏴᎬ ᎢᏣᏛᎪᏗ, ᎠᏎᏃ ᎥᏝ ᏱᏗᏣᏠᏱᎴᎢ. (Diniyoliquo nasgiya ganododiyi tsaninoi, ale tsiwidanadayanisgoi, hia tsiwinaniwesgoi; Atselugi ogvtanv detsvnogielv, aseno vtla yitsalisgisei; dotsiyvgv itsadvgodi, aseno vtla yiditsatloyilei.) — Cherokee Corpus</title>
