    <title>ᏗᏣᎧᏅᎦ ᏥᏍᏆ ᎦᎸᎶᎢ ᎠᏁᎯ, ᏝᏰᏃ ᏯᏂᏫᏍᎪᎢ, ᎠᎴ Ꮭ ᏯᏂᏁᏣᎢᏍᎪᎢ, Ꮭ ᎠᎴ ᏓᏓᏁᎸ ᏯᏂᏟᏏᏍᎪᎢ, ᎠᏎᏃ ᎢᏥᏙᏓ ᎦᎸᎳᏗ ᎡᎯ ᏙᎨᎶᎰᎢ.  ᏝᏍᎪ ᏂᎯ ᎤᏟ ᏱᏁᏥᎸᏉᏗ ᎡᏍᎦᏉ ᎾᏍᎩ? (Ditsakanvga tsisqua galvloi anehi, tlayeno yaniwisgoi, ale tla yaninetsaisgoi, tla ale dadanelv yanitlisisgoi, aseno Itsidoda galvladi ehi dogelohoi.  Tlasgo nihi utli yinetsilvquodi esgaquo nasgi?) — Cherokee Corpus</title>
