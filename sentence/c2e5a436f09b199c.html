    <title>ᎾᏍᎩ ᎢᏳᏍᏗ ᎠᏂᏐᎢ ᎠᎾᏓᏍᏓᏩᏗᏙᎯ ᎯᎠ ᏂᎬᏩᏪᏎᎸᎩ; ᎣᏥᎪᎥ ᎤᎬᏫᏳᎯ. ᎠᏎᏃ ᎯᎠ ᏂᏚᏪᏎᎸᎩ; ᎥᏝ ᏴᎦᎪᎢᏳᎲᎦ ᎬᏂ ᏧᏬᏰᏂ ᏴᎩ ᏚᏰᎸᏒ ᏱᏓᎩᎪᎲ, ᎠᎴ ᏥᏰᏌᏛ ᏯᏋᏔᏅ ᏯᎩᏃᏟᏍᏔᏅ ᏴᎩ ᏚᏰᎸᏒᎢ, ᎠᎴ ᎠᏍᏆᎨᏂ ᏯᏆᏐᎾᏛ.</title>
    <meta name="description" content="Nasgi iyusdi anisoi anadasdawadidohi hia nigvwaweselvgi; Otsigov Ugvwiyuhi. Aseno hia niduweselvgi; Vtla yvgagoiyuhvga gvni tsuwoyeni yvgi duyelvsv yidagigohv, ale tsiyesadv yaquvtanv yaginotlistanv yvgi duyelvsvi, ale asquageni yaquasonadv.&#10;The other disciples therefore said unto him, We have seen the Lord. But he said unto them, Except I shall see in his hands the print of the nails, and put my finger into the print of the nails, and thrust my hand into his side, I will not believe. [CNT]" />
