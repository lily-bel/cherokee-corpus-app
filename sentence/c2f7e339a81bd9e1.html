    <title>ᏕᏥᎸᏫᏍᏓᏁᎲ ᏞᏍᏗ ᏧᎬᏩᎶᏗ ᎠᎬᎥᎯᏍᏗ ᎨᏒ ᏳᎵᏠᏯᏍᏕᏍᏗ; ᎠᎴ ᏰᎵᏉ ᎢᏥᏰᎵᏎᏍᏗ ᏄᏍᏛ ᎪᎱᏍᏗ ᎢᏥᎲᎢ; ᎯᎠᏰᏃ ᎢᏳᏪᏛ ᎢᎩ, ᎥᏝ ᎢᎸᎯᏳ ᎤᏁᎳᎩ ᏴᎦᎬᏰᎵᏏ, ᎥᏝ ᎠᎴ ᏴᎦᎬᏴᏕᎩ. (Detsilvwisdanehv tlesdi tsugvwalodi agvvhisdi gesv yulitloyasdesdi; ale yeliquo itsiyelisesdi nusdv gohusdi itsihvi; hiayeno iyuwedv igi, Vtla ilvhiyu unelagi yvgagvyelisi, vtla ale yvgagvyvdegi.) — Cherokee Corpus</title>
