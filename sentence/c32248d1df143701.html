    <title>ᎾᏍᎩ ᏥᏌ ᎦᎶᏁᏛ ᎠᎩᏅᏏᏙᎯ ᎢᏯᏆᎵᏍᏙᏗᏱ ᏧᎾᏓᎴᏅᏛ ᏴᏫ ᎠᏁᎲᎢ, ᎦᎸᏉᏗᏳ ᏓᎩᎸᏫᏍᏓᏁᎲ ᎣᏍᏛ ᎧᏃᎮᏛ ᎤᏁᎳᏅᎯ ᎤᏤᎵᎦ ᎬᏗᏍᎬᎢ, ᎾᏍᎩ ᎦᎵᏍᎪᎸᏗᏍᎬ ᏧᎾᏓᎴᏅᏛ ᏴᏫ ᎦᏥᏯᎵᏍᎪᎸᏗᏍᎬᎢ ᏧᏓᏂᎸᎢᏍᏗ ᎢᏳᎵᏍᏙᏗᏱ, ᎦᎸᏉᏗᏳ ᎢᏳᏩᏁᎸᎯ ᎦᎸᏉᏗᏳ ᎠᏓᏅᏙ. (Nasgi Tsisa Galonedv aginvsidohi iyaqualisdodiyi tsunadalenvdv yvwi anehvi, galvquodiyu dagilvwisdanehv osdv kanohedv Unelanvhi utseliga gvdisgvi, nasgi galisgolvdisgv tsunadalenvdv yvwi gatsiyalisgolvdisgvi tsudanilvisdi iyulisdodiyi, galvquodiyu iyuwanelvhi galvquodiyu Adanvdo.) — Cherokee Corpus</title>
