    <title>ᎾᏍᎩ ᏗᏥᏲᎯᏍᏗᏱ ᎠᎵᏍᏓᏴᏗ ᎤᏁᎳᏅᎯ ᏗᏰᎸᎯ ᏗᎵᏍᎪᎸᏓᏁᎸᎯ, ᎠᎴ ᎩᎬ, ᎠᎴ ᎪᎱᏍᏗ ᎬᏬᏍᏔᏅᎯ, ᎠᎴ ᎤᏕᎵᏛ ᏗᏂᏏᏗ ᎨᏒᎢ. ᎢᏳᏃ ᎾᏍᎩ ᏱᏗᏤᏯᏙᏤᎸ ᎣᏏᏳ ᏱᏂᏣᏛᎦ. ᏙᎯᏱ ᏂᏣᏛᎿᎭᏕᎨᏍᏗ.</title>
    <meta name="description" content="Nasgi ditsiyohisdiyi alisdayvdi Unelanvhi diyelvhi dilisgolvdanelvhi, ale gigv, ale gohusdi gvwostanvhi, ale udelidv dinisidi gesvi. Iyuno nasgi yiditseyadotselv osiyu yinitsadvga. Dohiyi nitsadvhnadegesdi.&#10;That ye abstain from meats offered to idols, and from blood, and from things strangled, and from fornication: from which if ye keep yourselves, ye shall do well. Fare ye well. [CNT]" />
