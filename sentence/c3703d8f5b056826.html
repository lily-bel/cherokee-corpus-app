    <title>ᏗᏣᎧᏅᎦ ᏗᏉᏰᏂ ᎠᎴ ᏗᏆᎳᏏᏕᏂ, ᎠᏋᏒᏉ ᎯᎠ ᏥᎾᏆᏛᏅ; ᏍᎩᏯᏒᏂᎦ ᎠᎴ ᎢᏣᏙᎴᎰᎯ; ᎠᏓᏅᏙᏰᏃ ᎥᏝ ᏳᏇᏓᎳ, ᎠᎴ ᎥᏝ ᏧᎪᎳ ᏱᏚᎸ ᎾᏍᎩᏯ ᏥᏥᎪᏩᏘᎭ ᎠᏴ ᏂᏓᏋᏅᎢ. (Ditsakanvga diquoyeni ale diqualasideni, aquvsvquo hia tsinaquadvnv; sgiyasvniga ale itsadolehohi; adanvdoyeno vtla yuquedala, ale vtla tsugola yidulv nasgiya tsitsigowatiha ayv nidaquvnvi.) — Cherokee Corpus</title>
