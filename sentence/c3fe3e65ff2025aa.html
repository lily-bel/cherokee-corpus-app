    <title>ᎠᏴᏰᏃ ᎯᎠ ᎠᏂ ᎦᎵᏦᏛ ᏦᏥᏯᎠ ᎣᎩᎵᏰᏗᎭ, ᏂᎦᎵᏍᏙᏗᎭ ᎦᎨᏛ ᏃᎦᏛᎿᎭᏕᎬᎢ; ᎥᏝ ᏦᎩᏄᏪᏍᏗᏱ ᎣᎦᏚᎵᏍᎬ ᏱᏅᏗᎦᎵᏍᏙᏗᎭ; ᏦᎩᏄᏬᏍᏗᏱᏍᎩᏂ; ᎾᏍᎩ ᎠᏲᎱᏍᎩ ᎨᏒ ᎠᏥᎩᏍᏗᏱ ᎬᏂᏛ ᎤᎩᏐᎲᏍᏗᏱ.</title>
    <meta name="description" content="Ayvyeno hia ani galitsodv tsotsiyaa ogiliyediha, nigalisdodiha gagedv nogadvhnadegvi; vtla tsoginuwesdiyi ogadulisgv yinvdigalisdodiha; tsoginuwosdiyisgini; nasgi ayohusgi gesv atsigisdiyi gvnidv ugisohvsdiyi.&#10;For we that are in this tabernacle do groan, being burdened: not for that we would be unclothed, but clothed upon, that mortality might be swallowed up of life. [CNT]" />
