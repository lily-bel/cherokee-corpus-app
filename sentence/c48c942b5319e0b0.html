    <title>ᎠᎴ ᎥᏝ ᎾᏍᎩᏉ ᏱᏂᎦᎥ, ᎾᏍᏉᏍᎩᏂ ᏚᎾᏓᏡᏩᏗᏒ ᏧᎾᏁᎶᏗ ᎬᏩᏑᏰᏒᎩ ᎠᏴ ᎢᏧᎳᎭ ᎣᎨᏅᏍᏗᏱ ᎣᎩᏴᏍᏗᏱ ᎯᎠ ᎾᏍᎩ ᎠᏓᏁᏗ, ᎾᏍᎩ ᏥᏙᎩᎸᏫᏍᏓᏁᎭ, ᎦᎸᏉᏗᏳ ᎢᏳᎵᏍᏙᏗᏱ ᎤᎬᏫᏳᎯ ᎤᏩᏒ, ᎠᎴ  ᎢᏣᎵᎦᎵᏴᏒ ᏙᏗᏣᏓᏅᏛᎢ; (Ale vtla nasgiquo yinigav, nasquosgini dunadatluwadisv tsunanelodi gvwasuyesvgi ayv itsulaha ogenvsdiyi ogiyvsdiyi hia nasgi adanedi, nasgi tsidogilvwisdaneha, galvquodiyu iyulisdodiyi Ugvwiyuhi uwasv, ale [gvnigesv igvwanediyi] itsaligaliyvsv doditsadanvdvi;) — Cherokee Corpus</title>
