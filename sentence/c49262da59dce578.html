    <title>ᎾᏍᎩ Ꮎ ᎪᎯᏳᎲᏍᎩ  ᎤᏪᏥ, ᎾᏍᎩ ᎬᏂᏛ ᎠᎵᏍᏆᏗᏍᎩ ᏁᎨᏒᎾ ᎤᏤᎵᎦ, ᎾᏍᎩᏍᎩᏂ ᎤᏪᏥ ᎪᎯᏳᎲᏍᎩ ᏂᎨᏒᎾ ᎥᏝ ᎬᏂᏛ ᎤᎪᏩᏛᏗ ᏱᎩ; ᎤᏁᎳᏅᎯᏉᏍᎩᏂ ᎤᏔᎳᏬᎯᏍᏗ ᎨᏒ ᎤᎵᏃᎯᏰᎭ. (Nasgi na gohiyuhvsgi [Unelanvhi] Uwetsi, nasgi gvnidv alisquadisgi negesvna utseliga, nasgisgini Uwetsi gohiyuhvsgi nigesvna vtla gvnidv ugowadvdi yigi; Unelanvhiquosgini utalawohisdi gesv ulinohiyeha.) — Cherokee Corpus</title>
