    <title>ᎪᎯᏍᎩᏂ ᎨᏒ ᏗᎧᎿᎭᏩᏛᏍᏗ ᎡᏓᏚᏓᎳᎡᎸ, ᏅᏗᎦᎵᏍᏙᏗᎭ ᎤᏲᎱᏒᎯ ᎨᏒ ᏗᎩᎾᏢᏅᎯ ᎨᏒᎢ; ᎾᏍᎩ ᎢᏤ ᎠᏓᏅᏙ ᎢᎬᏙᏗᏱ ᎪᎱᏍᏗ ᎡᏓᏛᏁᏗᏱ, ᎥᏝᏃ ᎪᏪᎸᏉ ᎢᎬᏙᏗᏱ ᎾᏍᎩᏯ ᏂᎦᏛᏁᎸ ᏧᏩᎫᏔᏅᏒᎢ. (Gohisgini gesv dikahnawadvsdi edadudalaelv, nvdigalisdodiha uyohusvhi gesv diginatlvnvhi gesvi; nasgi itse adanvdo igvdodiyi gohusdi edadvnediyi, vtlano gowelvquo igvdodiyi nasgiya nigadvnelv tsuwagutanvsvi.) — Cherokee Corpus</title>
