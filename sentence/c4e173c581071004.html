    <title>ᎯᎠᏃ ᎾᎩᏪᏎᎸᎩ, ᎥᏞᏍᏗ.  ᎠᏴᏰᏃ ᎤᏠᏱᏉ ᎡᎩᏂᏅᏏᏓᏍᏗ, ᎠᎴ ᎠᏴ ᎾᏍᎩ ᎠᎾᏙᎴᎰᏍᎩ ᏥᎨᏒ ᎢᏣᎵᏅᏟ, ᎠᎴ ᎾᏍᎩ ᎠᏂᏍᏆᏂᎪᏗᏍᎩ ᎧᏃᎮᏛ ᎠᏂ ᎪᏪᎵᎯ ᎪᏪᎸᎢ; ᎤᏁᎳᏅᎯ ᎯᏯᏓᏙᎵᏍᏓᏏ. (Hiano nagiweselvgi, Vtlesdi.  Ayvyeno utloyiquo egininvsidasdi, ale ayv nasgi anadolehosgi tsigesv itsalinvtli, ale nasgi anisquanigodisgi kanohedv ani gowelihi gowelvi; unelanvhi hiyadadolisdasi.) — Cherokee Corpus</title>
