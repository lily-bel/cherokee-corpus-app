    <title>ᎠᎴ ᎥᏝ ᎾᏍᎩᏯ ᎠᏏᏴᏫᏉ ᎤᏍᎦᏅᏨᎯ ᎢᏳᏩᏂᏌᏛ  ᎾᏍᎩᏯ ᏱᏄᏍᏗ ᎤᏓᏁᏗ ᎨᏒᎢ; ᎠᏍᎦᏅᏨᏰᏃ ᏗᎫᎪᏙᏗ ᎨᏒ ᏌᏉᏉ ᎢᏯᏍᎦᏅᏨᎯ ᏅᏓᏳᏓᎴᏅᎯ; ᎬᏩᎦᏘᏯᏍᎩᏂ ᎤᏓᏁᏗ ᎨᏒ ᎤᏣᏘ ᎢᏯᏍᎦᏅᏨᎯ ᎠᏚᏓᎴᏍᏙᏗ ᎤᎬᏩᎳ. (Ale vtla nasgiya asiyvwiquo usganvtsvhi iyuwanisadv [digegugodanedi tsinulistane] nasgiya yinusdi udanedi gesvi; Asganvtsvyeno digugododi gesv saquoquo iyasganvtsvhi nvdayudalenvhi; Gvwagatiyasgini udanedi gesv utsati iyasganvtsvhi adudalesdodi ugvwala.) — Cherokee Corpus</title>
