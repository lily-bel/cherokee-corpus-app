    <title>ᏥᎦᏔᎭ ᏄᏍᏛ ᏕᏣᎸᏫᏍᏓᏁᎲᎢ, ᎠᎴ ᎤᏕᏯᏙᏗ ᏂᏣᎵᏍᏓᏁᎲᎢ, ᎠᎴ ᎤᏲ ᏂᏣᏛᎿᎭᏕᎬᎢ,^ᎠᏎᏃ ᏤᎿᎭᎢᏳ. ᎠᎴ ᏥᎦᏔᎭ ᎾᏍᎩ ᎤᏂᏐᏢᎢᏍᏙᏗ ᎨᏒ ᎣᏥᏧᏏ ᎠᎾᏗᏍᎩ, ᎾᏍᎩᏃ ᏄᏍᏛᎾ ᏥᎩ, ᏎᏓᏂᏉᏍᎩᏂ ᎤᏤᎵ ᏗᎦᎳᏫᎢᏍᏗᏱ ᎠᏁᎳ ᏥᎩ.</title>
    <meta name="description" content="Tsigataha nusdv detsalvwisdanehvi, ale udeyadodi nitsalisdanehvi, ale uyo nitsadvhnadegvi,^aseno tsehnaiyu. Ale tsigataha nasgi unisotlvisdodi gesv Otsitsusi anadisgi, nasgino nusdvna tsigi, Sedaniquosgini utseli digalawiisdiyi anela tsigi.&#10;I know thy works, and tribulation, and poverty, (but thou art rich) and I know the blasphemy of them which say they are Jews, and are not, but are the synagogue of Satan. [CNT]" />
