    <title>ᏂᎯᏍᎩᏂ ᎯᎠ ᏂᏥᏪᎭ, ᎢᏳᏃ ᎩᎶ ᎯᎠ ᏂᎦᏪᏎᎮᏍᏗ ᎤᏙᏓ ᎠᎴ ᎤᏥ, ᎪᏆᏂ, (ᎾᏍᎩ ᎦᏛᎬ, ᎠᏆᎵᏍᎪᎸᏔᏅᎯ,) ᏂᎦᎥ ᎨᏣᎵᏍᏕᎸᏙᏗ ᎨᏒ ᎠᏴ ᎬᏍᏕᎵᏍᎬᎢ; [ᎾᏍᎩ ᎤᏚᏓᎴᏛ ᎨᏎᏍᏗ.] (Nihisgini hia nitsiweha, Iyuno gilo hia nigawesehesdi udoda ale utsi, Goquani, (nasgi gadvgv, aqualisgolvtanvhi,) nigav getsalisdelvdodi gesv ayv gvsdelisgvi; [nasgi ududaledv gesesdi.]) — Cherokee Corpus</title>
