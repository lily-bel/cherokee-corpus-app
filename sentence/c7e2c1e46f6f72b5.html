    <title>ᎯᎠᏃ ᏂᏚᏪᏎᎸᎩ; ᎤᏙᎯᏳᎯ ᎠᏆᏤᎵ ᎤᎵᏍᏈᏗ ᎠᏟᏍᏛ ᏓᏣᏗᏔᎯ, ᎠᎴ ᎠᏴ ᎥᏆᏬᏍᏙᏗ ᎨᏒ ᏙᏓᏰᏣᏬᏍᏔᏂ.  ᏥᎦᏘᏏᏍᎩᏂ ᎠᎴ ᏥᎦᏍᎦᏂ ᎩᎶ ᎤᏪᏗᏱ ᎥᏝ ᎠᏴ ᎠᏆᏓᏁᏗ ᏱᎩ, ᎨᏥᏁᏗᏍᎩᏂᏃᏅ ᎨᏎᏍᏗ ᎾᏍᎩ ᎡᏙᏓ ᏧᏓᏁᎳᏁᎸᎯ. (Hiano niduweselvgi; Udohiyuhi aquatseli ulisquidi atlisdv datsaditahi, ale ayv vquawosdodi gesv dodayetsawostani.  Tsigatisisgini ale tsigasgani gilo uwediyi vtla ayv aquadanedi yigi, getsinedisgininonv gesesdi nasgi Edoda tsudanelanelvhi.) — Cherokee Corpus</title>
