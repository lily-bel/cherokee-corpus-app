    <title>ᏥᏗᎦᏔᎭᏍᎩᏂ ᎾᏍᎩ ᏴᏫ ᏗᎧᎿᎭᏩᏛᏍᏗ ᏂᎦᏪᏍᎬ ᎾᏛᏁᎲ ᎾᏚᏓᎴᏍᏗᏍᎬᎾ ᎨᏒᎢ, ᎪᎯᏳᏗᏍᎩᏂ ᎨᏒ ᏥᏌ ᎦᎶᏁᏛ, ᎾᏍᎩ ᎠᏴ ᎡᏙᎢᏳᏅ ᏥᏌ ᎦᎶᏁᏛ, ᎾᏍᎩ ᎢᎦᏚᏓᎴᏍᏙᏗᏱ ᎪᎯᏳᏗ ᎨᏒ ᎦᎶᏁᏛ, ᎥᏝᏃ ᏗᎧᎿᎭᏩᏛᏍᏗ ᏂᎦᏪᏍᎬ ᏂᏓᏛᏁᎲᎢ; ᏗᎧᎿᎭᏩᏛᏍᏗᏰᏃ ᏂᎦᏪᏍᎬ ᎾᏛᏁᎲ ᎥᏝ ᎩᎶ ᎤᏇᏓᎵ ᏴᎬᏚᏓᎴᏍᏓ.</title>
    <meta name="description" content="Tsidigatahasgini nasgi yvwi dikahnawadvsdi nigawesgv nadvnehv nadudalesdisgvna gesvi, gohiyudisgini gesv Tsisa Galonedv, nasgi ayv edoiyunv Tsisa Galonedv, nasgi igadudalesdodiyi gohiyudi gesv Galonedv, vtlano dikahnawadvsdi nigawesgv nidadvnehvi; dikahnawadvsdiyeno nigawesgv nadvnehv vtla gilo uquedali yvgvdudalesda.&#10;Knowing that a man is not justified by the works of the law, but by the faith of Jesus Christ, even we have believed in Jesus Christ, that we might be justified by the faith of Christ, and not by the works of the law: for by the works of the law shall no flesh be justified. [CNT]" />
