    <title>ᎾᏍᎩᏃ ᏂᎦᎥ ᏧᏓᎴᏅᏛ ᎤᏣᏘ ᏥᏥᎭ, ᎾᏍᎩ ᎪᎯᏳᏗ ᎨᏒᎢ, ᎠᎴ ᎦᏬᏂᎯᏍᏗ ᎨᏒᎢ, ᎠᎴ ᎠᎦᏙᎥᎯᏍᏗ ᎨᏒᎢ, ᎠᎴ ᏂᎦᎥ ᏧᏓᎴᏅᏛ ᎢᏥᎦᎵᏴᎢ, ᎠᎴ ᎠᏴ ᏍᎩᎨᏳᎢᏳ ᎨᏒᎢ, ᎯᎠ ᎾᏍᎩ ᎠᏓᏁᏗ ᎨᏒ ᎾᏍᏉ ᎤᏣᏘ ᎢᏥᎮᏍᏗ.</title>
    <meta name="description" content="Nasgino nigav tsudalenvdv utsati tsitsiha, nasgi gohiyudi gesvi, ale gawonihisdi gesvi, ale agadovhisdi gesvi, ale nigav tsudalenvdv itsigaliyvi, ale ayv sgigeyuiyu gesvi, hia nasgi adanedi gesv nasquo utsati itsihesdi.&#10;Therefore, as ye abound in every thing, in faith, and utterance, and knowledge, and in all diligence, and in your love to us, see that ye abound in this grace also. [CNT]" />
