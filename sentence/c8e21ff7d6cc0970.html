    <title>ᎢᏳᏃ ᎡᎶᎯ ᎢᏣᎵᎪᎯ ᏱᎨᏎᎢ, ᎡᎶᎯ ᏧᎨᏳᎯᏳ ᏱᎨᏎ ᏧᏤᎵᎦ.  ᎠᏎᏃ ᎡᎶᎯ ᎢᏣᎵᎪᎯ ᏂᎨᏒᎾ ᏥᎩ, ᎢᏨᏯᏑᏰᏛᏍᎩᏂ ᎡᎶᎯ ᏥᎩ, ᎾᏍᎩ ᏅᏗᎦᎵᏍᏙᏗᎭ ᎡᎶᎯ ᎢᏥᏍᎦᎦ. (Iyuno elohi itsaligohi yigesei, elohi tsugeyuhiyu yigese tsutseliga.  Aseno elohi itsaligohi nigesvna tsigi, itsvyasuyedvsgini elohi tsigi, nasgi nvdigalisdodiha elohi itsisgaga.) — Cherokee Corpus</title>
