    <title>ᎤᎬᏫᏳᎯᏰᏃ ᎾᏍᎩ ᎯᎠ ᎠᎦᏔᎭ, ᎾᏍᎩ ᎾᏍᏉ ᎤᏛᏓᏍᏛ ᏂᏥᏍᎦᎢᎲᎾ ᏥᏥᏁᎦ; ᏥᎦᏔᎭᏰᏃ ᎯᎠ ᎾᏍᎩ ᎪᎱᏍᏗ ᎠᎬᏍᎦᎳᏁᎸᎯ ᏂᎨᏒᎾ ᎨᏒᎢ, ᏞᏰᏃ ᎤᏅᏏᏴ ᎯᎠ ᏗᎦᎸᏫᏍᏓᏁᎸᎯ ᏱᎩ. (Ugvwiyuhiyeno nasgi hia agataha, nasgi nasquo udvdasdv nitsisgaihvna tsitsinega; tsigatahayeno hia nasgi gohusdi agvsgalanelvhi nigesvna gesvi, tleyeno unvsiyv hia digalvwisdanelvhi yigi.) — Cherokee Corpus</title>
