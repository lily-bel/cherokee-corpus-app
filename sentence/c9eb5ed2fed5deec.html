    <title>ᎠᎴ ᏓᏆᎧᎾᏅᎩ, ᎠᎴ ᎠᏆᏛᎦᏅᎩ ᏗᎧᎿᎭᏩᏗᏙᎯ ᎦᎸᎶᎢ ᎠᏰᎵ ᎦᏃᎯᎵᏒᎩ ᎠᏍᏓᏯ ᎤᏪᎷᎬᎩ ᎯᎠ ᏂᎦᏪᏍᎬᎩ, ᎤᏲᎢᏳ, ᎤᏲᎢᏳ ᎤᏲᎢᏳ ᎢᏳᎾᎵᏍᏓᏁᏗ ᎡᎶᎯ ᏓᏁᏩᏗᏒᎢ, ᏅᏗᎦᎵᏍᏙᏗᎭ ᏗᏐᎢ ᎠᏤᎷᎩ ᏗᏤᎷᎯᏍᏗ ᎨᏒ ᎾᏍᎩ ᏗᏂᎧᎿᎭᏩᏗᏙᎯ ᏦᎢ ᎢᏯᏂᏛ ᏓᏂᏁᎲᎢ, ᎠᏏ ᏧᏂᏤᎷᎯᏍᏗ ᏥᎩ. (Ale daquakananvgi, ale aquadvganvgi dikahnawadidohi galvloi ayeli ganohilisvgi asdaya uwelugvgi hia nigawesgvgi, Uyoiyu, uyoiyu uyoiyu iyunalisdanedi elohi danewadisvi, nvdigalisdodiha disoi atselugi ditseluhisdi gesv nasgi dinikahnawadidohi tsoi iyanidv daninehvi, asi tsunitseluhisdi tsigi.) — Cherokee Corpus</title>
