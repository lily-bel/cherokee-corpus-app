    <title>ᏕᎬᏩᏒᏍᏓᏁᎸᏃ, ᎤᏂᏣᏛ ᎬᏩᎷᏤᎸᎩ ᎤᏪᏗᏱ; ᎾᏍᎩ ᎬᏂᎨᏒ ᏂᏚᏩᏁᎸᎩ, ᏚᏃᎮᎮᎸᎩ ᎤᏁᎳᏅᎯ ᎤᎬᏫᏳᎯ ᎨᏒᎢ, ᏑᎾᎴ ᎤᎴᏅᏛ ᎤᏒᎢ ᎬᏗᏍᎩ, ᏓᏍᏗᏰᏗᏍᎬ ᏥᏌ ᎧᏃᎮᏍᎬᎢ; ᏕᎬᏗᏍᎬ ᏗᎧᎿᎭᏩᏛᏍᏗ ᎼᏏ ᎤᏤᎵᎦ ᎠᎴ ᎠᎾᏙᎴᎰᏍᎩ.</title>
    <meta name="description" content="Degvwasvsdanelvno, unitsadv gvwalutselvgi uwediyi; nasgi gvnigesv niduwanelvgi, dunohehelvgi Unelanvhi ugvwiyuhi gesvi, sunale ulenvdv usvi gvdisgi, dasdiyedisgv Tsisa kanohesgvi; degvdisgv dikahnawadvsdi Mosi utseliga ale anadolehosgi.&#10;And when they had appointed him a day, there came many to him into his lodging; to whom he expounded and testified the kingdom of God, persuading them concerning Jesus, both out of the law of Moses, and out of the prophets, from morning till evening. [CNT]" />
