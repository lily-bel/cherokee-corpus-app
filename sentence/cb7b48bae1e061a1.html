    <title>ᎾᏍᎩ ᎢᏳᏍᏗ ᏂᎦᏗᏳ ᏗᎫᏴᎡᏗ ᎨᏒ ᏕᏣᎫᏴᎡᎮᏍᏗ; ᎠᏰᎵ ᎡᏣᎫᏴᎡᏗ ᎨᏒ ᎠᏰᎵ ᎡᏣᎫᏴᎡᎮᏍᏗ; ᎢᏥᏃᏔᏅᏗᏱ ᎢᏣᎵᏍᎪᎸᏓᏁᎸ ᎡᏣᎫᏴᎡᏗ ᎨᏒ ᎡᏣᎫᏴᎡᎮᏍᏗ; ᎾᏍᎩ ᎡᏥᎾᏰᎢᏍᏗ ᎨᏒ ᎾᏍᎩ Ꮎ ᎡᏥᎾᏰᏍᎨᏍᏗ; ᎾᏍᎩ ᎡᏥᎸᏉᏙᏗ ᎨᏒ ᎾᏍᎩ Ꮎ ᎡᏥᎸᏉᏕᏍᏗ. (Nasgi iyusdi nigadiyu diguyvedi gesv detsaguyvehesdi; ayeli etsaguyvedi gesv ayeli etsaguyvehesdi; itsinotanvdiyi itsalisgolvdanelv etsaguyvedi gesv etsaguyvehesdi; nasgi etsinayeisdi gesv nasgi na etsinayesgesdi; nasgi etsilvquododi gesv nasgi na etsilvquodesdi.) — Cherokee Corpus</title>
