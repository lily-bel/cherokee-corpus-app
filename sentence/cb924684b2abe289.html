    <title>ᎤᏲᎢᏳ ᎢᏣᎵᏍᏓᏁᏗ ᏗᏦᏪᎵᏍᎩ ᎠᎴ ᎢᏥᏆᎵᏏ ᎢᏣᏠᎾᏍᏗ!  ᎾᏍᎩᏯᏉᏰᏃ ᏂᎯ ᏧᏁᎬ ᎢᏗᎬᏁᎸᎯ ᏓᏤᎵᏍᏛᎢ, ᎾᏍᎩ ᎦᏚᎢᏗᏢ ᎤᏙᎯᏳᎯ ᏧᏬᏚᎯᏳ ᏥᎨᏐᎢ, ᎠᏎᏃ ᎠᏫᏂᏗᏢ ᏧᎧᎵᏨᎯ ᏥᎨᏐ ᏧᏂᏲᎱᏒᎯ ᏧᏂᎪᎳ ᎠᎴ ᏂᎦᎥ ᎦᏓᎭ ᎨᏒᎢ (Uyoiyu itsalisdanedi ditsowelisgi ale Itsiqualisi itsatlonasdi!  nasgiyaquoyeno nihi tsunegv idigvnelvhi datselisdvi, nasgi gaduiditlv udohiyuhi tsuwoduhiyu tsigesoi, aseno awiniditlv tsukalitsvhi tsigeso tsuniyohusvhi tsunigola ale nigav gadaha gesvi) — Cherokee Corpus</title>
