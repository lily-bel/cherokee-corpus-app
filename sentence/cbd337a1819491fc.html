    <title>ᎿᎭᏉᏃ ᎾᎯᏳ ᎢᎦ ᎤᏒᎢ, ᎠᎴᏂᏍᎬ ᏑᎾᏙᏓᏆᏍᏗ ᎨᏒᎢ, ᎦᎶᎯᏍᏗᏱ ᏓᏍᏚᎲᎩ ᎠᎾᏓᏍᏓᏩᏗᏙᎯ ᏓᏂᎳᏫᎥᎢ, ᏅᏓᎦᎵᏍᏙᏗᏍᎬ ᏓᏂᏍᎦᎢᎲ ᎠᏂᏧᏏ, ᎤᎷᏨᎩ ᏥᏌ, ᎠᏰᎵ ᎤᎴᏅᎩ, ᎯᎠ ᏂᏚᏪᏎᎸᎩ; ᏅᏩᏙᎯᏯᏛ ᎢᏣᏤᎵᎦ ᎨᏎᏍᏗ. (Hnaquono nahiyu iga usvi, alenisgv sunadodaquasdi gesvi, galohisdiyi dasduhvgi anadasdawadidohi danilawivi, nvdagalisdodisgv danisgaihv Anitsusi, ulutsvgi Tsisa, ayeli ulenvgi, hia niduweselvgi; Nvwadohiyadv itsatseliga gesesdi.) — Cherokee Corpus</title>
