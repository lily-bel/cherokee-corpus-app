    <title>ᎹᏗᏍᎩᏂ ᎤᏪᎵᎯᏍᏗᏍᎨ ᎤᏣᏘ ᏚᎸᏫᏍᏓᏁᎲᎢ, ᎠᎴ ᎤᎷᏤᎴ ᎯᎠ ᏄᏪᏎᎴᎢ, ᏣᎬᏫᏳᎯ, ᏝᏍᎪ ᎪᎱᏍᏗ ᏰᎵᎭ ᎥᎩᎸ ᏣᏋᏕᏨ ᏣᎩᎯᏯᏍᏓᏁᎸ ᎠᏋᏒᏉ ᎪᎱᏍᏗ ᎢᏨᏯᏛᏁᏗᏱ? ᎾᏍᎩ ᎢᏳᏍᏗ ᏘᏁᏥ ᏓᎩᏍᏕᎸᏗᏱ.</title>
    <meta name="description" content="Madisgini uwelihisdisge utsati dulvwisdanehvi, ale ulutsele hia nuweselei, Tsagvwiyuhi, tlasgo gohusdi yeliha vgilv tsaquvdetsv tsagihiyasdanelv aquvsvquo gohusdi itsvyadvnediyi? Nasgi iyusdi tinetsi dagisdelvdiyi.&#10;But Martha was cumbered about much serving, and came to him, and said, Lord, dost thou not care that my sister hath left me to serve alone? bid her therefore that she help me. [CNT]" />
