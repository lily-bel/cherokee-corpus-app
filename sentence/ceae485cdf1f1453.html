    <title>ᎠᎴᏍᎪ ᎥᏝ ᎾᏍᎩ ᎯᎠ ᏳᎬᏫᏳᎭ, (ᎾᏍᎩ ᎦᏲᎩᏐᏢᏛ ᏥᎪᎩᏃᎮᎭ, ᎠᎴ ᎩᎶ ᎾᏍᎩ ᎾᏂᏪ ᏥᎪᎪᏎᎭ,) ᎤᏲ ᏕᎩᎸᏫᏍᏓᏁᎮᏍᏗ ᎾᏍᎩ ᎣᏍᏛ ᎨᏒ ᎤᎵᏰᎢᎸᏍᏗᏱ?  ᎾᏍᎩ ᎤᏂᏍᎦᏅᏨ ᏧᎾᏚᎪᏓᏁᏗᏱ ᏚᏳᎪᏗ. (Alesgo vtla nasgi hia yugvwiyuha, (nasgi gayogisotlvdv tsigoginoheha, ale gilo nasgi naniwe tsigogoseha,) Uyo degilvwisdanehesdi nasgi osdv gesv uliyeilvsdiyi?  nasgi unisganvtsv tsunadugodanediyi duyugodi.) — Cherokee Corpus</title>
