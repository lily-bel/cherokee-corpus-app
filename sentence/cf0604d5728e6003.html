    <title>ᎣᏂᏃ ᎢᏴᏛ ᏓᏆᎧᎾᏅᎩ, ᎠᎴ ᎬᏂᏳᏉ, ᎤᏂᏧᏈᏍᏗ ᏴᏫ  ᎾᏍᎩ ᎩᎶ ᏗᎬᏩᏎᎰᎲᏍᏗ ᏂᎨᏒᎾ, ᎾᏍᎩ ᏅᏓᏳᎾᏙᏣᎴᏛ ᎾᏂᎥ ᎤᎾᏓᏤᎵᏛ ᏴᏫ ᏓᏁᏩᏗᏒᎢ, ᎠᎴ ᎪᎱᏍᏗ ᏗᎾᏓᏛᎿᎭᎨᏒᎢ, ᎠᎴ ᏴᏫ ᏓᏁᏩᏗᏒᎢ ᎠᎴ ᏧᏓᎴᏅᏛ ᏗᏂᏬᏂᏍᎩ ᎨᏒᎢ, ᎠᏂᏙᎾᎥᎩ ᎦᏍᎩᎸ ᎢᎬᏱᏗᏢ, ᎠᎴ ᎤᏃᏕᎾ ᎠᎩᎾ ᏄᏛᏅ ᎢᎬᏱᏗᏢ, ᏧᏁᎬ ᏚᎾᏄᏩᎥᎩ, ᎠᎴ ᏗᏂᏁᎲᎩ ᏧᏪᏲᏔ ᏧᎦᏄᏓᏅᎯᏛ; (Onino iyvdv daquakananvgi, ale gvniyuquo, unitsuquisdi yvwi [widetsigovgi] nasgi gilo digvwasehohvsdi nigesvna, nasgi nvdayunadotsaledv naniv unadatselidv yvwi danewadisvi, ale gohusdi dinadadvhna gesvi, ale yvwi danewadisvi ale tsudalenvdv diniwonisgi gesvi, anidonavgi gasgilv igvyiditlv, ale Unodena agina nudvnv igvyiditlv, tsunegv dunanuwavgi, ale dininehvgi tsuweyota tsuganudanvhidv;) — Cherokee Corpus</title>
