    <title>ᎤᏂᏄᎸᏅᏃ ᎦᏙᎬ ᎾᎥ ᎤᏂᎷᎯᏍᏗᏱ ᎠᏂᏁᏄᎸ ᎢᏳᏍᏗ, ᎤᏅᏁᏎ ᎾᎿᎭᎠᏯᎥᎢ; ᎤᏅᏁᏒᏃ, ᎡᎳᏗ ᏄᏅᏁᎴ ᎠᏤᏍᏙ ᎾᎿᎭᎤᎸᏓᎸᎥᏍᎩ ᎦᏅᎬᎢ. (Uninulvnvno gadogv nav uniluhisdiyi aninenulv iyusdi, unvnese nahna ayavi; unvnesvno, eladi nunvnele atsesdo nahna ulvdalvvsgi ganvgvi.) — Cherokee Corpus</title>
