    <title>ᎤᏙᎯᏳᎯᏯ, ᎤᏙᎯᏳᎯᏯ ᎯᎠ ᏂᎬᏪᏎᎭ; ᎯᏫᏅ ᏥᎨᏒᎩ ᏨᏒ ᎭᏓᏠᎯᎲᎩ, ᎠᎴ ᏣᏚᎵᏍᎬ ᎮᏙᎲᎩ; ᏣᏛᏐᏅᎯᏍᎩᏂ ᎨᏎᏍᏗ ᏙᏔᏐᎸᏔᏂ, ᏅᏩᏓᎴᏃ ᏓᏣᏠᎵ, ᎠᎴ ᏂᏣᏚᎵᏍᎬᎾ ᎨᏒ ᏮᏓᏣᏘᏅᏍᏔᏂ. (Udohiyuhiya, udohiyuhiya hia nigvweseha; Hiwinv tsigesvgi tsvsv hadatlohihvgi, ale tsadulisgv hedohvgi; tsadvsonvhisgini gesesdi dotasolvtani, nvwadaleno datsatloli, ale nitsadulisgvna gesv wvdatsatinvstani.) — Cherokee Corpus</title>
