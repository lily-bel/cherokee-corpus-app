    <title>ᎠᏎᏃ ᏠᎨᏏ ᏧᏂᎸᏫᏍᏓᏁᎯ ᎤᏂᎪᎲ ᎤᏪᏥ ᎯᎠ ᏂᏚᎾᏓᏪᏎᎴᎢ; ᎾᏍᎩ ᎯᎠ ᎤᏤᎵ ᎢᏳᎵᏍᏙᏗ; Ꭷ ᎡᏗᎷᎦ, ᎠᎴ ᎡᏗᏬᏅ ᎤᏤᎵ ᎢᏳᎵᏍᏙᏗ ᏥᎩ. (Aseno tlogesi tsunilvwisdanehi unigohv uwetsi hia nidunadaweselei; Nasgi hia utseli iyulisdodi; ka ediluga, ale ediwonv utseli iyulisdodi tsigi.) — Cherokee Corpus</title>
