    <title>ᎾᏃ ᎠᏄᎦᎸᎯ ᏧᎳᎨᏯᏛᏤᎢ ᎨᏥᏛᎦ ᎾᏍᎩ ᎠᎾᏛᎬᎦ. ᎢᎸᎯᏢ ᏥᏩᏂᎶᏍᎪᎢ, ᎡᎶᎯᏃ ᎡᎯ ᎤᏪᎵᎯᏍᏗ ᎠᎴ ᎨᏅᎢᏍᏗ ᎨᏒ, ᎠᎴ ᎣᏍᏛ ᎠᏰᎸᏗ ᎨᏒ ᎠᏂᏁᏄᎳᏍᏗᏍᎪᎢ, ᎠᎴ ᎥᏝ ᏯᏂᎾᏄᎪᏫᏍᎪ ᎤᎦᏛᎾᏨᎯ. (Nano anugalvhi tsulageyadvtsei getsidvga nasgi anadvgvga. ilvhitlv tsiwanilosgoi, elohino ehi uwelihisdi ale genvisdi gesv, ale osdv ayelvdi gesv aninenulasdisgoi, ale vtla yaninanugowisgo ugadvnatsvhi.) — Cherokee Corpus</title>
