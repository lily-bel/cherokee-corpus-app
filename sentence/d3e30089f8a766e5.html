    <title>ᎠᎴ ᏧᏂᏲᎱᏒᎯ ᎥᎦᏥᎪᎥᎩ, ᏧᎾᏍᏗ ᎠᎴ ᏧᎾᏛᎾ, ᎤᏁᎳᏅᎯ ᎤᏬᎸ ᎢᎬᏱᏗᏢ ᏚᎾᎴᏅᎩ; ᎪᏪᎵᏃ ᏚᏂᏍᏚᎢᏒᎩ; ᎠᎴ ᏅᏩᏓᎴ ᎪᏪᎵ ᎤᏂᏍᏚᎢᏒᎩ, ᎾᏍᎩ ᎬᏂᏛ ᎠᏓᏁᎯ ᏥᎩ; ᏧᏂᏲᎱᏒᎯᏃ ᏙᎨᎫᎪᏓᏁᎸᎩ ᎾᏍᎩᏯ ᏂᎬᏅ ᎪᏪᎸ ᎪᏪᎵᎯ, ᎾᏍᎩᏯ ᏄᏍᏛ ᏚᏂᎸᏫᏍᏓᏁᎸᎢ. (Ale tsuniyohusvhi vgatsigovgi, tsunasdi ale tsunadvna, Unelanvhi uwolv igvyiditlv dunalenvgi; gowelino dunisduisvgi; ale nvwadale goweli unisduisvgi, nasgi gvnidv adanehi tsigi; tsuniyohusvhino dogegugodanelvgi nasgiya nigvnv gowelv gowelihi, nasgiya nusdv dunilvwisdanelvi.) — Cherokee Corpus</title>
