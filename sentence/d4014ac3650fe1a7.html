    <title>ᎢᏳᏰᏃ, ᎠᏏ ᎡᏗᏍᎦᎩ ᏥᎨᏒᎩ ᎡᏙᎢᏍᏓᏁᎸᎯ ᏱᎩ ᎤᏁᎳᏅᎯ ᎬᏔᏅᎯ ᎤᏪᏥ ᎤᏲᎱᏒᎢ, ᎿᎭᏉ ᎪᎯ ᎡᏙᎢᏍᏓᏁᎸᎯ ᏥᎩ, ᎤᏟᎯ ᎤᏙᎯᏳᎯᏯ ᎡᎩᏍᏕᎸᏗ ᎨᏎᏍᏗ ᎾᏍᎩ ᎬᏃᏛ ᎨᏒ ᎢᏳᏍᏗ. (Iyuyeno, asi edisgagi tsigesvgi edoisdanelvhi yigi Unelanvhi gvtanvhi Uwetsi uyohusvi, hnaquo gohi edoisdanelvhi tsigi, utlihi udohiyuhiya egisdelvdi gesesdi nasgi gvnodv gesv iyusdi.) — Cherokee Corpus</title>
