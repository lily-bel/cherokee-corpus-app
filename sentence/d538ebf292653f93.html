    <title>ᎾᏍᎩ ᏅᏗᎦᎵᏍᏙᏗᎭ ᎯᎠ ᎾᏍᎩ ᏥᏄᏍᏗ ᏥᏨᏲᏪᎳᏁᎭ ᎠᎩᎪᏁᎸᎢ, ᎾᏍᎩ ᎾᎯᏳ ᏥᎦᏔᎮᏍᏗ ᎬᏍᎦᎢᏍᏓᎩ ᎠᏋᏔᏂᏓᏍᏗᏱ ᏂᎨᏒᎾ, ᎾᏍᎩᏯ ᎢᎬᏆᏛᏁᏗ ᎠᏆᎵᏍᎪᎸᏓᏁᎸ ᎤᎬᏫᏳᎯ, ᎾᏍᎩ ᏧᎾᎵᏂᎪᎯᏍᏗ ᎨᏒᎢ, ᎥᏝᏃ ᎤᏂᏛᏙᏗ ᎨᏒᎢ.</title>
    <meta name="description" content="Nasgi nvdigalisdodiha hia nasgi tsinusdi tsitsvyowelaneha agigonelvi, nasgi nahiyu tsigatahesdi gvsgaisdagi aquvtanidasdiyi nigesvna, nasgiya igvquadvnedi aqualisgolvdanelv Ugvwiyuhi, nasgi tsunalinigohisdi gesvi, vtlano unidvdodi gesvi.&#10;Therefore I write these things being absent, lest being present I should use sharpness, according to the power which the Lord hath given me to edification, and not to destruction. [CNT]" />
