    <title>ᎤᏣᏛᎩ ᎢᏳᏓᎴᎩ ᎢᏨᏲᏪᎳᏁᏗ ᎠᎩᎲᎩ, ᎠᏎᏃ ᎥᏝ ᎪᏪᎵᏉ ᎠᎴ ᏗᎪᏪᎶᏗ ᏗᎬᏙᏗ ᏯᎩᏰᎸᏎᎢ, ᎤᏚᎩᏰᏃ ᎠᏋᎭ ᎢᏨᏩᏛᎲᏍᏗᏱ, ᎠᎴ ᏗᏗᎰᎵ ᏗᎬᏙᏗᏱ ᎢᎦᎵᏃᎮᏗᏱ, ᎠᎴ ᎢᏓᎵᎮᎵᎬ ᎤᎧᎵᎢᏍᏗᏱ. (Utsadvgi iyudalegi itsvyowelanedi agihvgi, aseno vtla goweliquo ale digowelodi digvdodi yagiyelvsei, udugiyeno aquvha itsvwadvhvsdiyi, ale didiholi digvdodiyi igalinohediyi, ale idaliheligv ukaliisdiyi.) — Cherokee Corpus</title>
