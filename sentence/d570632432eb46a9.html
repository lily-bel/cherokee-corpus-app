    <title>ᎾᏍᎩ ᎢᎩᏍᏕᎸᏛ ᏥᎩ, ᎠᎴ ᎢᎩᏯᏅᏛ ᏥᎩ ᎤᏩᏔᏅᎯ ᎦᎸᏉᏗ ᎠᏓᏯᏅᏗ ᎨᏒᎢ, ᎥᏝ ᎠᏴ ᏕᎩᎸᏫᏍᏓᏁᎲ ᏱᏅᏧᎵᏍᏙᏔᏅ, ᎤᏩᏒᏍᎩᏂ ᎤᏓᏅᏖᎸᎢ ᎠᎴ ᎬᏩᎦᏘᏯ ᎤᏓᏙᎵᏍᏗ ᎨᏒ ᏅᏧᎵᏍᏙᏔᏅ, ᎾᏍᎩ ᎢᎩᏁᎸᎯ ᏥᎩ ᏅᏧᏓᎴᏅᎲᎾ, ᏥᏌ ᎦᎶᏁᏛ ᎨᏒ ᎢᏳᏍᏗ, (Nasgi igisdelvdv tsigi, ale igiyanvdv tsigi uwatanvhi galvquodi adayanvdi gesvi, vtla ayv degilvwisdanehv yinvtsulisdotanv, uwasvsgini udanvtelvi ale gvwagatiya udadolisdi gesv nvtsulisdotanv, nasgi iginelvhi tsigi nvtsudalenvhvna, Tsisa Galonedv gesv iyusdi,) — Cherokee Corpus</title>
