    <title>ᎢᏨᎨᏳᎢ, ᎿᎭᏉ ᎤᏁᎳᏅᎯ ᏧᏪᏥ ᎠᏴ, ᎠᏎᏃ ᎥᏝ ᎠᏏ ᎬᏂᎨᏒ ᏱᏂᎦᎵᏍᏗᎭ ᎢᎦᎵᏍᏙᏗ ᎨᏒᎢ; ᎠᏎᏃ ᎢᏗᎦᏔᎭ ᎾᎯᏳ ᎦᎾᏄᎪᏨᎭ ᎾᏍᎩᏯ ᏄᏍᏛ ᏂᎦᏍᏕᏍᏗ, ᎾᏍᎩᏰᏃ ᏄᏍᏛ ᎾᏍᎩ ᏓᏰᏗᎪᎢ. (Itsvgeyui, hnaquo Unelanvhi tsuwetsi ayv, aseno vtla asi gvnigesv yinigalisdiha igalisdodi gesvi; aseno idigataha nahiyu gananugotsvha nasgiya nusdv nigasdesdi, nasgiyeno nusdv nasgi dayedigoi.) — Cherokee Corpus</title>
    <meta name="description" content="Beloved, now are we the sons of God, and it doth not yet appear what we shall be: but we know that, when he shall appear, we shall be like him; for we shall see him as he is." />
