    <title>ᎠᏏᏴᏫᏃ ᎾᏍᎩ ᎫᎾᏛᏐᏅᎯ ᎨᏒ ᎯᎠ ᎾᎩᏪᏎᎸᎩ, ᏞᏍᏗ ᏗᏣᏠᏱᎸᎩ; ᎬᏂᏳᏉ ᏢᏓᏥ ᎤᏃᏕᎾ ᏧᏓ ᎠᏂᎳᏍᏓᎸ ᏅᏓᏳᏓᎴᏅᎯ, ᏕᏫ ᎤᏱᏝᏅᎯ, ᎤᏓᏎᎪᎩᏒ ᎤᏍᏚᎢᏍᏗᏱ ᎪᏪᎵ, ᎠᎴ ᏧᏲᏍᏙᏗᏱ ᎦᎵᏉᎩ ᏂᏓᏍᏚᎲᎢ.</title>
    <meta name="description" content="Asiyvwino nasgi gunadvsonvhi gesv hia nagiweselvgi, Tlesdi ditsatloyilvgi; gvniyuquo tlvdatsi unodena Tsuda anilasdalv nvdayudalenvhi, Dewi Uyitlanvhi, udasegogisv usduisdiyi goweli, ale tsuyosdodiyi galiquogi nidasduhvi.&#10;And one of the elders saith unto me, Weep not: behold, the Lion of the tribe of Juda, the Root of David, hath prevailed to open the book, and to loose the seven seals thereof. [CNT]" />
