    <title>ᎠᎴ ᎧᏁᎬ ᎠᏆᏛᎦᏅᎩ ᎠᏰᎵ ᏅᎩ ᎢᏯᏂᏛ ᏗᏅᏃᏛ ᏄᎾᏛᏅᎢ, ᎯᎠ ᏅᏓᎦᏪᏍᎬᎩ, ᏥᏂᎩ ᎠᏟᎶᏍᏗ ᎠᎧᎵᎢ ᎤᏣᎴᏍᏗ ᎠᎩᏏᏧᎬᏩᎶᏗ ᎠᎫᏴᏗ, ᎠᎴ ᏥᏂᎩ ᎠᏟᎶᏍᏗ ᏦᎢ ᎢᏯᎧᎵᎢ ᎤᏣᎴᏍᏗ ᎢᏳᏍᏗ ᎠᎩᏏ-ᏧᎬᏩᎶᏗ ᎠᎫᏴᏗ; ᎠᎴ ᏞᏍᏗ ᎪᎱᏍᏗ ᏗᏨᏁᎸᎩ ᎪᎢ ᎠᎴ ᎩᎦᎨ-ᎠᏗᏔᏍᏗ.</title>
    <meta name="description" content="Ale kanegv aquadvganvgi [dvdalehvsgvgi] ayeli nvgi iyanidv dinvnodv nunadvnvi, hia nvdagawesgvgi, Tsinigi atlilosdi akalii utsalesdi agisitsugvwalodi aguyvdi, ale tsinigi atlilosdi tsoi iyakalii utsalesdi iyusdi agisitsugvwalodi aguyvdi; ale tlesdi gohusdi ditsvnelvgi goi ale gigageaditasdi.&#10;And I heard a voice in the midst of the four beasts say, A measure of wheat for a penny, and three measures of barley for a penny; and see thou hurt not the oil and the wine. [CNT]" />
