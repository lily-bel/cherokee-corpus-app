    <title>ᎠᎵᏍᏓᏴᏗ ᎤᏍᏉᎵᏱ ᎤᎬᏩᎵ ᎪᏢᏅᎯ, ᎠᎴ ᎤᏍᏉᎵᏱ ᎠᎵᏍᏓᏴᏗ ᎤᎬᏩᎵ ᎪᏢᏅᎯ; ᎠᏎᏃ ᎤᏁᎳᏅᎯ ᏙᏛᏛᏔᏂ ᎢᏧᎳ ᎤᏍᏉᎵᎩ ᎠᎴ ᎠᎵᏍᏓᏴᏗ.  ᎠᏰᎸᏃ ᎥᏝ ᎤᏕᎵᏛ ᏗᏂᏏᏗ ᎨᏒ ᎤᎬᏩᎵ ᎪᏢᏅᎯ ᏱᎩ, ᎤᎬᏫᏳᎯᏍᎩᏂ ᎤᎬᏩᎵ ᎪᏢᏅᎯ; ᎠᎴ ᎤᎬᏫᏳᎯ ᎠᏰᎵ ᎤᎬᏩᎵ ᎠᎵᏍᎪᎸᏔᏅᎯ. (Alisdayvdi usquoliyi ugvwali gotlvnvhi, ale usquoliyi alisdayvdi ugvwali gotlvnvhi; aseno Unelanvhi dodvdvtani itsula usquoligi ale alisdayvdi.  Ayelvno vtla udelidv dinisidi gesv ugvwali gotlvnvhi yigi, Ugvwiyuhisgini ugvwali gotlvnvhi; ale Ugvwiyuhi ayeli ugvwali alisgolvtanvhi.) — Cherokee Corpus</title>
    <meta name="description" content="Meats for the belly, and the belly for meats: but God shall destroy both it and them. Now the body is not for fornication, but for the Lord; and the Lord for the body." />
