    <title>ᎾᏍᎩᏰᏃ ᏂᎦᎥ ᎪᎱᏍᏗ ᏧᏬᏢᏅᎯ, ᎾᏍᎩ ᎦᎸᎳᏗ ᏤᎭ, ᎠᎴ ᎡᎶᎯ ᏤᎭ, ᎬᎪᏩᏛᏗ ᎠᎴ ᎬᎪᏩᏛᏗ ᏂᎨᏒᎾ ᏥᎩ, ᎢᏳ ᎤᏂᎬᏫᏳᎯ ᏧᏂᏗᏱ ᏱᎩ, ᎠᎴ ᎤᏂᎬᏫᏳᏌᏕᎩ ᏱᎩ, ᎠᎴ ᎨᏥᎸᏉᏗ ᏱᎩ, ᎠᎴ ᏧᎾᎵᏂᎩᏛ ᏱᎩ; ᏂᎦᏗᏳ ᏄᏓᎴᏒ ᎾᏍᎩ ᏚᏬᏢᏁᎢ, ᎠᎴ ᎤᏩᏒ ᏚᏓᏙᏢᎾᏁᎴᎢ; (Nasgiyeno nigav gohusdi tsuwotlvnvhi, nasgi galvladi tseha, ale elohi tseha, gvgowadvdi ale gvgowadvdi nigesvna tsigi, iyu unigvwiyuhi tsunidiyi yigi, ale unigvwiyusadegi yigi, ale getsilvquodi yigi, ale tsunalinigidv yigi; nigadiyu nudalesv nasgi duwotlvnei, ale uwasv dudadotlvnanelei;) — Cherokee Corpus</title>
