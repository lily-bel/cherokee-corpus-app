    <title>ᎤᎩᏨᏛᏃ ᎤᏚᎵᏍᎬ ᎢᏳᏍᏗ ᏚᏳᎪᏛ ᎤᏙᎴᎰᎯᏍᏗᏱ ᏅᏓᎦᎵᏍᏙᏗᏍᎬ ᎠᏂᏧᏏ ᎬᏭᎯᏍᏗᏍᎬᎢ, ᎤᎸᏒᎲᎩ, ᎠᎴ ᎤᏁᏨᎩ ᏄᏂᎬᏫᏳᏒ ᎠᏥᎸᎠᏁᎶᎯ ᎠᎴ ᏂᎦᏛ ᏗᏂᎳᏫᎩ, ᎤᎾᏓᏟᏐᏗᏱ, ᎠᎴ ᎤᏘᏃᎸᎩ ᏉᎳ, ᎠᏂᏅᎢᎬᏱᏢ ᎤᏪᎧᏅᎩ. (Ugitsvdvno udulisgv iyusdi duyugodv udolehohisdiyi nvdagalisdodisgv Anitsusi gvwuhisdisgvi, ulvsvhvgi, ale unetsvgi nunigvwiyusv atsilvanelohi ale nigadv dinilawigi, unadatlisodiyi, ale utinolvgi Quola, aninvigvyitlv uwekanvgi.) — Cherokee Corpus</title>
    <meta name="description" content="On the morrow, because he would have known the certainty wherefore he was accused of the Jews, he loosed him from his bands, and commanded the chief priests and all their council to appear, and brought Paul down, and set him before them." />
