    <title>ᎾᏍᎩᏯᏉ ᎠᏍᎦᏯ ᏣᏂᎩᏍᎪ ᎢᎸᎯᏢ ᏤᎪᎢ, ᎾᏍᎩ ᏥᎬᏕᎪ ᎦᏁᎸᎢ, ᎠᎴ ᎠᏂᎦᏘᏯ ᏥᏂᏕᎬᏁᎰ ᏧᏅᏏᏓᏍᏗ, ᎠᎴ ᎠᏂᏏᏴᏫᎭ ᏧᏂ ᎸᏫᏍᏓᏁᏗ ᏥᏓᏁᎰᎢ, ᎠᎴ ᎦᎶᎯᏍᏗᏱ ᎠᎦᏘᏯ ᏥᎧᏁᏤᎰ ᎤᏯᏫᏗᏱ. ([Yvwiyeno Uwetsi] nasgiyaquo asgaya tsanigisgo ilvhitlv tsegoi, nasgi tsigvdego ganelvi, ale anigatiya tsinidegvneho tsunvsidasdi, ale anisiyvwiha tsuni lvwisdanedi tsidanehoi, ale galohisdiyi agatiya tsikanetseho uyawidiyi.) — Cherokee Corpus</title>
