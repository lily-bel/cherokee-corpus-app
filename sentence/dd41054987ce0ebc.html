    <title>ᎦᏙ ᎰᏩ ᎤᏍᏗ, ᎢᏓᎵᏅᏟ?  ᎢᏳᏃ ᏕᏥᎳᏫᎩ, ᎢᏥᏏᏴᏫᎭ ᏗᎧᏃᎩᏛ ᎢᏣᏛᏅᎢᏍᏙᎢ, ᏗᏕᏲᏗ ᎢᏣᏛᏅᎢᏍᏙᎢ, ᏧᏓᎴᏅᏛ ᏗᎦᏬᏂᎯᏍᏗ ᎢᏣᏛᏅᎢᏍᏙᎢ, ᎬᏂᎨᏒ ᎢᎬᏁᏗ ᎢᏣᏛᏅᎢᏍᏙᎢ, ᎠᏁᏢᏙᏗ ᎢᏣᏛᏅᎢᏍᏙᎢ.  ᏂᎦᏛ ᎠᏗᎾ ᏕᏥᎸᏫᏍᏓᏁᎲ ᏗᏣᏓᎵᏂᎪᎯᏍᏙᏗᏱ ᎤᎬᏩᎴᏍᏗ. (Gado howa usdi, idalinvtli?  iyuno detsilawigi, itsisiyvwiha dikanogidv itsadvnvisdoi, dideyodi itsadvnvisdoi, tsudalenvdv digawonihisdi itsadvnvisdoi, gvnigesv igvnedi itsadvnvisdoi, anetlvdodi itsadvnvisdoi.  Nigadv adina detsilvwisdanehv ditsadalinigohisdodiyi ugvwalesdi.) — Cherokee Corpus</title>
    <meta name="description" content="How is it then, brethren? when ye come together, everyone of you hath a psalm, hath a doctrine, hath a tongue, hath a revelation, hath an interpretation. Let all things be done unto edifying." />
