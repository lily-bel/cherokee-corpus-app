    <title>ᎾᏍᎩ ᏔᏘᏄᎦ, ᎠᎴ ᎢᏧᎳᎭ ᎢᏣᏓᏅᎦᎸ, ᎠᎴ ᎢᏧᎳᎭ ᎢᏣᎫᏴ, ᎾᏍᎩᏃ ᏗᏂᏍᎪᎵ ᏕᎠᎾᎵᏍᏙᏰᎲᎭ; ᎠᎴ ᏂᎦᏛ ᎠᎾᏙᎴᎰᏒᎭ ᏄᏍᏛ ᎨᏣᏛᎦᏁᎸᎢ ᎠᏎᏉᏉ ᎨᏒᎢ, ᎠᎴ ᎠᎾᏙᎴᎰᏒᎭ ᏨᏒ ᎾᏍᏉ ᏚᏳᎪᏛ ᎭᎴᏂᏙᎲᎢ, ᏗᎧᎿᎭᏩᏛᏍᏗ ᎯᏍᏓᏩᏕᎬᎢ. (Nasgi tatinuga, ale itsulaha itsadanvgalv, ale itsulaha itsaguyv, nasgino dinisgoli deanalisdoyehvha; ale nigadv anadolehosvha nusdv getsadvganelvi asequoquo gesvi, ale anadolehosvha tsvsv nasquo duyugodv halenidohvi, dikahnawadvsdi hisdawadegvi.) — Cherokee Corpus</title>
    <meta name="description" content="Them take, and purify thyself with them, and be at charges with them, that they may shave their heads: and all may know that those things, whereof they were informed concerning thee, are nothing; but that thou thyself also walkest orderly, and keepest the law." />
