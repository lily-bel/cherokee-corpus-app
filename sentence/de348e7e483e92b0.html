    <title>ᏝᏍᎪ ᎤᏟ ᎢᎦᎢ ᏱᏂᏙᎬᏩᏳᎪᏗ ᎠᏥᏍᏛᏗᏍᏙᏗᏱ ᎩᎶ ᎤᏁᎳᏅᎯ ᎤᏪᏥ ᎤᎳᏍᏓᎡᎸᎯ, ᎠᎴ ᎾᏍᎩ Ꮎ ᎩᎬᎧᏃᎮᏛ ᏗᏠᎯᏍᏙᏔᏅᎯ ᎾᏍᎩ ᎤᏓᏅᎦᎶᏔᏅᎯ ᎨᏒ ᎦᏓᎭ ᎤᏰᎸᏅᎯ, ᎠᎴ ᎦᎬᏩᏐᏢᏔᏅᎯ ᎬᏩᎦᏘᏯ ᎠᏓᏙᎵᎩ ᎠᏓᏅᏙ.</title>
    <meta name="description" content="Tlasgo utli igai yinidogvwayugodi atsisdvdisdodiyi gilo Unelanvhi Uwetsi ulasdaelvhi, ale nasgi na gigvkanohedv ditlohisdotanvhi nasgi udanvgalotanvhi gesv gadaha uyelvnvhi, ale gagvwasotlvtanvhi gvwagatiya adadoligi Adanvdo.&#10;Of how much sorer punishment, suppose ye, shall he be thought worthy, who hath trodden under foot the Son of God, and hath counted the blood of the covenant, wherewith he was sanctified, an unholy thing, and hath done despite unto the Spirit of grace? [CNT]" />
