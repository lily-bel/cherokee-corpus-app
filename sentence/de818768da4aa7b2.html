    <title>ᎨᎦᏙᏣᎳᎡᎸᎩ, ᎠᏎᏃ ᎥᏝ ᎾᎿᎭᎠᏁᎳ ᏱᎨᏎᎢ, ᎢᏳᏰᏃ ᎾᎿᎭᎠᏁᏔ ᏱᎨᏎᎢ, ᎠᏎ ᏱᏂᎬᏩᎾᏛᏁᎢ, ᎠᏎᏃ  ᎬᏂᎨᏒ ᎢᏳᎾᎵᏍᏙᏗᏱ ᎾᎿᎭᏂᎦᏛ ᎠᏁᎳ ᏂᎨᏒᎾ ᎨᏒᎢ. (Gegadotsalaelvgi, aseno vtla nahna anela yigesei, iyuyeno nahna aneta yigesei, ase yinigvwanadvnei, aseno [unadotsalesvgi] gvnigesv iyunalisdodiyi nahna nigadv anela nigesvna gesvi.) — Cherokee Corpus</title>
    <meta name="description" content="They went out from us, but they were not of us; for if they had been of us, they would no doubt have continued with us: but they went out, that they might be made manifest that they were not all of us." />
