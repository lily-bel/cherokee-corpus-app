    <title>ᎠᎴ ᎦᏙ ᏯᏛᎦ ᎩᎶ ᎤᎵᏂᎩᏛ ᎠᏍᎦᏯ ᎦᏁᎸ ᏯᏴᎭ ᎠᎴ ᎤᎿᎭᎥ ᏯᏬᏅ, ᎢᏳᏃ ᎢᎬᏱ ᏄᎸᎸᎾ ᏱᎩ ᎾᏍᎩ ᎤᎵᏂᎩᏛ ᎠᏍᎦᏯ?  ᎩᎳ ᎿᎭᏉ ᏯᏬᏅ ᎦᏁᎸᎢ ᎤᎿᎭᎥᎢ. (Ale gado yadvga gilo ulinigidv asgaya ganelv yayvha ale uhnav yawonv, iyuno igvyi nulvlvna yigi nasgi ulinigidv asgaya?  Gila hnaquo yawonv ganelvi uhnavi.) — Cherokee Corpus</title>
