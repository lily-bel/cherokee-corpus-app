    <title>ᎦᎪᏰᏃ ᎢᏳᏍᏗ ᏴᏫ ᏧᏓᎴᏅᏛ ᏴᏫ ᏧᏤᎵᎦ ᎠᎦᏔᎭ?  ᎤᏩᏒᏉᏍᎩᏂ ᏴᏫ ᎤᏓᏅᏙ ᎾᏍᎩ ᏧᏯᎠ.  ᎾᏍᎩᏯ ᎾᏍᏉ ᏧᏓᎴᏅᏛ ᎤᏁᎳᏅᎯ ᏧᏤᎵᎦ ᎥᏝ ᎩᎶ ᏯᎦᏔᎭ, ᎤᏁᎳᏅᎯ ᎤᏓᏅᏙ ᎤᏩᏒ. (Gagoyeno iyusdi yvwi tsudalenvdv yvwi tsutseliga agataha?  uwasvquosgini yvwi udanvdo nasgi tsuyaa.  Nasgiya nasquo tsudalenvdv Unelanvhi tsutseliga vtla gilo yagataha, Unelanvhi Udanvdo uwasv.) — Cherokee Corpus</title>
