    <title>ᏥᎪ ᎦᏚ-ᎢᏗᏢ ᏄᏍᏛ ᏗᎧᏃᏗᏱ ᎪᎱᏍᏗ ᏕᏣᎧᏂᏍᎪᎢ?  ᎢᏳᏃ ᎩᎶ ᎤᏩᏒᏉ ᎠᏓᎵᏍᎦᏍᏙᏗᏍᎨᏍᏗ ᎦᎶᏁᏛ ᏥᏯᏤᎵ ᎠᏴ ᎢᎡᎵᏍᎨᏍᏗ, ᎤᏩᏒ ᎨᏒ ᏔᎵᏁ ᎯᎠ ᎾᏍᎩ ᏥᎠᏓᏅᏛᎵ, ᎾᏍᎩ ᎾᏍᎩᏯ ᎦᎶᏁᏛ ᎤᏤᎵ ᎨᏒ ᎾᏍᎩ, ᎾᏍᎩᏯ ᎾᏍᏉ ᎠᏴ ᎦᎶᏁᏛ ᎣᏣᏤᎵᎦ. (Tsigo gaduiditlv nusdv dikanodiyi gohusdi detsakanisgoi?  iyuno gilo uwasvquo adalisgasdodisgesdi Galonedv tsiyatseli ayv ielisgesdi, uwasv gesv taline hia nasgi tsiadanvdvli, nasgi nasgiya Galonedv utseli gesv nasgi, nasgiya nasquo ayv Galonedv otsatseliga.) — Cherokee Corpus</title>
