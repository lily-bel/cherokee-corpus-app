    <title>ᎩᎳᏉᏃ ᎢᏴᏛ ᏚᎴᏁᎢ, ᎤᏁᏒᏃ ᎠᏤᏍᏙ, ᎤᏄᎪᏤ ᏂᎦᏛ ᎠᏂᎦᏔᎲᎢ; ᎾᏍᎩ ᎢᏳᏍᏗ ᏂᎦᏛ ᎤᏂᏍᏆᏂᎪᏎᎢ, ᎠᎴ ᎤᏁᎳᏅᎯ ᎤᏂᎸᏉᏔᏁ ᎯᎠ ᏄᏂᏪᏎᎢ; ᎥᏝ ᎢᎸᎯᏳ ᎾᏍᎩ ᎢᏳᏍᏗ ᏲᎩᎪᎰᎢ.</title>
    <meta name="description" content="Gilaquono iyvdv dulenei, unesvno atsesdo, unugotse nigadv anigatahvi; nasgi iyusdi nigadv unisquanigosei, ale Unelanvhi unilvquotane hia nuniwesei; vtla ilvhiyu nasgi iyusdi yogigohoi.&#10;And immediately he arose, took up the bed, and went forth before them all; insomuch that they were all amazed, and glorified God, saying, We never saw it on this fashion. [CNT]" />
