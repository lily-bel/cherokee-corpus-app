    <title>ᎩᎶ ᎾᏍᎩ Ꮎ ᏥᎪᎯᏳᎲᏍᎪᎢ, ᎥᏝ ᎤᏍᎦᏅᏨᎯ ᏧᏚᎪᏔᏅᎯ ᏱᎨᏐᎢ, ᎾᏍᎩᏍᎩᏂ Ꮎ ᏂᎪᎯᏳᎲᏍᎬᎾ ᎾᏍᎩ ᎦᏳᎳ ᎤᏍᎦᏅᏨᎯ ᏧᏚᎪᏔᏅᎯ ᎨᏐᎢ, ᏅᏗᎦᎵᏍᏙᏗᏍᎪ ᏄᏬᎯᏳᏅᎾ ᎨᏒ ᎤᏁᎳᏅᎯ ᎤᏪᏥ ᏕᎤᏙᎥ ᎾᏍᎩ ᎤᏩᏒᎯᏳ ᎤᏕᏁᎸᎯ. (Gilo nasgi na tsigohiyuhvsgoi, vtla usganvtsvhi tsudugotanvhi yigesoi, nasgisgini na nigohiyuhvsgvna nasgi gayula usganvtsvhi tsudugotanvhi gesoi, nvdigalisdodisgo nuwohiyunvna gesv Unelanvhi Uwetsi deudov nasgi uwasvhiyu udenelvhi.) — Cherokee Corpus</title>
    <meta name="description" content="He that believeth on him is not condemned: but he that believeth not is condemned already, because he hath not believed in the name of the only begotten Son of God." />
