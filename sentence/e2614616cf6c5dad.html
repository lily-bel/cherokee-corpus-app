    <title>ᎢᏳᏰᏃ ᏂᎯ ᎢᎾᎨ ᎡᎯᏯ ᎣᎵᏩ ᏡᎬ ᏨᏱᏢᏅᎯ ᏱᎩ, ᎠᎴ ᎾᎿᎭᎮᎯᏯ ᏂᎨᏒᎾ ᎨᏒ ᎣᏍᏛ ᎣᎵᏩ ᏡᎬ ᏰᏨᏱᏢᏅ, ᎤᏟᎯᏳᏍᎩᏂ ᎠᎯᏘᏳ ᎾᏍᎩ Ꮎ ᎾᎿᎭᎠᏁᎯᏯ ᏥᎩ, ᎨᏥᏱᏢᏗ ᎾᎿᎭᎤᏅᏒ ᎤᎾᏤᎵᎦᏯ ᎣᎵᏩ ᏡᎬᎢ.</title>
    <meta name="description" content="Iyuyeno nihi inage ehiya oliwa tlugv tsvyitlvnvhi yigi, ale nahna hehiya nigesvna gesv osdv oliwa tlugv yetsvyitlvnv, utlihiyusgini ahitiyu nasgi na nahna anehiya tsigi, getsiyitlvdi nahna unvsv unatseligaya oliwa tlugvi.&#10;For if thou wert cut out of the olive tree which is wild by nature, and wert graffed contrary to nature into a good olive tree: how much more shall these, which be the natural branches, be graffed into their own olive tree? [CNT]" />
