    <title>ᎾᏍᎩᏃ Ꮎ ᏃᏈᏏ ᎤᏴᏍᏗ ᎦᏙᎥ; ᏦᎢᏃ ᎢᏗᎦᏛᎯ ᎨᏒ ᎡᏉᏂ ᏚᏪᏴ ᎾᏍᎩ ᏌᏉ ᎢᏳᏪᏨᎯ ᎤᏴᏍᏗ ᏂᏚᎵᏍᏔᏅᎩ; ᎠᎴ ᎤᏂᏣᏘ ᏴᏫ ᎠᎹ ᎤᎾᏗᏔᎲ ᏚᏂᏲᎱᏒᎩ, ᏅᏓᎦᎵᏍᏙᏗᏍᎬᎩ ᎠᎹ ᎤᏴᏍᏗ ᏂᏚᎵᏍᏔᏅᎢ. (Nasgino na noquisi Uyvsdi gadov; tsoino idigadvhi gesv equoni duweyv nasgi saquo iyuwetsvhi uyvsdi nidulistanvgi; ale unitsati yvwi ama unaditahv duniyohusvgi, nvdagalisdodisgvgi ama uyvsdi nidulistanvi.) — Cherokee Corpus</title>
