    <title>ᎠᏆᏛᎦᏅᎩᏃ ᎠᏍᏓᏯ ᎧᏁᎬ ᎩᎶ ᎦᎸᎳᏗ ᏛᏓᎴᎲᏍᎬᎩ ᎯᎠ ᏂᎦᏪᏍᎬᎩ, ᎬᏂᏳᏉ ᎤᏁᎳᏅᎯ ᎤᎵᏦᏛ ᏴᏫ ᎠᏁᎲ ᎤᏓᏑᏯ, ᎠᎴ ᎤᏁᎳᏅᎯ ᎾᏍᎩ ᎠᏁᎲ ᏛᏕᏂ, ᎠᎴ ᎾᏍᎩ ᏧᏤᎵ ᎨᏎᏍᏗ ᏴᏫ, ᎤᏁᎳᏅᎯᏃ ᎤᏩᏒ ᎾᏍᎩ ᎠᏁᎲ ᎡᎮᏍᏗ ᎤᎾᏤᎵ ᎤᏁᎳᏅᎯ ᎨᏎᏍᏗ.</title>
    <meta name="description" content="Aquadvganvgino asdaya kanegv gilo galvladi dvdalehvsgvgi hia nigawesgvgi, Gvniyuquo Unelanvhi ulitsodv yvwi anehv udasuya, ale Unelanvhi nasgi anehv dvdeni, ale nasgi tsutseli gesesdi yvwi, Unelanvhino uwasv nasgi anehv ehesdi unatseli Unelanvhi gesesdi.&#10;And I heard a great voice out of heaven saying, Behold, the tabernacle of God is with men, and he will dwell with them, and they shall be his people, and God himself shall be with them, and be their God. [CNT]" />
