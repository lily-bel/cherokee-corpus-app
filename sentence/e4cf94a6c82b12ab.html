    <title>ᎥᏝ ᎠᏗᎾ ᎿᎭᏉ ᎠᏎ ᎾᏍᏉ ᎡᎶᎯ ᏗᏂᎧᎿᎭᏩᏕᎩ ᎤᏕᎵᏛ ᏗᎾᏂᏏᎲᏍᎩ ᎠᎴ ᎤᏂᎬᎥᏍᎩ, ᎠᎴ ᎤᎶᏒᏍᏗ ᎠᎾᏓᎩᎡᎯ, ᎠᎴ ᎤᏁᎳᏅᎯ ᏗᏟᎶᏍᏔᏅᎯ ᏗᎾᏓᏙᎵᏍᏓᏁᎯ; ᎢᏳᏰᏃ ᎾᏍᎩ ᏱᏄᏍᏗ, ᎠᏎ ᎢᏥᏄᎪᎢᏍᏗ ᏱᎩ ᎡᎶᎯ.</title>
    <meta name="description" content="Vtla adina hnaquo ase [itsedasdiyi nigesvna] nasquo elohi dinikahnawadegi udelidv dinanisihvsgi ale unigvvsgi, ale ulosvsdi anadagiehi, ale Unelanvhi ditlilostanvhi dinadadolisdanehi; iyuyeno nasgi yinusdi, ase itsinugoisdi yigi elohi.&#10;Yet not altogether with the fornicators of this world, or with the covetous, or extortioners, or with idolaters; for then must ye needs go out of the world. [CNT]" />
