    <title>ᎠᎴ ᎿᎭᏉ ᎤᏲ ᏂᎨᏨᎿᎭᏕᎨᏍᏗ ᎢᎸᎯᏢ ᎦᏚᎲᎢ, ᎢᎶᎵᏍᎨᏍᏗ ᏅᏩᎵᎴ ᏗᎦᏚᎲ ᏫᏥᎶᏍᎨᏍᏗ.  ᎤᏙᎯᏳᎯᏯᏰᏃ ᎯᎠ ᏂᏨᏪᏎᎭ, ᎥᏝ ᎢᏏᎵᏱ ᏕᎦᏚᎲᎢ ᏱᎨᏤᏙᏁᏍᏗ ᎿᎭᏉ ᏴᏫ ᎤᏪᏥ ᏓᎦᎷᏥ. (Ale hnaquo uyo nigetsvhnadegesdi ilvhitlv gaduhvi, ilolisgesdi nvwalile digaduhv witsilosgesdi.  Udohiyuhiyayeno hia nitsvweseha, Vtla Isiliyi degaduhvi yigetsedonesdi hnaquo yvwi Uwetsi dagalutsi.) — Cherokee Corpus</title>
