    <title>ᎥᏝ ᎠᎴ ᎩᎶ ᎠᏏᏴᏫ ᎨᏒ ᎾᎥ ᎢᏧᎾᏓᎵ, ᎠᎴ ᏗᎾᏓᏅᏟ ᎨᏒ ᏱᎨᏲᎲᏍᎨᏍᏗ, ᎯᎠ ᏱᏂᎦᏪᏍᎨᏍᏗ, ᎯᎦᏙᎥᎯ ᎤᎬᏫᏳᎯ; ᎾᏂᎥᏉᏰᏃ ᎬᎩᎦᏔᎯᏳ ᎨᏎᏍᏗ, ᎤᏍᏗᎧᏂ ᎡᎲ ᏅᏓᎬᏩᏓᎴᏅᏛ, ᎤᏟ ᎢᏯᏥᎸᏉᏗ ᎡᎲ ᏫᎬᏍᏗ.</title>
    <meta name="description" content="Vtla ale gilo asiyvwi gesv nav itsunadali, ale dinadanvtli gesv yigeyohvsgesdi, hia yinigawesgesdi, Higadovhi Ugvwiyuhi; nanivquoyeno gvgigatahiyu gesesdi, usdikani ehv nvdagvwadalenvdv, utli iyatsilvquodi ehv wigvsdi.&#10;And they shall not teach every man his neighbour, and every man his brother, saying, Know the Lord: for all shall know me, from the least to the greatest. [CNT]" />
