    <title>ᎯᎠ ᎾᏍᎩ ᎾᎿᎭᎤᏁᎳᏅᎯ ᏧᏪᏥ ᎬᏂᎨᏒ ᎾᎾᎵᏍᏗᎭ, ᎠᎴ ᎠᏍᎩᎾ ᏧᏪᏥ; ᎩᎶ ᏚᏳᎪᏛ ᏧᎸᏫᏍᏓᏁᎯ ᏂᎨᏒᎾ ᏥᎨᏐᎢ, ᎥᏝ ᎤᏁᎳᏅᎯ ᏅᏓᏳᏓᎴᏅᎯ ᏱᎨᏐᎢ; ᎠᎴ ᏗᎾᏓᏅᏟ ᎤᎨᏳᎯ ᏂᎨᏒᎾ ᏥᎨᏐᎢ. (Hia nasgi nahna Unelanvhi tsuwetsi gvnigesv nanalisdiha, ale asgina tsuwetsi; gilo duyugodv tsulvwisdanehi nigesvna tsigesoi, vtla Unelanvhi nvdayudalenvhi yigesoi; ale dinadanvtli ugeyuhi nigesvna tsigesoi.) — Cherokee Corpus</title>
