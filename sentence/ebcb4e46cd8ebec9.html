    <title>ᎠᏎᏴᏫᏃ ᏚᏍᏆᎸᏔᏅ, ᎠᎴ ᏚᏬᎵ ᏧᏂᏦᏯᏍᏗ ᏭᎧᎵᎢᏍᏔᏅ, ᎠᎴ ᎦᎾᏍᏙᎯ ᎤᏪᏆᏔᏅ, ᎤᏁᏁᎸ ᎤᏗᏔᏍᏗ; ᎯᎠ ᏄᏪᏎᎢ, ᎤᏁᎳᎩ, ᎢᏓᏙᎴᎰᎯ, ᏥᎪᏃ ᎢᎳᏯ ᏓᎦᎷᏥ ᏓᏳᏠᎥᏔᏂᎵ. (Aseyvwino dusqualvtanv, ale duwoli tsunitsoyasdi wukaliistanv, ale ganasdohi uwequatanv, unenelv uditasdi; hia nuwesei, Unelagi, idadolehohi, tsigono Ilaya dagalutsi dayutlovtanili.) — Cherokee Corpus</title>
