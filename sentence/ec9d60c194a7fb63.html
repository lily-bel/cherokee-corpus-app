    <title>ᎠᏎᏃ ᎠᏴ ᎯᎠ ᏂᏨᏪᏎᎭ; ᎩᎶ ᏗᎾᏓᏅᏟ ᎠᏍᎦᎨᏍᏗ ᎪᎱᏍᏗ ᏄᏍᏛᏗᏍᎬᎾ ᎢᎨᏎᏍᏗ, ᎬᏩᏍᏛᏗᏍᏗ ᎨᏎᏍᏗ ᏗᏄᎪᏗᏍᎩᏱ; ᎩᎶᏃ ᏗᎾᏓᏅᏟ ᏂᏣᏓᏅᏛᎾ ᎢᎪᏎᎮᏍᏗ, ᏕᎦᎳᏫᎥ ᎬᏩᏍᏛᏗᏍᏗ ᎨᏎᏍᏗ; ᎩᎶᏃ ᏣᏁᎫ ᎢᎪᏎᎮᏍᏗ, ᎬᏩᏍᏛᏗᏍᏗ ᎨᏎᏍᏗ ᏨᏍᎩᏃ ᎠᏥᎸᏱ. (Aseno ayv hia nitsvweseha; Gilo dinadanvtli asgagesdi gohusdi nusdvdisgvna igesesdi, gvwasdvdisdi gesesdi dinugodisgiyi; gilono dinadanvtli Nitsadanvdvna igosehesdi, degalawiv gvwasdvdisdi gesesdi; gilono Tsanegu igosehesdi, gvwasdvdisdi gesesdi tsvsgino atsilvyi.) — Cherokee Corpus</title>
