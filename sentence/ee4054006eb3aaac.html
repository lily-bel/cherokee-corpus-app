    <title>ᎿᎭᏉ ᎧᏱᏆ ᎦᏁᎸ ᎤᎾᏘᎿᎭᏫᏛᎲᎩ ᏥᏌ, ᏗᎫᎪᏙᏗᏱ ᏭᎾᏘᏅᏍᏔᏅᎩ; ᎠᎴ ᏑᎾᎴ ᎨᏒᎩ. ᎤᏅᏒᏍᎩᏂ ᎥᏝ ᏗᎫᎪᏙᏗᏱ ᏳᏁᏅᏎᎢ, ᎦᏓᎭ ᏱᏃᏣᎵᏍᏓ ᎠᏁᎵᏍᎬᎩ, ᎧᏃᎯᏰᎩ ᏗᎵᏍᏓᏴᏗᏱ ᏧᎾᎵᏍᏓᏴᏗᏱ ᎤᏂᏰᎸᏒᎩ.</title>
    <meta name="description" content="Hnaquo Kayiqua ganelv unatihnawidvhvgi Tsisa, digugododiyi wunatinvstanvgi; ale sunale gesvgi. Unvsvsgini vtla digugododiyi yunenvsei, gadaha yinotsalisda anelisgvgi, kanohiyegi dilisdayvdiyi tsunalisdayvdiyi uniyelvsvgi.&#10;Then led they Jesus from Caiaphas unto the hall of judgment: and it was early; and they themselves went not into the judgment hall, lest they should be defiled; but that they might eat the passover. [CNT]" />
