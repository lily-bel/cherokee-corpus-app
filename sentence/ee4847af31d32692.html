    <title>ᎪᎯᏍᎩᏂ ᎢᏨᏲᏪᎳᏏ ᎢᏧᎳᎭ ᎢᏤᏓᏍᏗᏱ ᏂᎨᏒᎾ, ᎢᏳᏃ ᎩᎶ ᎠᎾᎵᏅᏟ ᎠᎪᏎᎯ ᏱᎩ ᎾᏍᎩ ᎤᏕᎵᏛ ᏗᏂᏏᎲᏍᎩ ᏱᎩ, ᎠᎴ ᎤᎬᎥᏍᎩ ᏱᎩ, ᎠᎴ ᎤᏁᎳᏅᎯ ᏗᏟᎶᏍᏔᏅᎯ ᎠᏓᏙᎵᏍᏓᏁᎯ ᏱᎩ, ᎠᎴ ᎠᏓᏐᎮᎯ, ᎠᎴ ᎤᏴᏍᏕᏍᎩ, ᎠᎴ ᎤᎶᏒᏍᏗ ᎠᏓᎩᎡᎯ; ᎾᏍᎩ ᎢᏳᏍᏗ ᎥᏝᏍᏗ ᎾᏍᏉ ᎢᏧᎳᎭ ᏱᏣᎵᏍᏓᏴᏁᏍᏗ.</title>
    <meta name="description" content="Gohisgini itsvyowelasi itsulaha itsedasdiyi nigesvna, iyuno gilo analinvtli agosehi yigi nasgi udelidv dinisihvsgi yigi, ale ugvvsgi yigi, ale Unelanvhi ditlilostanvhi adadolisdanehi yigi, ale adasohehi, ale uyvsdesgi, ale ulosvsdi adagiehi; nasgi iyusdi vtlasdi nasquo itsulaha yitsalisdayvnesdi.&#10;But now I have written unto you not to keep company, if any man that is called a brother be a fornicator, or covetous, or an idolater, or a railer, or a drunkard, or an extortioner; with such an one no not to eat. [CNT]" />
