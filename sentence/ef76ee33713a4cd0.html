    <title>ᎠᎴ ᏗᎧᏃᎩᏍᏙᏗ ᏗᏂᏃᎩᏍᏗᏍᎩ, ᎠᎴ ᏗᏂᏃᎩᏍᎩ, ᎠᎴ ᎠᏦᏔᏍᏗ ᏗᏂᏃᎩᏍᏗᏍᎩ, ᎠᎴ ᏗᏂᏤᎷᎯᏍᎩ ᎤᎾᏓᏃᏴᎵᏍᏛ ᎥᏝ ᎿᎭᏉ ᎡᏣᏛᎦᏁᏗ ᏱᎨᏎᏍᏗ; ᎢᏝ ᎠᎴ ᎪᏢᏅᎥᏍᎩ ᏄᏓᎴᏒᏉ ᎪᎱᏍᏗ ᎪᏢᏍᎩ ᎿᎭᏉ ᏰᏣᏩᏛᎡᎴᏍᏗ; ᎠᎴ ᏅᏯ ᎠᏍᏙᏍᎩ ᎤᏃᏴᎬ ᎥᏝ ᎿᎭᏉ ᎡᏣᏛᎦᏁᏗ ᏱᎨᏎᏍᏗ;</title>
    <meta name="description" content="Ale dikanogisdodi dininogisdisgi, ale dininogisgi, ale atsotasdi dininogisdisgi, ale dinitseluhisgi unadanoyvlisdv vtla hnaquo etsadvganedi yigesesdi; itla ale gotlvnvvsgi nudalesvquo gohusdi gotlvsgi hnaquo yetsawadvelesdi; ale nvya asdosgi unoyvgv vtla hnaquo etsadvganedi yigesesdi;&#10;And the voice of harpers, and musicians, and of pipers, and trumpeters, shall be heard no more at all in thee; and no craftsman, of whatsoever craft he be, shall be found any more in thee; and the sound of a millstone shall be heard no more at all in thee; [CNT]" />
