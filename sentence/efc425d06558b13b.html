    <title>ᎢᏳᏍᎩᏂᏃᏅ ᎠᏉᎯᏤᎵᏙᎸᎭ ᎾᏍᎩ ᏣᏙᎴᎰᎯᏍᏗᏱ ᎢᏣᏛᏁᏗᏱ ᏗᏣᎸᏫᏍᏓᏁᏗᏱ ᎤᏁᎳᏅᎯ ᎤᏤᎵ ᎠᏓᏁᎸᎢ, ᎾᏍᎩ ᏧᎾᏁᎶᏗ ᎤᎾᏓᏡᎬ ᎬᏂᏛ ᎤᏁᎳᏅᎯ ᎤᏤᎵ ᏥᎩ, ᎦᎫᏍᏛᏗ ᎠᎴ ᎤᎵᏍᏓᏱᏙ ᏥᎩ ᏚᏳᎯᏛ ᎨᏒᎢ. (Iyusgininonv aquohitselidolvha nasgi tsadolehohisdiyi itsadvnediyi ditsalvwisdanediyi Unelanvhi utseli adanelvi, nasgi tsunanelodi unadatlugv gvnidv Unelanvhi utseli tsigi, gagusdvdi ale ulisdayido tsigi duyuhidv gesvi.) — Cherokee Corpus</title>
