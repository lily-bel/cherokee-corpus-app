    <title>ᎠᎴ ᏓᏆᎧᎿᎭᏅᎩ, ᎠᎴ ᎬᏂᏳᏉ, ᎠᏰᎵ ᎦᏍᎩᎸᎢ ᎠᎴ ᎠᏰᎵ ᏄᎾᏛᏅ ᎾᏍᎩ Ꮎ ᏅᎩ ᎢᏯᏂᏛ ᏗᏅᏃᏛ, ᎠᎴ ᎠᏰᎵ ᎠᏂᏅ ᏧᎾᏛᏐᏅᎯ, ᎥᎦᏙᎬᎩ ᎤᏃᏕᎾ ᎠᎩᎾ, ᎠᎸᎯ ᎢᏳᏍᏗ ᎨᏒᎩ, ᎦᎵᏉᎩ ᏚᎷᎬᎩ, ᎠᎴ ᎦᎵᏉᎩ ᏓᎧᏅᎩ, ᎾᏍᎩ ᎦᎵᏉᎩ ᏗᏓᏅᏙ ᎤᏁᎳᏅᎯ ᏧᏤᎵ ᎦᏛᎦ, ᎾᏍᎩ ᏂᎬᎾᏛ ᎡᎶᎯ ᏗᎦᏅᏒᎯ ᏥᎩ.</title>
    <meta name="description" content="Ale daquakahnanvgi, ale gvniyuquo, ayeli gasgilvi ale ayeli nunadvnv nasgi na nvgi iyanidv dinvnodv, ale ayeli aninv tsunadvsonvhi, vgadogvgi Unodena agina, alvhi iyusdi gesvgi, galiquogi dulugvgi, ale galiquogi dakanvgi, nasgi galiquogi Didanvdo Unelanvhi tsutseli gadvga, nasgi nigvnadv elohi diganvsvhi tsigi.&#10;And I beheld, and, lo, in the midst of the throne and of the four beasts, and in the midst of the elders, stood a Lamb as it had been slain, having seven horns and seven eyes, which are the seven Spirits of God sent forth into all the earth. [CNT]" />
