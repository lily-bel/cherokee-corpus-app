    <title>ᎾᏍᎩ ᎨᏥᏚᎢᏍᏓᏁᎸ ᎤᎾᎵᏱᎶᎯᏍᏗᏱ ᎤᏚᎩ ᎤᏅᎭ ᏔᎳᏚ ᏃᏥᎳᏍᏓᎸᎢ, ᎤᎵᏂᎩᏗᏳ ᏥᏓᏂᎧᎿᎭᏩᏗ ᎤᏁᎳᏅᎯ ᏗᎬᏩᎩᏨᏗ. ᎾᏍᎩ ᎤᏚᎩ ᎬᏗ ᎨᏒ ᏅᏗᎦᎵᏍᏙᏗᎭ, ᏣᎬᏫᏳᎯ ᎡᎩᎵᏈ, ᎠᏂᏧᏏ ᎬᏇᎯᏍᏗᎭ.</title>
    <meta name="description" content="Nasgi getsiduisdanelv unaliyilohisdiyi udugi unvha taladu notsilasdalvi, ulinigidiyu tsidanikahnawadi Unelanvhi digvwagitsvdi. Nasgi udugi gvdi gesv nvdigalisdodiha, tsagvwiyuhi Egiliqui, Anitsusi gvquehisdiha.&#10;Unto which promise our twelve tribes, instantly serving God day and night, hope to come. For which hope&#39;s sake, king Agrippa, I am accused of the Jews. [CNT]" />
