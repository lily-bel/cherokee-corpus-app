    <title>ᎾᏍᎩ ᎢᏳᏍᏗ ᎾᎦᎥ ᎪᎱᏍᏗ ᎤᎵᏏᎬ ᎢᏥᏁᏨ ᎢᎦ ᎦᏛ ᎠᏛᎪᏗ ᎨᏎᏍᏗ; ᎾᏍᎩᏃ Ꮎ ᎢᏣᏙᏅᎸᎢ ᏕᎧᏅᏑᎸ, ᎦᏌᎾᎵ ᎬᏂᎨᏒ ᎢᎬᏁᏗ ᎨᏎᏍᏗ. (Nasgi iyusdi nagav gohusdi ulisigv itsinetsv iga gadv advgodi gesesdi; nasgino na itsadonvlvi dekanvsulv, gasanali gvnigesv igvnedi gesesdi.) — Cherokee Corpus</title>
