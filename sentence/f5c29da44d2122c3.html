    <title>ᏥᏅᏩᏍᏛᏉ ᏝᏍᎪ ᏣᏤᎵᎦᏯ ᏱᎨᏎᎢ?  ᏣᎾᏗᏅᏃ ᏝᏍᎪ ᏱᏣᎮ ᎭᏓᏅᏖᏍᎬᏉ ᎢᏨᏁᏗᏱ?  ᎦᏙᏃ ᎯᎠ ᎾᏍᎩ ᏂᎤᏍᏗ ᎢᏦᏢᏅ ᏣᎾᏫᏱ?  ᎥᏝᏍᎩᏂ ᏴᏫᏉ ᏱᎩᏯᏥᎪᏁᎸ, ᎤᏁᎳᏅᎯᏍᎩᏂ ᎯᏯᏥᎪᏁᎸ. (Tsinvwasdvquo tlasgo tsatseligaya yigesei?  Tsanadinvno tlasgo yitsahe hadanvtesgvquo itsvnediyi?  Gadono hia nasgi niusdi itsotlvnv tsanawiyi?  Vtlasgini yvwiquo yigiyatsigonelv, Unelanvhisgini hiyatsigonelv.) — Cherokee Corpus</title>
