    <title>ᎢᎦᏚᎵᎪᎢ, ᎠᏎᏃ ᎥᏝ ᏱᏥᏩᏘᏍᎪᎢ; ᏕᏣᏓᎯᎰᎢ ᎠᎴ ᎢᏤᎵᎯᏍᎪ ᎢᏥᏩᏛᏗᏱ ᎠᏎᏃ ᎥᏝ ᏱᏥᏩᏘᏍᎪᎢ; ᏕᏣᎵᎰᎢ ᎠᎴ ᏓᎿᎭᏩ ᎢᏤᎪᎢ, ᎠᏎᏃ ᎥᏝ ᏱᏥᏩᏘᏍᎪ ᏅᏗᎦᎵᏍᏙᏗᏍᎪ ᏂᏥᏔᏲᎯᎲᎾ ᎨᏒᎢ. (Igaduligoi, aseno vtla yitsiwatisgoi; detsadahihoi ale itselihisgo itsiwadvdiyi aseno vtla yitsiwatisgoi; detsalihoi ale dahnawa itsegoi, aseno vtla yitsiwatisgo nvdigalisdodisgo nitsitayohihvna gesvi.) — Cherokee Corpus</title>
