    <title>ᏓᏓᎿᎭᏩᏍᏛ ᎢᏧᎳᎭ ᎦᎶᏁᏛ ᏙᎩᎾᏛᏅ; ᎠᏎᏃ ᎠᏴ ᎬᏃᏛ ᎢᎩ, ᎥᏝᏍᎩᏂᏃᏅ ᎿᎭᏉ ᎠᏴ ᏱᎩ, ᎦᎶᏁᏛᏍᎩᏂ ᎬᏃᏛ ᎠᎩᏯᎠ; ᏄᏍᏛᏃ ᎿᎭᏉ ᎦᎴᏂᏙᎲ ᎠᏂ ᎤᏇᏓᎵ ᎨᎥᎢ, ᎦᎴᏂᏙᎭ ᏥᏯᎵᏍᎦᏍᏙᏛ ᎤᏁᎳᏅᎯ ᎤᏪᏥ; ᎾᏍᎩ ᎠᎩᎨᏳᎯᏳ ᏥᎨᏒᎩ, ᎠᎴ ᎤᏩᏒ ᏥᏚᏓᏲᏎ ᎠᏴ ᎠᎩᏍᏕᎵᏍᎬᎢ.</title>
    <meta name="description" content="Dadahnawasdv itsulaha Galonedv doginadvnv; aseno ayv gvnodv igi, vtlasgininonv hnaquo ayv yigi, Galonedvsgini gvnodv agiyaa; nusdvno hnaquo galenidohv ani uquedali gevi, galenidoha tsiyalisgasdodv Unelanvhi Uwetsi; nasgi agigeyuhiyu tsigesvgi, ale uwasv tsidudayose ayv agisdelisgvi.&#10;I am crucified with Christ: nevertheless I live; yet not I, but Christ liveth in me: and the life which I now live in the flesh I live by the faith of the Son of God, who loved me, and gave himself for me. [CNT]" />
