    <title>ᏕᏣᎵᏂᎪᏍᎬᎢ ᎬᏔᏅᎯ ᎤᏣᏘ ᎤᎵᏂᎩᏛ ᎨᏒᎢ, ᎾᏍᎩᏯ ᏄᎵᏂᎬᎬ ᎦᎸᏉᏗᏳ ᎤᏤᎵᎦ, ᎾᏍᎩ ᏂᎦᎥᏉ ᎤᎬᏩᎵ ᏗᏨᏂᏗᏳ ᎢᏣᎵᏍᏙᏗᏱ, ᎠᎴ ᎪᎯᏗᏳ ᎤᏁᎳᎩ ᎢᏤᎵᏍᎬ ᎢᏥᎩᎵᏲᎬᎢ, ᎤᎵᏠᏯᏍᏙᏗᏱ ᎠᎵᎮᎵᏍᏗ ᎨᏒᎢ; (Detsalinigosgvi gvtanvhi utsati ulinigidv gesvi, nasgiya nulinigvgv galvquodiyu utseliga, nasgi nigavquo ugvwali ditsvnidiyu itsalisdodiyi, ale gohidiyu unelagi itselisgv itsigiliyogvi, ulitloyasdodiyi alihelisdi gesvi;) — Cherokee Corpus</title>
