    <title>ᏅᏙ ᎢᎦ ᎡᎯ ᎤᏤᎵᏛ ᎤᏬᏚᎯᏳ ᎨᏒᎢ, ᎠᎴ ᎤᏬᏚᎯᏳ ᎨᏒ ᏅᏙ ᏒᏃᏱ ᎡᎯ ᏅᏩᏓᎴᎢ, ᎠᎴ ᏧᏃᏚᎯᏳ ᎨᏒ ᏃᏈᏏ ᏅᏩᏓᎴᎢ; ᎠᎴ ᏃᏈᏏ ᎧᎸ ᎤᏬᏚᎯᏳ ᎨᏒ ᏅᏩᏓᎴ ᏄᏍᏙ ᏃᏈᏏ ᏄᏍᏛ ᎤᏬᏚᎯᏳ ᎨᏒᎢ. (Nvdo iga ehi utselidv uwoduhiyu gesvi, ale uwoduhiyu gesv nvdo svnoyi ehi nvwadalei, ale tsunoduhiyu gesv noquisi nvwadalei; ale noquisi kalv uwoduhiyu gesv nvwadale nusdo noquisi nusdv uwoduhiyu gesvi.) — Cherokee Corpus</title>
