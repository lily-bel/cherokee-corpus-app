    <title>ᎠᎴ ᎬᏂᎨᏒ ᏅᏋᏁᎸᎢ ᏅᏓᏳᎵᏍᏙᏔᏅᎩ ᎠᏇᏅᏒᎩ, ᎠᎴ ᎬᏂᎨᏒ ᏂᎦᏥᏴᏁᎸ ᎣᏍᏛ ᎧᏃᎮᏛ ᎾᏍᎩ ᏧᎾᏓᎴᏅᏛ ᏴᏫ ᎦᏥᏯᎵᏥᏙᏁᎲᎢ; ᎠᏂᏏᏴᏫᎭᏍᎩᏂ ᎤᏕᎵᏛ ᎬᏂᎨᏒ ᏂᎦᏥᏴᏁᎸᎩ ᏗᏂᏃᏣᎵ ᎨᏒᎢ, ᏯᏎᎦᎩ ᎠᏎᏉ ᏱᏙᏥᏍᏆᎸᏓ ᎠᎴ ᎠᏎᏉ ᏱᏓᎩᏍᏆᎸᏔᏅ ᎠᏇᎵᏒᎩ. (Ale gvnigesv nvquvnelvi nvdayulisdotanvgi aquenvsvgi, ale gvnigesv nigatsiyvnelv osdv kanohedv nasgi tsunadalenvdv yvwi gatsiyalitsidonehvi; anisiyvwihasgini udelidv gvnigesv nigatsiyvnelvgi dininotsali gesvi, yasegagi asequo yidotsisqualvda ale asequo yidagisqualvtanv aquelisvgi.) — Cherokee Corpus</title>
