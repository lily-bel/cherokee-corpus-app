    <title>ᎡᏣᏯᏂᏍᎨᏍᏗᏍᎩᏂ, ᎮᎨᏍᏗ ᎠᎴ ᏣᏂᏏᎲᏍᎨᏍᏗ ᎡᎳᏗ ᎨᏒ ᏗᏂᏢᏗᏱ; ᎾᏍᎩᏃ ᏫᏣᏯᏅᏛ ᎦᎷᎨᏍᏗ, ᎯᎠ ᎢᏳᏣᏪᏎᏗ ᏱᎩ, ᎩᎾᎵᎢ, ᎦᎸᎳᏗᏢᏍᏙᏗ ᏫᎶᎯ; ᎿᎭᏉ ᎡᏣᎸᏉᏗᏳ ᎨᏎᏍᏗ ᎠᏂᎦᏔᎲ ᎢᏧᎳᎭ ᎢᏥᏂᏜᏓᎢ [ᏗᎵᏍᏓᏴᏗᏱ.]</title>
    <meta name="description" content="Etsayanisgesdisgini, hegesdi ale tsanisihvsgesdi eladi gesv dinitlvdiyi; nasgino witsayanvdv galugesdi, hia iyutsawesedi yigi, Ginalii, galvladitlvsdodi wilohi; hnaquo etsalvquodiyu gesesdi anigatahv itsulaha itsinidlai [dilisdayvdiyi.]&#10;But when thou art bidden, go and sit down in the lowest room; that when he that bade thee cometh, he may say unto thee, Friend, go up higher: then shalt thou have worship in the presence of them that sit at meat with thee. [CNT]" />
