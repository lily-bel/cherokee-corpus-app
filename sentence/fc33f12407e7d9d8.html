    <title>ᎤᎬᏫᏳᎯᏃ ᎿᎭᏉ ᎤᏁᏤᎴ ᎯᎠ ᏄᏪᏎᎴᎢ, ᏣᏠᎾᏍᏗ! ᏝᏍᎪ ᏂᎯ ᎢᏥᏏᏴᏫᎭ ᎨᏒ ᎤᎾᏙᏓᏆᏍᎬ ᏰᏤᎵᏌᏕᏍᎪ ᏗᎨᎳᏍᏗᏱ ᎢᏣᏤᎵ ᏩᎦ ᎠᎴ ᏐᏈᎵᏗᎦᎵᎠᏅᎯᏛ, ᎠᎴ ᏰᏣᏘᏁᎪ ᎠᎹ ᏰᏣᏗᏔᏍᏔᏁᎪᎢ?</title>
    <meta name="description" content="Ugvwiyuhino hnaquo unetsele hia nuweselei, Tsatlonasdi! tlasgo nihi itsisiyvwiha gesv unadodaquasgv yetselisadesgo digelasdiyi itsatseli waga ale soquilidigalianvhidv, ale yetsatinego ama yetsaditastanegoi?&#10;The Lord then answered him, and said, Thou hypocrite, doth not each one of you on the sabbath loose his ox or his ass from the stall, and lead him away to watering? [CNT]" />
