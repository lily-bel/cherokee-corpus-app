    <title>ᎤᏁᎳᏅᎯᏍᎩᏂ ᏥᏔᏲᏎᎭ ᎾᏍᎩ ᏂᎯ ᎪᎱᏍᏗ ᎤᏐᏅ ᏗᏥᎸᏫᏍᏓᏁᏗᏱ ᏂᎨᏒᎾ; ᎥᏝ ᎠᏴ ᎣᏏᏳ ᎣᎩᏰᎸᏒ ᎬᏂᎨᏒ ᎢᏳᎵᏍᏙᏗᏱ ᎠᏆᏚᎵᏍᎬ ᏱᏅᏗᎦᎵᏍᏙᏗᎭ, ᏂᎯᏍᎩᏂ ᎾᏍᎩ Ꮎ ᏚᏳᎪᏛ ᎨᏒ ᎢᏣᏛᏁᏗᏱ, ᎤᏁᎳᎩ ᎣᎩᏐᏅᎢᏍᏔᏅᎯ ᏱᏅᏩᏍᏗ. (Unelanvhisgini tsitayoseha nasgi nihi gohusdi usonv ditsilvwisdanediyi nigesvna; vtla ayv osiyu ogiyelvsv gvnigesv iyulisdodiyi aquadulisgv yinvdigalisdodiha, nihisgini nasgi na duyugodv gesv itsadvnediyi, unelagi ogisonvistanvhi yinvwasdi.) — Cherokee Corpus</title>
    <meta name="description" content="Now I pray to God that ye do no evil; not that we should appear approved, but that ye should do that which is honest, though we be as reprobates." />
