    <title>ᎥᏝᏰᏃ ᏲᎦᏚᎵᎭ, ᎢᏓᎵᏅᎵ, ᏂᏥᎦᏔᎲᎾᏉ ᎢᏳᎵᏍᏙᏗᏱ ᎾᏍᎩ ᎤᏕᏯᏙᏗ ᎣᎩᎷᏤᎸ ᎡᏏᏱ, ᎾᏍᎩ ᎤᎶᏒᏍᏔᏅᎯ ᎦᎨᏛ ᎣᎩᎷᏤᎸᎢ, ᎤᎶᏒᏍᏔᏅᎯ ᏂᏙᎦᎵᏂᎬᎬᎢ, ᎾᏍᎩᏃ ᏅᏓᎦᎵᏍᏙᏗᏍᎬᎩ ᎣᎦᎸᏲᎵᎸᎩ ᏦᎦᏛᏂᏗᏍᏗᏱ; (Vtlayeno yogaduliha, idalinvli, nitsigatahvnaquo iyulisdodiyi nasgi udeyadodi ogilutselv Esiyi, nasgi ulosvstanvhi gagedv ogilutselvi, ulosvstanvhi nidogalinigvgvi, nasgino nvdagalisdodisgvgi ogalvyolilvgi tsogadvnidisdiyi;) — Cherokee Corpus</title>
