    <title>ᎢᏳᏃ ᎠᎾᎵᏅᏟ ᎯᎠ ᎾᏍᎩ ᏱᎩᏯᏅᏓᏗᏍᏔᏅ, ᎰᏍᏛ ᎨᏎᏍᏗ ᎡᏣᏅᏏᏓᏍᏗ ᏥᏌ ᎦᎶᏁᏛ ᎤᏤᎵᎦ, ᎡᏤᎳᏍᏔᏅᎯ ᎨᏎᏍᏗ ᎧᏃᎮᏛ ᎪᎯᏳᏗ ᎨᏒ ᏥᎧᏃᎮᎭ, ᎠᎴ ᎣᏍᏛ ᏗᏕᏲᏗ ᎨᏒᎢ, ᎾᏍᎩ ᎦᏳᎳ ᏗᏣᏂᏴᏛ ᏥᎩ. (Iyuno analinvtli hia nasgi yigiyanvdadistanv, hosdv gesesdi etsanvsidasdi Tsisa Galonedv utseliga, etselastanvhi gesesdi kanohedv gohiyudi gesv tsikanoheha, ale osdv dideyodi gesvi, nasgi gayula ditsaniyvdv tsigi.) — Cherokee Corpus</title>
