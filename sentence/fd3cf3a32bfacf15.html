    <title>ᎤᏲ ᏦᎦᏓᏅᏔᏩᏕᎪ ᎾᏍᎩᏯ, ᎠᏎᏃ ᏯᏃ ᎣᏣᎵᎮᎵᎪᎢ; ᎤᏲ ᏥᏃᎦᏛᎿᎭᏕᎪ ᎾᏍᎩᏯ, ᎠᏎᏃ ᎤᏂᏣᏘ ᏙᏤᏅᎢᏍᏗᏍᎪᎢ; ᎪᎱᏍᏗ ᏃᎩᎲᎾ ᏥᎨᏐ ᎾᏍᎩᏯ, ᎠᏎᏃ ᏂᎦᏗᏳ ᏧᏓᎴᏅᏛ ᎣᎦᏤᎵᎦ. (Uyo tsogadanvtawadego nasgiya, aseno yano otsaliheligoi; uyo tsinogadvhnadego nasgiya, aseno unitsati dotsenvisdisgoi; gohusdi nogihvna tsigeso nasgiya, aseno nigadiyu tsudalenvdv ogatseliga.) — Cherokee Corpus</title>
