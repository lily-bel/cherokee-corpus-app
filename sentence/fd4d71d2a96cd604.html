    <title>ᎾᏍᎩ ᎢᏳᏍᏗ ᏞᏍᏗ ᏯᏕᎰᏍᎨᏍᏗ ᎯᏃᎮᏍᎬ ᎤᎬᏫᏳᎯ ᎢᎦᏤᎵᎦ, ᎠᎴ ᏞᏍᏗ ᏱᏍᏆᏕᎰᏍᎨᏍᏗ ᎠᏴ ᏥᏴᎩ ᎾᏍᎩ ᎤᏤᎵᎦ, ᏤᎳᏗᏍᏗᏍᎨᏍᏗᏍᎩᏂ ᎠᎩᎵᏲᎬ ᎣᏍᏛ ᎧᏃᎮᏛ, ᏣᏍᏕᎵᏍᎨᏍᏗ ᎤᎵᏂᎩᏗ ᎨᏒ ᎤᏁᎳᏅᎯ, (Nasgi iyusdi tlesdi yadehosgesdi hinohesgv ugvwiyuhi igatseliga, ale tlesdi yisquadehosgesdi ayv tsiyvgi nasgi utseliga, tseladisdisgesdisgini agiliyogv osdv kanohedv, tsasdelisgesdi ulinigidi gesv Unelanvhi,) — Cherokee Corpus</title>
