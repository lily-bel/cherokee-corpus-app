    <title>ᎾᏍᎩ Ꮎ ᎤᏚᎸᏗ ᏄᎵᏍᏓᏁᎲᎾ ᏂᏚᎩᏨᏂᏒ ᎠᏥᎸ-ᎤᏪᎳᏍᏗᏱ, ᎾᏍᎩ ᎾᎾᏛᏁᎲ ᏄᏂᎬᏫᏳᏌᏕᎩ ᎠᏥᎸᎠᏁᎶᎯ, ᎢᎬᏱ ᎤᏅᏒ ᎤᏂᏍᎦᏅᏨ ᎠᎫᏴᏙᏗ, ᎢᏉᏃ ᏴᏫ ᎤᏂᏍᎦᏅᏨ ᎠᎫᏴᏙᏗ; ᎾᏍᎩᏰᏃ ᎯᎠ ᏌᏉ ᏄᏛᏁᎴᎢ, ᎾᎯᏳ ᎤᏩᏒ ᎤᏓᎵᏍᎪᎸᏔᏅ. (Nasgi na udulvdi nulisdanehvna nidugitsvnisv atsilvuwelasdiyi, nasgi nanadvnehv nunigvwiyusadegi atsilvanelohi, igvyi unvsv unisganvtsv aguyvdodi, iquono yvwi unisganvtsv aguyvdodi; nasgiyeno hia saquo nudvnelei, nahiyu uwasv udalisgolvtanv.) — Cherokee Corpus</title>
