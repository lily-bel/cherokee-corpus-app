    <title>ᎣᏂᏃ ᎬᏂᎨᏒ ᏂᏚᏛᏁᎴ ᏌᏚ ᎢᏯᏂᏛ ᎠᎾᎵᏍᏓᏴᎲᏍᎬᎢ, ᎠᎴ ᏚᎬᏍᎪᎸᏁ ᏂᎦᎵᏍᏙᏗᏍᎨ ᏄᏃᎯᏳᏒᎾ ᎨᏒ ᎠᎴ ᏗᏍᏓᏱᏳ ᎨᏒ ᏧᏂᎾᏫ, ᏂᏚᏃᎯᏳᏅᎾ ᎨᏒ ᎢᏳᏍᏗ ᎾᏍᎩ ᎬᏩᎪᎲᎯ ᏧᎴᎯᏌᏅᎯ ᏂᎨᏎᎢ. (Onino gvnigesv nidudvnele sadu iyanidv analisdayvhvsgvi, ale dugvsgolvne nigalisdodisge nunohiyusvna gesv ale disdayiyu gesv tsuninawi, nidunohiyunvna gesv iyusdi nasgi gvwagohvhi tsulehisanvhi nigesei.) — Cherokee Corpus</title>
