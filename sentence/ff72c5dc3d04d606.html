    <title>ᎠᎴ ᏞᏍᏗ ᎤᏓᎪᎵᏰᏗᏱ ᎨᏒ ᏫᏗᏍᎩᏯᏘᏅᏍᏔᏅᎩ, ᏍᎩᏳᏓᎴᏍᎨᏍᏗᏉᏍᎩᏂ ᎤᏥ ᎨᏒᎢ.  ᏣᏤᎵᎦᏰᏃ ᏣᎬᏫᏳᎯ ᎨᏒᎢ, ᎠᎴ ᏣᎵᏂᎩᏗᏱ ᎨᏒᎢ, ᎠᎴ ᎡᏣᎸᏉᏗᏳ ᎨᏒ ᏂᎪᎯᎸᎢ.  ᎡᎺᏅ. (Ale tlesdi udagoliyediyi gesv widisgiyatinvstanvgi, sgiyudalesgesdiquosgini utsi gesvi.  Tsatseligayeno tsagvwiyuhi gesvi, ale tsalinigidiyi gesvi, ale etsalvquodiyu gesv nigohilvi.  Emenv.) — Cherokee Corpus</title>
